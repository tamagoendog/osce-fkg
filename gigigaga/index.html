<style>
:root{
  --paper:#FDF9E9; --grid:#F1E9C9; --card:#FFFFFF; --ink:#0F3B28; --muted:#4F6B5B; --line:#0F3B28;
  --green:#1E7F47; --mint:#A8E0BC; --mint-soft:#E2F4E7; --yolk:#FDD84A; --yolk-soft:#FFF3BF;
  --pink:#F7A8B5; --red:#C8343E; --red-soft:#FBE3E3; --blue:#3E6BEA; --blue-soft:#E3EAFE; --lav:#8C76E0; --lav-soft:#EEE9FF;
  --shell:#FFF8E8; --tooth:#FFFFFF; --dentin:#FFE9A8; --pulp:#FFB3BF; --sticker:#FDF9E9;
  --f-hand:"Gaegu","Chalkboard SE","Comic Sans MS","Marker Felt",cursive;
  --f-body:"Nunito","Avenir Next","Segoe UI",system-ui,sans-serif;
  --wob:255px 18px 225px 18px/18px 225px 18px 255px;
  --wob2:18px 225px 18px 255px/255px 18px 225px 18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E2A1D; --grid:#16362A; --card:#133426; --ink:#FDF9E9; --muted:#A9C3B2; --line:#E9E2C4;
  --green:#8FD9A8; --mint:#2E7A52; --mint-soft:#1A4130; --yolk:#FDD84A; --yolk-soft:#3B3417;
  --pink:#F7A8B5; --red:#FF7B84; --red-soft:#3D1F22; --blue:#8CA8FF; --blue-soft:#1E2A4A; --lav:#B6A6FF; --lav-soft:#2A2445;
  --shell:#2A2619; --tooth:#1F4332; --dentin:#4A3F1C; --pulp:#5A2A34; --sticker:#FDF9E9; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E2A1D; --grid:#16362A; --card:#133426; --ink:#FDF9E9; --muted:#A9C3B2; --line:#E9E2C4;
  --green:#8FD9A8; --mint:#2E7A52; --mint-soft:#1A4130; --yolk:#FDD84A; --yolk-soft:#3B3417;
  --pink:#F7A8B5; --red:#FF7B84; --red-soft:#3D1F22; --blue:#8CA8FF; --blue-soft:#1E2A4A; --lav:#B6A6FF; --lav-soft:#2A2445;
  --shell:#2A2619; --tooth:#1F4332; --dentin:#4A3F1C; --pulp:#5A2A34; --sticker:#FDF9E9; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;overscroll-behavior-y:none}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px dashed var(--blue);outline-offset:3px}
h1,h2,h3,.hand{font-family:var(--f-hand);font-weight:700;letter-spacing:.01em}
h2{font-size:32px;line-height:1.05;margin:0;text-wrap:balance}
h3{font-size:24px;line-height:1.1;margin:0 0 6px}
p{margin:0}
.muted{color:var(--muted)}
.hl{background:linear-gradient(100deg,transparent 1%,var(--yolk) 3%,var(--yolk) 97%,transparent 99%);background-size:100% 86%;background-position:0 60%;background-repeat:no-repeat;padding:0 3px;color:#13291F;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hl.m{background-image:linear-gradient(100deg,transparent 2%,var(--mint) 4%,var(--mint) 96%,transparent 98%)}
.hl.p{background-image:linear-gradient(100deg,transparent 2%,var(--pink) 4%,var(--pink) 96%,transparent 98%)}
/* hand-drawn box */
.sk{position:relative;background:var(--card);border:2.5px solid var(--line);border-radius:var(--wob);padding:16px}
.sk.alt{border-radius:var(--wob2)}
.sk.tilt{transform:rotate(-.6deg)}
.sk.tilt2{transform:rotate(.5deg)}
.sk.yolk{background:var(--yolk-soft)} .sk.mint{background:var(--mint-soft)} .sk.lav{background:var(--lav-soft)} .sk.blue{background:var(--blue-soft)} .sk.red{background:var(--red-soft)}
.tape{position:absolute;top:-12px;left:50%;width:84px;height:22px;transform:translateX(-50%) rotate(-3deg);background:var(--yolk);opacity:.75;border-radius:3px}
.doodle{display:block;width:100%;height:auto;max-width:100%}
.doodle .s{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.doodle text{font-family:var(--f-hand);font-weight:700;fill:var(--ink);font-size:15px}
.wob{filter:url(#wobble)}
/* header */
header{padding-block:14px 6px}
.hrow{display:flex;align-items:center;gap:10px}
.brand{flex:1;min-width:0}
.brand .eb{font-family:var(--f-hand);font-size:17px;color:var(--muted)}
.brand h1{font-size:34px;line-height:.95;margin:0}
.brand h1 span{color:var(--red)}
.qbtn{flex:0 0 auto;width:48px;height:48px;border:2.5px solid var(--line);border-radius:var(--wob);background:var(--yolk);font-family:var(--f-hand);font-size:26px;font-weight:700;cursor:pointer;color:#13291F}
.qbtn[aria-selected="true"]{background:var(--mint)}
/* bottom nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:2.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);max-width:640px;margin:0 auto}
.tab{border:0;background:none;cursor:pointer;min-height:62px;padding:6px 2px 6px;display:grid;justify-items:center;align-content:center;gap:1px;color:var(--muted);font-family:var(--f-hand);font-size:17px;font-weight:700}
.tab svg{width:28px;height:28px}
.tab svg .s{stroke:currentColor}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"] .ic{background:var(--yolk);border-radius:var(--wob)}
.tab .ic{display:grid;place-items:center;width:44px;height:32px}
main{padding-block:10px calc(100px + env(safe-area-inset-bottom,0px))}
section[role="tabpanel"]{display:grid;gap:16px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 20px;border:2.5px solid var(--line);border-radius:var(--wob);background:var(--yolk);color:#13291F;font-family:var(--f-hand);font-size:23px;font-weight:700;cursor:pointer;box-shadow:3px 4px 0 var(--line);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--line)}
.btn.mint{background:var(--mint)} .btn.white{background:var(--card);color:var(--ink)}
.btn.sm{min-height:42px;font-size:19px;padding:6px 14px;box-shadow:2px 3px 0 var(--line)}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:default;box-shadow:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spacer{flex:1}
.seg{display:flex;gap:6px;padding:4px;border:2.5px solid var(--line);border-radius:var(--wob);background:var(--card);width:max-content;max-width:100%}
.seg button{border:0;background:none;cursor:pointer;padding:6px 16px;min-height:42px;border-radius:var(--wob2);font-family:var(--f-hand);font-size:21px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--mint);color:#13291F}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2.2px solid var(--line);border-radius:var(--wob2);background:var(--card);padding:6px 13px;min-height:42px;cursor:pointer;font-family:var(--f-hand);font-size:20px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--yolk);color:#13291F}
.chip small{font-family:var(--f-body);font-size:12px;font-weight:800;margin-left:4px;opacity:.75}
/* home */
.hero{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center}
.hero .bubble{position:relative}
.bubble{background:var(--card);border:2.5px solid var(--line);border-radius:var(--wob);padding:12px 14px;font-family:var(--f-hand);font-size:21px;line-height:1.2}
.egg{width:120px;height:auto}
.trail{list-style:none;margin:0;padding:0;display:grid;gap:0;position:relative}
.trail li{display:grid;grid-template-columns:62px 1fr;gap:12px;align-items:center;padding:8px 0;position:relative}
.trail li:not(:last-child)::after{content:"";position:absolute;left:30px;top:58px;height:calc(100% - 44px);border-left:3px dashed var(--muted);opacity:.6}
.trail li:nth-child(even){transform:translateX(14px)}
.stone{width:58px;height:58px;display:grid;place-items:center;border:2.5px solid var(--line);border-radius:var(--wob);background:var(--card);font-family:var(--f-hand);font-size:26px;font-weight:700;cursor:pointer;position:relative;z-index:1}
.stone.done{background:var(--mint)} .stone.next{background:var(--yolk);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px) rotate(-3deg)}}
.trail .t{cursor:pointer;background:none;border:0;text-align:left;padding:0}
.trail .t b{display:block;font-family:var(--f-hand);font-size:23px;line-height:1.05}
.trail .t span{font-size:14px;color:var(--muted)}

/* ===== Belajar KG layout: sidebar di layar lebar, bottom nav di HP ===== */

a{color:inherit}
.small{font-size:14px}

.brand2{text-decoration:none;display:grid;line-height:1}

.botnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:2.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav{display:grid;justify-items:center;gap:2px;padding:8px 2px;text-decoration:none;color:var(--muted);font-family:var(--f-hand);font-size:16px;font-weight:700}

 {k:"ch",m:"how",t:"Cara silen bekerja",d:"seal",s:["Silen menutup fisur rapat","Gula tidak bisa sampai ke bakteri di dasar fisur","Bakteri tidak bisa membuat asam","Lesi awal berhenti berkembang"]},
 {k:"g",q:"Silen dipasang di atas lesi awal (white spot) yang masih ada bakterinya. Apa yang terjadi?",o:["Lesi berhenti selama silennya rapat","Lesi tetap membesar di bawah silen","Silen langsung lepas","Wajib dibur dulu"],y:"Bakteri tidak perlu dibunuh semua. Selama silen rapat, bakteri tidak dapat gula dan tidak bisa membuat asam. Yang menentukan berhasil atau tidak adalah keutuhan tepi silen."},
 {k:"c",m:"how",t:"5 bentuk fisur",d:"ftypes",b:`<p><b>U</b> lebar, paling gampang dimasuki silen. <b>V</b> menyempit ke bawah. <b>I</b> celah sempit dan panjang. <b>IK</b> mirip botol tinta: pintunya sempit, dasarnya lebar. <b>Y terbalik</b> bercabang di dasar.</p><p><span class="hl">Makin sempit fisurnya, makin sulit silen masuk.</span></p>`},
 {k:"c",m:"break",t:"Kapan PFS tidak dipakai",b:`<p>Setiap kontraindikasi punya alasannya:</p><ul><li><b>Fisur dangkal, self-cleansing</b>: memang tidak perlu ditutup.</li><li><b>Ada karies interproksimal yang perlu ditambal</b>: masalah yang lebih besar ditangani dulu.</li><li><b>Gigi baru erupsi sebagian</b>: tidak bisa dibuat kering, jadi silen resin gagal (GIC masih mungkin).</li><li><b>Sudah ada kavitas jelas</b>: bukan PFS lagi, evaluasi restorasi.</li><li><b>Isolasi tidak bisa dicapai</b>.</li></ul>`},
 {k:"c",m:"how",t:"Gigi sasaran dan jadwal kontrol",b:`<ul><li>Molar pertama permanen: erupsi <span class="hl">± 6–7 tahun</span></li><li>Premolar: ± 10–13 tahun (selektif)</li><li>Molar kedua: ± 11–13 tahun</li><li>Molar sulung juga bisa</li><li>Indikasi: gigi erupsi kurang dari 4 tahun, risiko karies sedang sampai tinggi</li></ul><p>Kontrol: risiko tinggi <b>± 3 bulan</b>, sedang <b>± 6 bulan</b>, rendah <b>6–12 bulan</b>.</p>`},
 {k:"g",q:"Saat kontrol, silennya hilang semua. Langsung pasang ulang?",o:["Nilai ulang dulu: risiko, diagnosis, dan kemampuan isolasi","Ya, langsung","Langsung restorasi kelas I","Biarkan saja"],y:"Silen yang lepas total adalah tanda ada yang salah: mungkin isolasinya gagal, atau sudah ada karies baru. Kalau penyebabnya tidak dicari, silen baru akan lepas lagi."},
 {k:"c",m:"keep",t:"Pegang",b:`<ul><li>Fisur sempit → plak menetap → asam → karies.</li><li>Silen bekerja sebagai <span class="hl">penghalang</span>, bukan pembunuh bakteri.</li><li>Fisur sehat <span class="hl p">tidak boleh dibur</span>.</li></ul>`}
]},
{id:"m3",t:"Dua bahan, dua cara nempel",min:8,inti:true,sub:"kunci semua langkah",cards:[
 {k:"c",m:"why",t:"Modul paling penting malam ini",b:`<p>Hampir semua langkah PFS, PRR, dan ART bisa kamu <span class="hl">turunkan sendiri</span> dari satu hal: <b>bahannya menempel dengan cara apa</b>.</p><p>Kalau kamu paham ini, separuh hafalan tidak perlu lagi.</p>`},
 {k:"c",m:"how",t:"GIC: nempel secara kimia",d:"bond",b:`<p>Bubuk kaca fluoroaluminosilikat + asam poliakrilat + <b>air</b> → reaksi asam-basa → mengeras.</p><p>Asam poliakrilatnya juga <span class="hl">mencengkeram kalsium di gigi</span> (ikatan kimia, pertukaran ion). Mirip magnet: menempel sendiri, tidak perlu dikunci.</p>`},
 {k:"ch",m:"how",t:"Dari situ, langkah GIC jadi masuk akal",s:["Ikatan kimia butuh permukaan bersih → <b>dentin conditioner</b> (asam poliakrilat) membersihkan smear layer.","Reaksinya butuh air → keringkan sampai <span class='hl'>LEMBAB</span>, jangan kering.","Di awal GIC masih rapuh: kena air bisa larut, kekeringan bisa retak → <b>varnish/cocoa butter</b>.","Melepas fluor dan tahan lembab → cocok untuk <b>risiko tinggi</b>, anak rewel, gigi erupsi sebagian.","Tapi retensinya lebih lemah → kontrol lebih sering."]},
 {k:"g",q:"Habis conditioner, kamu keringkan GIC-nya sampai putih kapur seperti resin. Apa masalahnya?",o:["Desikasi: reaksi GIC butuh air, jadi ikatannya lemah","Tidak ada masalah, makin kering makin bagus","GIC jadi terlalu cepat keras","Warnanya jadi kuning"],y:"Kering seperti kapur adalah syarat untuk resin, bukan untuk GIC. GIC butuh air untuk bereaksi. Kalau terlalu kering (desikasi), ikatannya lemah dan gigi bisa ngilu. Di lembar penilaian ini termasuk kesalahan fatal."},
 {k:"c",m:"how",t:"Resin: mengunci secara mekanis",b:`<p><b>Etsa</b> (asam fosfat 37%) melarutkan sebagian prisma enamel sehingga terbentuk pori mikro. Permukaannya jadi tampak <span class="hl">putih kapur</span>.</p><p>Resin cair masuk ke pori, disinar, lalu mengeras jadi "tag" yang mengunci. Mirip akar pohon di tanah gembur.</p>`},
 {k:"ch",m:"how",t:"Dari situ, langkah resin jadi masuk akal",s:["Butuh pori → <b>etsa wajib</b>.","Pori harus terbuka → <b>kering dan bebas saliva</b>. Kena saliva = etsa ulang.","Mengeras karena sinar → <b>light cure</b>. Sinar tidak tembus dalam → komposit diisi <span class='hl'>per 2 mm</span>.","Bahan kental (komposit, flowable filled) butuh <b>bonding</b> sebagai jembatan. Silen unfilled cukup encer untuk masuk pori sendiri, jadi di lab tanpa bonding.","Retensi kuat tapi tanpa fluor → cocok untuk <b>risiko rendah</b> dan anak kooperatif."]},
 {k:"g",q:"Enamel sudah putih kapur, lalu kena ludah anak. Kenapa etsa harus diulang?",o:["Protein saliva menutup pori, jadi resin tidak bisa masuk","Saliva menetralkan resin","Saliva membuat enamel lebih keras","Tidak perlu diulang"],y:"Resin menempel dengan masuk ke pori. Protein saliva langsung melapisi permukaan dan menutup pori itu. Tanpa pori tidak ada tag, dan silen akan lepas."},
 {k:"c",m:"keep",t:"GIC vs resin dalam satu tabel",b:`<div class="mini-tbl"><table><thead><tr><th></th><th>GIC</th><th>Resin</th></tr></thead><tbody>
 <tr><td>Siapkan permukaan</td><td>Conditioner</td><td>Etsa 37%</td></tr>
 <tr><td>Sebelum bahan</td><td><span class="hl">Lembab</span></td><td><span class="hl m">Kering putih kapur</span></td></tr>
 <tr><td>Perantara</td><td>Tidak ada</td><td>Bonding (untuk filled/komposit)</td></tr>
 <tr><td>Mengeras</td><td>Reaksi sendiri</td><td>Light cure</td></tr>
 <tr><td>Akhir</td><td>Varnish/cocoa butter</td><td>Cek, poles</td></tr>
 <tr><td>Kena saliva</td><td>Lebih toleran</td><td>Etsa ulang</td></tr>
 <tr><td>Kelebihan</td><td>Fluor</td><td>Retensi kuat</td></tr></tbody></table></div>`},
 {k:"g",q:"Anak 8 tahun, dmft 7, rewel, belum pernah ke dokter gigi. Silen pakai apa?",o:["GIC, karena risikonya tinggi dan GIC tahan lembab serta melepas fluor","Resin, karena retensinya paling kuat","Komposit packable","Tidak perlu silen"],y:"DMFT ≥ 4,5 berarti risiko tinggi, jadi butuh fluor. Anak rewel berarti isolasi sulit, dan GIC lebih toleran lembab. Kekurangannya retensi lebih lemah, jadi kontrol tiap ± 3 bulan."},
 {k:"c",m:"keep",t:"Angka dan nama produk",b:`<ul><li>DMFT <b>≤ 4,4</b> → resin. DMFT <b>≥ 4,5</b> → <span class="hl">GIC</span>.</li><li><b>Fuji VII</b> (bubuk pink): GIC fluor tinggi (tipe VII) yang dipakai sebagai silen fisur.</li><li><b>Fuji IX GP</b>: GIC restoratif kental untuk gigi posterior, dipakai untuk ART.</li><li>Daftar 9 tipe GIC: IV = silen fisur, VII = fluor tinggi, VIII = ART.</li><li>Silen <b>unfilled</b> (Fissured Nova Plus, Bioseal): etsa saja, tanpa bonding.</li><li><b>Diafil Flow</b> (filled): etsa + bonding.</li><li>GIC diaduk pakai <b>agate spatula</b>, tidak boleh diencerkan.</li></ul>`},
 {k:"c",m:"ana",t:"Kalau lupa di ruang ujian",b:`<p>Tanya diri sendiri: <span class="hl">"Bahan ini nempel pakai apa?"</span></p><p><b>Kimia (GIC)</b>: permukaannya harus bersih dan lembab, lalu dilindungi.</p><p><b>Kunci (resin)</b>: permukaannya harus berpori dan kering, lalu disinar.</p>`}
]},
{id:"m4",t:"Membaca karies",min:6,inti:true,sub:"permanen: ICDAS · sulung: K1–K4",cards:[
 {k:"c",m:"why",t:"Kedalaman lesi menentukan tipe tindakan",d:"depth",b:`<p>Bayangkan gedung: <b>enamel</b> lantai atas, <b>DEJ</b> lantai tengah, <b>dentin</b> lantai bawah, <b>pulpa</b> basement.</p><p>PRR <span class="hl">A</span> berhenti di setengah enamel, <span class="hl m">B</span> hampir DEJ, <span class="hl p">C</span> sudah masuk dentin.</p>`},
 {k:"c",m:"how",t:"ICDAS 0–6",b:`<ul><li><b>0</b> sehat, bahkan setelah dikeringkan 5 detik</li><li><b>1</b> putih/coklat baru terlihat <span class="hl">setelah dikeringkan</span></li><li><b>2</b> putih/coklat sudah terlihat <span class="hl">saat basah</span></li><li><b>3</b> enamel pecah, dentin <b>belum</b> terlihat</li><li><b>4</b> enamel tampak utuh tapi ada <span class="hl m">bayangan gelap</span> dentin di bawahnya</li><li><b>5</b> kavitas, dentin terlihat</li><li><b>6</b> kavitas luas, ½ permukaan atau lebih</li></ul>`},
 {k:"g",q:"Enamel tampak utuh, tapi di bawahnya ada bayangan abu-abu gelap. ICDAS berapa?",o:["4","3","2","5"],y:"Bayangan dari dentin dengan enamel yang tampak utuh = 4. Kalau enamelnya sudah pecah tapi dentin belum terlihat = 3."},
 {k:"c",m:"how",t:"Permanen pakai ICDAS, sulung pakai K",b:`<p><b>Gigi permanen</b> (16, 26, 36, 46, 17, 37, premolar): pakai <span class="hl">ICDAS</span>, ditambah WHO dan Mount &amp; Hume. <b>Jangan pakai K1–K4.</b></p><p><b>Gigi sulung</b> (51–85): pakai <span class="hl m">K1–K4</span>.</p><p><b>WHO</b>: D1 lesi enamel permukaan utuh, D2 kavitas enamel, D3 kavitas dentin, D4 sampai pulpa.</p><p><b>K (gigi sulung)</b>: K1 enamel, K2 dentin, K3 pulpa (vital: masih sakit; nonvital: tidak sakit lagi), K4 radiks (tinggal akar).</p><p>K3 nonvital: <b>DAAA</b> = abses (+), fistel (−), beberapa hari. <b>DAAK</b> = abses (+), fistel (+), sudah lama.</p><p><b>Mount & Hume</b>: Site 1 = pit fisur. Size 0 = lesi awal tanpa kavitas (white spot), 1 = kavitas kecil, dentin baru tersentuh, 2 = dentin sedang.</p>`},
 {k:"g",q:"Gigi 46: karies dentin di pit distal. Diagnosisnya ditulis pakai kode apa?",o:["ICDAS (plus WHO dan Mount & Hume), karena 46 gigi permanen","K2, karena sudah dentin","K1, karena masih kecil","DAAK"],y:"K1–K4 itu sistem diagnosis gigi sulung (51–85). 46 adalah molar pertama permanen, jadi pakai ICDAS, ditambah WHO D3 dan Mount & Hume Site 1 Size 2. Tulis deskriptif dulu: karies dentin pada pit distal."},
 {k:"g",q:"Radiolusensi hampir mencapai DEJ, enamel belum tembus. Tindakannya?",o:["PRR B (karies enamel lebih dari ½ tebal)","PRR A","PRR C","PFS"],y:"Belum melewati DEJ berarti masih di enamel. Tapi sudah lebih dari setengah tebal enamel, jadi tipe B. Kata kunci di soal: 'hampir mencapai DEJ'."},
 {k:"g",q:"Gigi 75: ada fistula, sudah lama, perkusi (−), tidak sakit lagi. Diagnosisnya?",o:["K3 nonvital, DAAK","K2","K3 vital","DAAA"],y:"Fistel (+) dan sudah lama berarti kronis (DAAK). Tidak sakit lagi dan perkusi (−) berarti pulpa nonvital."},
 {k:"c",m:"break",t:"Jebakan kode",b:`<ul><li>Kunci jawaban dan ringkasan sering beda kode ICDAS untuk kasus yang sama. Karena itu <span class="hl">tulis diagnosis deskriptif dulu</span> ("karies enamel pada pit mesial, < 0,5 mm"), baru kodenya.</li><li>Perubahan warna saja tidak cukup jadi alasan untuk membur.</li><li><b>Gigi permanen jangan diberi kode K1–K4.</b> K itu untuk gigi sulung. Kunci soal latihan lama sempat menulis K1 untuk gigi 16, jadi hati-hati.</li><li>ICDAS tidak otomatis menentukan tipe PRR. Tipe ditentukan oleh kedalaman lesi yang sebenarnya.</li></ul>`},
 {k:"c",m:"keep",t:"Posisi operator (jam)",b:`<ul><li>Regio 1 (kanan atas): operator 10.00, asisten 02.00</li><li>Regio 2 (kiri atas): 11.00, 02.30</li><li>Regio 3 (kiri bawah): 10.30, 02.30</li><li>Regio 4 (kanan bawah): <span class="hl">10.00</span>, 03.00</li></ul><p class="muted">Jam hanya panduan. Sesuaikan dengan tangan dominan dan kenyamanan.</p>`}
]},
{id:"m5",t:"PFS pakai GIC",min:5,inti:true,sub:"langkah + alasan",proc:"pfsgic",cards:[
 {k:"c",m:"why",t:"Turunkan dari Modul 3",b:`<p>GIC → permukaan bersih (<b>conditioner</b>) → <span class="hl">lembab</span> → adukan masih <b>glossy</b> → lindungi (<b>varnish</b>).</p><p>Sisanya pembuka dan penutup yang sama untuk semua stasiun: posisi, APD, cek oklusi, isolasi, 3 serangkai, sebut diagnosis.</p>`},
 {k:"g",q:"Setelah isolasi dan diagnosis, langkah pertama di gigi adalah…",o:["Pumice + brush, tanpa bur","Bur bulat ¼ di fisur","Etsa 37%","Langsung conditioner"],y:"Plak dan pelikel menghalangi bahan, jadi dibersihkan dulu. Fisurnya sehat, jadi tidak ada yang dibur."},
 {k:"ch",m:"how",t:"Alurnya",s:["Posisi, APD, cek oklusi, isolasi, diagnosis","Pumice + brush, cuci, keringkan","Conditioner 10–20 dtk","Cuci 15–30 dtk, keringkan secukupnya (lembab)","Aduk Fuji VII 1:1 → glossy, bisa ditarik ± 2 cm","Aplikasi dari bagian tertinggi","Cek pakai sonde, tambah kalau ada celah","Varnish/cocoa butter","Cek oklusi, buang kontak prematur","Varnish ulang"]},
 {k:"g",q:"Kenapa aplikasi dimulai dari bagian tertinggi?",o:["Bahan mengalir ke bawah sehingga udara tidak terjebak","Supaya cepat selesai","Supaya bagian terendah tetap terbuka","Karena di situ fisurnya paling dalam"],y:"Bahan yang mengalir dari atas mendorong udara keluar. Kalau mulai dari bawah, udara terjebak dan jadi gelembung, yaitu titik bocor."},
 {k:"g",q:"Kenapa varnish dioles DUA kali?",o:["Pertama melindungi GIC yang belum matang, kedua menutup bagian yang baru diasah","Supaya lebih mengkilap","Supaya lebih tebal","Karena varnish pertama selalu luntur"],y:"Varnish pertama tidak boleh ditunda (fatal kalau terlewat). Setelah cek oklusi, bagian yang diasah sudah tidak terlapisi lagi, jadi dioles ulang."},
 {k:"go",procs:["pfsgic"]}
]},
{id:"m6",t:"PFS pakai resin",min:4,sub:"langkah + alasan",proc:"pfsres",cards:[
 {k:"c",m:"why",t:"Turunkan dari Modul 3",b:`<p>Resin → butuh pori (<b>etsa</b>) → <span class="hl m">kering putih kapur</span> → silen masuk pori → <b>disinar</b>.</p>`},
 {k:"ch",m:"how",t:"Alurnya",s:["Posisi, APD, cek oklusi, isolasi, diagnosis","Pumice + brush, cuci, keringkan","Etsa 37% di pit/fisur 20 dtk","Bilas, keringkan sampai putih kapur","Silen tanpa gelembung (filled: bonding + LC dulu)","Light cure 15–20 dtk","Cek pakai sonde, tambah dan sinari kalau ada celah","Cek oklusi, buang kontak prematur"]},
 {k:"g",q:"Silen yang tersedia Diafil Flow (filled). Apa yang ditambahkan?",o:["Bonding + light cure sebelum silen","Conditioner","Varnish","Tidak ada"],y:"Bahan filled lebih kental dan tidak bisa masuk pori sendiri dengan baik, jadi butuh bonding sebagai jembatan. Ini aturan lab: unfilled tanpa bonding, filled dengan bonding."},
 {k:"g",q:"Silen berubah warna setelah disinar 5 detik. Sudah cukup?",o:["Belum. Perubahan warna bukan bukti sudah keras, ikuti durasi pabrik","Sudah","Sudah, kalau warnanya putih","Sudah, kalau tidak lengket"],y:"Bagian permukaan bisa berubah warna lebih dulu daripada bagian dalam. Curing yang kurang termasuk kesalahan fatal."},
 {k:"go",procs:["pfsres"]}
]},
{id:"m7",t:"PRR A, B, C",min:7,inti:true,sub:"kedalaman → bur → bahan",cards:[
 {k:"c",m:"why",t:"Buang yang sakit saja",b:`<p>Kasusnya: ada <b>satu</b> lubang kecil, fisur lain masih sehat.</p><p>Cara lama (restorasi kelas I) membur seluruh alur, sehingga jaringan sehat ikut hilang. <span class="hl">PRR</span> hanya membuang lesinya, lalu menyegel sisanya.</p>`},
 {k:"c",m:"how",t:"Makin dalam, makin butuh bahan yang kuat",d:"depth",b:`<p>Makin dalam lesinya → makin perlu bahan restoratif yang tahan kunyah (komposit) dan perekatnya (bonding).</p><p>Makin dekat ke pulpa → perlu anestesi, dan liner dipertimbangkan.</p>`},
 {k:"c",m:"keep",t:"Tabel A / B / C",b:`<div class="mini-tbl"><table><thead><tr><th></th><th>A</th><th>B</th><th>C</th></tr></thead><tbody>
 <tr><td>Dalam</td><td>&lt; ½ enamel (± &lt; 0,5 mm)</td><td>&gt; ½ enamel, hampir DEJ</td><td>Dentin</td></tr>
 <tr><td>Diagnosis</td><td>Karies enamel</td><td>Karies enamel, hampir DEJ</td><td>Karies dentin</td></tr>
 <tr><td>Mount &amp; Hume</td><td>Site 1 Size 1</td><td>Site 1 Size 1</td><td>Site 1 Size 2</td></tr>
 <tr><td>Bur</td><td>Bulat ¼ / ½</td><td>Bulat, ± 1–2 mm</td><td>≥ no. 2 / 330, bevel</td></tr>
 <tr><td>Anestesi</td><td>Tidak</td><td>Tidak</td><td>Ya</td></tr>
 <tr><td>Bahan</td><td>Etsa + silen</td><td>Etsa + bonding + komposit packable + silen</td><td>Seperti B, komposit per 2 mm</td></tr></tbody></table></div>`},
 {k:"g",q:"Kenapa tipe A cukup silen, tanpa komposit?",o:["Kavitasnya dangkal di enamel, silen sudah cukup mengisi dan menutup","Komposit tidak boleh untuk anak","Karena silen lebih kuat","Supaya lebih murah"],y:"Kavitas tipe A sangat dangkal, jadi silen yang menempel ke enamel teretsa sudah cukup. Kunci remed: preparasi, etsa, silen resin. Tanpa bonding, tanpa komposit."},
 {k:"g",q:"Di PRR B, bonding dioles di mana?",o:["Tepi dan dasar kavitas saja","Seluruh pit dan fisur","Tidak pakai bonding","Hanya di atas komposit"],y:"Komposit yang kental butuh jembatan ke dinding kavitas. Fisur sehat cukup dilapisi silen."},
 {k:"g",q:"Kenapa komposit di tipe C diisi per 2 mm?",o:["Sinar tidak tembus dalam, dan lapisan tipis mengurangi penyusutan","Supaya lebih cepat","Supaya warnanya rata","Karena dosen suka"],y:"Lapisan yang tebal tidak keras sampai dasar dan menyusut lebih besar, sehingga tepinya terlepas dari dinding."},
 {k:"c",m:"break",t:"Kapan BUKAN PRR",b:`<ul><li>Perlu restorasi interproksimal.</li><li>Karies luas atau mengenai banyak permukaan.</li><li>Semua pit dan fisur sudah karies (kelas I).</li><li>Gigi tidak bisa diisolasi.</li></ul><p><b>Liner Ca(OH)₂</b> hanya dipasang kalau dentin yang tersisa tipis. Bukan otomatis untuk tipe C.</p>`},
 {k:"c",m:"ana",t:"Seperti jalan berlubang",d:"road",b:`<p><b>A</b> = aspalnya cuma retak di permukaan, cukup dilapisi.</p><p><b>B</b> = lubang sedang, ditambal aspal lalu dilapisi.</p><p><b>C</b> = lubang dalam, ditambal berlapis-lapis sambil dipadatkan.</p>`},
 {k:"c",m:"break",t:"Sumbermu tidak sepakat, tanyakan dosen",b:`<ul><li>PRR A: kunci remed tanpa bonding, tabel buku pakai bonding.</li><li>Bur tipe B: catatan bilang no. 1–2, buku bilang no. ½.</li><li>Durasi etsa 20 atau 30 detik → jawab "sesuai petunjuk pabrik".</li></ul>`},
 {k:"go",procs:["prra","prrb","prrc"]}
]},
{id:"m8",t:"ART",min:7,inti:true,sub:"konservasi, tanpa bur",cards:[
 {k:"c",m:"why",t:"Kalau tidak ada listrik",b:`<p>Di daerah tanpa listrik atau dental unit, karies tetap harus dihentikan. WHO memperkenalkan <span class="hl">Atraumatic Restorative Treatment</span>: karies dibuang pakai <b>hand instrument</b>, lalu ditambal pakai <b>GIC</b>.</p><p>"Atraumatik" karena hampir tidak sakit, jadi anak tidak trauma.</p>`},
 {k:"c",m:"how",t:"Kenapa bisa tanpa bur",d:"indicator",b:`<p>GIC menempel secara kimia, jadi kavitas tidak perlu dibentuk untuk retensi. Itulah kenapa <span class="hl">bur tidak diperlukan</span>.</p><p><b>Caries indicator</b> mewarnai dentin terinfeksi (merah/biru), yaitu bagian yang harus dibuang. Lapisan di bawahnya dipertahankan.</p>`},
 {k:"ch",m:"how",t:"Empat fase, 14 langkah",s:["<b>Tandai</b>: cuci kavitas → caries indicator 10–15 dtk → cuci sampai beda warna terlihat","<b>Buang</b>: ekskavator kecil tajam → patahkan enamel yang menggantung pakai pahat → cuci sampai warna hilang","<b>Siapkan</b>: dentin conditioner 15 dtk → cuci → keringkan sampai <span class='hl'>lembab</span>","<b>Isi</b>: aduk Fuji IX 1:1, total 30 dtk (agate) → ball applicator → celluloid strip + tekan ibu jari","<b>Lindungi</b>: konturing sebelum keras, cek adaptasi → cocoa butter/varnish"]},
 {k:"g",q:"Kenapa ekskavatornya harus TAJAM?",o:["Biar memotong dentin lunak tanpa menekan, jadi tidak sakit","Biar cepat tumpul","Supaya bisa membuang enamel sehat","Supaya warna indikator hilang"],y:"Ekskavator tumpul menekan, dan tekanan itu yang bikin sakit. Padahal prinsip ART adalah atraumatik."},
 {k:"g",q:"Kenapa bubuk GIC dibagi dua saat diaduk?",o:["Supaya semua bubuk terbasahi rata dan adukan homogen","Supaya lebih cepat keras","Supaya warnanya lebih putih","Supaya tidak perlu conditioner"],y:"Kalau bubuk masuk sekaligus, adukannya menggumpal dan sebagian bubuk kering. Setengah 15 detik + setengah 15 detik = total 30 detik."},
 {k:"g",q:"Kenapa ditutup celluloid strip lalu ditekan ibu jari?",o:["Memadatkan bahan dan mendorongnya ke pit/fisur sekitar, tanpa lengket ke sarung tangan","Supaya cepat kering","Pengganti varnish","Supaya warnanya rata"],y:"Tekanan mendorong GIC masuk dan rapat ke dinding kavitas. Strip mencegah bahan lengket ke jari."},
 {k:"c",m:"break",t:"Kontraindikasi ART punya satu benang merah",b:`<p>Hampir semuanya berarti <span class="hl p">pulpa sudah terlibat</span>, atau alatnya tidak bisa menjangkau:</p><ul><li>Abses / fistula</li><li>Karies sudah mengenai pulpa</li><li>Pulpitis kronis</li><li>Gigi pernah sakit dalam waktu lama</li><li>Kavitas tidak terjangkau hand instrument</li></ul><p>ART tidak merawat pulpa, jadi tidak menyelesaikan masalahnya.</p><p><b>Indikasi</b>: terjangkau hand instrument, satu permukaan, karies enamel atau dentin yang belum pernah sakit.</p>`},
 {k:"g",q:"Gigi pernah sakit berhari-hari bulan lalu, sekarang tidak sakit. ART?",o:["Tidak. Sakit lama adalah tanda pulpa kemungkinan sudah terlibat","Ya, karena sekarang tidak sakit","Ya, asal pakai indikator","Ya, kalau Fuji IX"],y:"Sakit yang hilang setelah lama bisa berarti pulpanya sudah nekrosis. ART tidak merawat pulpa, jadi gigi ini perlu diperiksa untuk perawatan pulpa."},
 {k:"c",m:"keep",t:"Untung, rugi, gagal",b:`<p><b>Keuntungan</b>: tanpa listrik, murah, cepat, tidak banyak sakit, operator tidak perlu banyak latihan, ada fluor.</p><p><b>Kerugian (versi catatan)</b>: belum ada penelitian jangka panjang tentang efisiensinya. <b>Update literatur:</b> meta-analisis 2018 menemukan tumpatan ART satu permukaan bertahan ± 94% di gigi sulung (2 tahun) dan ± 87% di gigi permanen (3 tahun). Yang lemah itu tumpatan banyak permukaan.</p><p><b>Penyebab gagal</b>: kebanyakan kesalahan operator, misalnya adukan terlalu kental atau bahan dipaksa masuk.</p><p><b>Kalau pecah</b>: buang bagian yang pecah, cek sisanya masih melekat, lalu aplikasikan bahan baru.</p>`},
 {k:"c",m:"ana",t:"Seperti tambal ban di pinggir jalan",b:`<p>Tidak ada kompresor bengkel, tapi kit tambal cukup <span class="hl">kalau bocornya kecil dan velgnya tidak rusak</span>.</p><p>Velg rusak = pulpa terlibat. Untuk itu harus ke bengkel besar.</p>`},
 {k:"go",procs:["art"]}
]},
{id:"m9",t:"Strategi di ruang OSCE",min:4,sub:"lembar jawaban + skor",cards:[
 {k:"c",m:"how",t:"Lembar jawaban (pola OSCE 2024)",b:`<ul><li>1. Diagnosis</li><li>2. Rencana perawatan</li><li>3. Alasan rencana</li><li>4. Bahan</li><li>5. Alasan bahan</li></ul><p>Setelah itu praktik di model sambil menjelaskan.</p>`},
 {k:"c",m:"keep",t:"Kalimat pembuka (sama untuk semua stasiun)",b:`<p class="hand" style="font-size:21px;line-height:1.25">"Saya memposisikan pasien dan operator di jam 10 untuk regio 4, memakai masker, handscoon, dan haircap. Saya cek oklusi awal, isolasi dengan cotton roll, lalu pemeriksaan dengan kaca mulut, sonde, dan pinset. Diagnosisnya…"</p>`},
 {k:"c",m:"break",t:"Skor dan kesalahan fatal",b:`<p><b>2</b> benar, <b>1</b> belum memadai, <b>0</b> tidak dilakukan atau salah, <b>TB</b> tidak berlaku (harus dengan alasan).</p><p><span class="hl p">Fatal</span>: diagnosis salah, preparasi berlebihan, kontaminasi atau desikasi, varnish terlewat, adhesif wajib terlewat, curing kurang, defek atau kontak berlebih tidak diperbaiki.</p>`},
 {k:"c",m:"keep",t:"Kalimat alasan siap pakai",b:`<p><b>PFS</b>: "Pit fisur dalam rentan karies, gigi sehat, tidak ada karies proksimal, dan risiko karies tinggi."</p><p><b>GIC</b>: "DMFT ≥ 4,5, melepas fluor, lebih toleran saliva. Kekurangannya retensi lebih lemah."</p><p><b>Resin</b>: "DMFT ≤ 4,4, anak kooperatif dan kontrol berkala, retensi lebih kuat. Kekurangannya tidak melepas fluor."</p><p><b>PRR A</b>: "Karies dini di pit, tidak melibatkan proksimal, tidak luas, jadi tidak perlu restorasi seluruh permukaan."</p>`},
 {k:"c",m:"why",t:"Kamu sudah sampai sini",b:`<p>Sisa malam ini: <span class="hl">Latihan → Susun urutan</span> sampai nol salah, lalu <b>Lisan</b> sekali per prosedur. Tutup dengan <b>Kuis → Ulang yang salah</b>.</p><p>Tidur cukup juga bagian dari belajar, karena saat tidur ingatan dikonsolidasi.</p>`}
]}

function kana(w){let o="",i=0;const L=w.length;
  while(i<L){const ch=w[i];
    if(VI[ch]!=null){o+=KV[""][VI[ch]];i++;continue}
    const dg=w.substr(i,2);

function toNeko(t){

  t=t.replace(/(\d+),(\d+)/g,(m,a,b)=>terbilang(+a)+" koma "+b.split("").map(d=>terbilang(+d)).join(" "));

  t=t.replace(/\b(ha){2,}h?\b/g,"nyahahaha").replace(/\bwk(wk)+\b/g,"nyahaha");
  t=t.replace(/[?]/g," ？ ").replace(/!/g," ！ ").replace(/[.…]+/g," 。 ").replace(/[,;:()]/g," 、 ");
  return t.split(/\s+/).filter(Boolean).map(w=>/^[。、！？]$/.test(w)?w:kana(w.replace(/[^a-z]/g,""))).join(" ").replace(/\s*([。、！？])\s*/g,"$1").replace(/、+/g,"、").replace(/^、/,"").trim();

 <ul><li>Pit dan fisur sempit dan dalam. Plak menumpuk dan susah dibersihkan.</li><li>Bakteri memfermentasi gula → asam → pH turun → <b>demineralisasi</b>. Kalau demineralisasi lebih banyak dari remineralisasi, terbentuk karies.</li><li>Gigi yang sedang erupsi lebih rentan: oklusalnya masih di bawah bidang oklusal (susah disikat) dan enamelnya belum matang (maturasi pasca-erupsi).</li></ul></section>
 <section class="ms"><span class="move how">cara kerja</span><h3>Cara silen bekerja</h3><div class="sk" style="padding:10px">${D.seal}</div>
 <p>Silen jadi <b>penghalang fisik</b>. Karbohidrat tidak sampai ke bakteri, produksi asam turun, lesi awal terhambat. Silen tidak membunuh semua bakteri, tapi selama tertutup rapat, lesi tidak berkembang. Jadi kuncinya <b>keutuhan dan adaptasi tepi</b>, ditambah kontrol plak, fluor, dan gula.</p>
 ${fact("ok","Pedoman ADA/AAPD: silen efektif mencegah dan <b>menghentikan</b> karies pit-fisur, termasuk lesi awal nonkavitas yang disilen.",["adaaapd"])}
 ${tamago("Bakterinya nggak mati semua, cuma kelaparan. Kasihan sih. Tapi gigimu selamat.")}</section>
 <section class="ms"><span class="move how">cara kerja</span><h3>5 bentuk fisur (Nagano)</h3><div class="sk" style="padding:10px">${D.ftypes}</div>
 ${tbl(["Tipe","Ciri","Catatan"],[["U","Lebar hampir sama dari atas sampai dasar","Paling gampang disilen"],["V","Lebar di atas, menyempit ke dasar","Paling sering ditemukan"],["I","Celah sangat sempit memanjang","Paling susah dijangkau sikat"],["IK","Pintu sempit, ruang lebih besar di dasar","Mirip botol tinta"],["Y terbalik","Sempit di atas, bercabang di dasar","Bentuk kompleks"]])}
 ${fact("ok","Penetrasi silen paling baik di fisur U, lalu V, IK, dan I. Makin sempit, makin buruk penetrasinya.",["shiraz","ijcpd23"])}
 ${fact("warn","Persentase di catatanmu (V ± 34%, IK ± 26%, U ± 14%) terbaca lewat OCR dan angka tipe I tidak jelas. Sumber primernya (Nagano 1960) tidak terindeks, jadi angkanya belum bisa aku verifikasi. Yang aman diucapkan: <b>V paling sering</b>.")}
 ${fact("warn","Catatan kuliah menulis tipe I dan IK perlu enameloplasti. Buku lab: fisur sehat <b>tidak dipreparasi</b>. Untuk ujian ikuti buku lab, kecuali dosen bilang lain.")}
 ${tamago("Kalau ditanya \"IK itu apa\": jawab botol tinta. Pintunya sempit, dalamnya lebar. Kayak pintu kos, kamarnya luas.")}</section>
 <section class="ms"><span class="move keep">pegang ini</span><h3>Gigi sasaran dan usia</h3>
 ${tbl(["Gigi","Kode FDI","Erupsi"],[["Molar sulung","54, 64, 74, 84, 55, 65, 75, 85","—"],["Molar pertama permanen","16, 26, 36, 46","± 6–7 tahun"],["Premolar","—","± 10–13 tahun (selektif)"],["Molar kedua permanen","17, 27, 37, 47","± 11–13 tahun"],["Anterior (pit cingulum)","—","Selektif. Cingulum saja bukan indikasi"]])}
 <p>Usia cuma bantu menentukan <i>kapan</i> memeriksa. Keputusan selalu <b>per permukaan</b>. Kalau molar pertama sudah karies, periksa molar kedua yang baru erupsi lebih cermat.</p></section>
 <section class="ms"><span class="move break">di mana patah</span><h3>Indikasi dan kontraindikasi PFS</h3>
 ${tbl(["Indikasi","Kontraindikasi (dan alasannya)"],[["Pit dan fisur dalam","Fisur self-cleansing baik: memang tidak perlu"],["Lesi awal nonkavitas (dekalsifikasi minimal)","Karies interproksimal yang perlu ditambal: masalah lebih besar ditangani dulu"],["Tidak ada karies interproksimal","Gigi erupsi sebagian (untuk silen resin): tidak bisa dikeringkan"],["Isolasi dari saliva memungkinkan","Kavitas jelas / dugaan dentin: evaluasi restorasi dulu"],["Gigi erupsi < 4 tahun","Isolasi tidak memadai"],["Risiko karies sedang–tinggi, gigi baru erupsi",""]])}
 ${tamago("Kelihatan bertentangan? Erupsi sebagian kontra untuk RESIN karena susah kering. GIC masih boleh, asal lembapnya bisa dikontrol.")}</section>
 <section class="ms"><span class="move keep">pegang ini</span><h3>Kontrol berkala</h3>
 ${tbl(["Risiko karies","Interval kontrol"],[["Tinggi","± 3 bulan"],["Sedang","± 6 bulan"],["Rendah","6–12 bulan"]])}
 <p>Yang diperiksa: retensi, keutuhan, adaptasi tepi, fisur terbuka lagi, tanda lesi baru. Radiografi hanya bila ada indikasi.</p>
 ${tbl(["Temuan saat kontrol","Keputusan"],[["Silen utuh, tidak ada karies","Pertahankan dan pantau"],["Hilang sebagian","Perbaiki lokal / aplikasi ulang bagian itu"],["Hilang seluruhnya","Nilai ulang risiko, diagnosis, isolasi, baru aplikasi ulang"],["Kavitas atau lesi berkembang","Diagnosis dan tata laksana sesuai. Aplikasi ulang saja belum tentu cukup"]])}</section>`},

{id:"diagnosis",t:"Membaca karies: kode-kode",cat:"kucing-ngecek",min:6,act:{quiz:"Diagnosis"},
 tldr:["<b>Gigi permanen</b> (16, 26, 36, 46, 17, 37): pakai <b>ICDAS</b> + WHO D1–D4 + Mount & Hume.","<b>Gigi sulung</b> (51–85): pakai <b>K1–K4</b>. K1 enamel, K2 dentin, K3 pulpa, K4 radiks.","Tulis <b>deskriptif dulu</b> (\"karies enamel pada pit mesial, < 0,5 mm\"), baru kodenya.","ICDAS <b>bukan</b> padanan otomatis tipe PRR. Tipe ditentukan kedalaman."],
 say:"Gigi permanen pakai ikdas, ditambah W H O dan Mount dan Hume. Gigi sulung pakai K satu sampai K empat. Tulis deskriptif dulu, baru kodenya. Ikdas bukan padanan otomatis tipe P R R.",
 body:()=>`
 <section class="ms"><span class="move why">kenapa ada</span><h3>Kode = bahasa yang sama dengan penguji</h3><div class="sk" style="padding:10px">${D.depth}</div>
 <p>Tindakan dan tipe PRR dipilih dari <b>seberapa dalam</b> lesinya. Kode membuat kedalaman itu bisa ditulis singkat dan dipahami orang lain.</p></section>
 <section class="ms"><span class="move how">cara kerja</span><h3>ICDAS 0–6 (pit dan fisur)</h3>
 ${tbl(["Kode","Nama","Yang terlihat"],[["0","Sound","Tidak ada perubahan setelah dikeringkan 5 detik. Hipoplasia, fluorosis, atrisi, abrasi, erosi, stain dianggap sehat"],["1","First visual change","Saat basah tidak tampak. Setelah dikeringkan muncul opak/diskolorasi"],["2","Distinct visual change","Opak/coklat sudah terlihat saat basah, lebih lebar dari fisur alami"],["3","Localised enamel breakdown","Enamel pecah, dentin belum terlihat. Bola probe WHO bisa masuk"],["4","Underlying dentine shadow","Bayangan gelap dari dentin, enamel bisa tampak utuh"],["5","Distinct cavity, dentin terlihat","Kavitas, dentin terbuka di dasar"],["6","Extensive cavity","≥ ½ permukaan, bisa sampai pulpa"]])}
 <p>Kelompok resmi: 0 sound; 1–2 early; 3–4 established; 5–6 severe. ICDAS juga mencatat aktivitas lesi (aktif/tidak).</p>
 ${fact("ok","Deskripsi kode 0–6 di atas sesuai kriteria ICDAS II.")}
 ${tamago("Hafalan cepat: 1 = baru kelihatan kalau kering. 2 = basah pun kelihatan. 3 = pecah. 4 = bayangan. 5–6 = dentin nongol.")}
 ${more("Modified ICDAS",tbl(["0","A","3","4","5","6"],[["Tidak ada karies","Karies awal enamel tanpa kavitas","Enamel pecah, tanpa dentin","Bayangan dentin","Kavitas, dentin terlihat","Kavitas luas"]]))}</section>
 <section class="ms"><span class="move how">cara kerja</span><h3>WHO D1–D4 dan Mount &amp; Hume</h3>
 ${tbl(["D1","D2","D3","D4"],[["Lesi enamel, permukaan utuh","Kavitas di enamel","Kavitas di dentin","Sampai pulpa"]])}
 ${fact("info","Ambang D1–D4 ini dipopulerkan Pitts. Di materimu disebut \"klasifikasi WHO\". Untuk ujian, pakai istilah materimu.")}
 ${tbl(["Site (lokasi)","Size (ukuran)"],[["1 = pit dan fisur","0 = lesi awal tanpa kavitas (white spot)"],["2 = proksimal anterior & posterior","1 = kavitas kecil, dentin baru tersentuh"],["3 = 1/3 servikal / akar","2 = sedang, karies dentin"],["","3 = agak besar, struktur gigi perlu dilindungi"],["","4 = besar, cusp hilang, bisa sampai pulpa"]])}</section>
 <section class="ms"><span class="move how">cara kerja</span><h3>Gigi sulung: K1–K4</h3>
 ${tbl(["Kode","Arti","Ciri"],[["K1","Karies enamel","Misalnya ± 0,5 mm di enamel"],["K2","Karies dentin","Selapis dentin / sudah mencapai dentin"],["K3 vital","Sampai pulpa, gigi vital","Masih sakit. Pulpitis reversibel: sakit kalau ada rangsangan (minum es). Ireversibel: sakit tanpa rangsangan / saat tidur"],["K3 nonvital","Sampai pulpa, nonvital","Tidak sakit lagi, perkusi/palpasi (−). DAAA: abses (+), fistel (−), beberapa hari. DAAK: abses (+), fistel (+), sudah lama"],["K4","Radiks","Tinggal akar"]])}
 ${fact("ok","K1–K4 dipakai untuk gigi sulung (judul bagian ini di catatanmu: \"Diagnosis karies gigi sulung\"). Kunci soal latihan lama sempat menulis K1 untuk gigi 16, padahal 16 gigi permanen. Pegang aturannya.")}
 ${tamago("Kode K buat gigi susu. Gigi dewasa pakai ICDAS. Jangan ketuker, nanti gigimu protes.")}</section>
 <section class="ms"><span class="move keep">pegang ini</span><h3>Peta kode ke tindakan (gigi permanen)</h3>
 ${tbl(["Tindakan","Kondisi","Mount & Hume","Patokan catatan"],[["PFS","Sound, pit fisur dalam","Site 1, belum ada lesi / Size 0","ICDAS 0–2"],["PRR A","Karies enamel < ½ tebal","Site 1 Size 1","ICDAS 3–4 umumnya PRR"],["PRR B","Karies enamel > ½ tebal, hampir DEJ","Site 1 Size 1","tipe dari kedalaman"],["PRR C","Karies dentin (selapis tipis)","Site 1 Size 2","liner bila dentin sisa tipis"]])}
 ${fact("warn","Kunci remed menulis gigi 36 (karies < 0,5 mm) sebagai <b>ICDAS D2, WHO D2, Site 1 Size 1 → PRR A</b>, padahal ringkasan lain memetakan D2 ke tipe B. Yang konsisten di semua sumber: keputusan akhirnya. Tulis deskriptif dulu, lalu tanyakan dosen kode mana yang dipakai.")}</section>
 <section class="ms"><span class="move keep">pegang ini</span><h3>CRA (Caries Risk Assessment)</h3>
 <p>CRA memperkirakan risiko karies baru: <b>rendah, sedang, tinggi</b>. Komponennya: indikator penyakit, faktor risiko, faktor protektif. Formulir CAMBRA: pakai versi usia &lt; 6 tahun atau ≥ 6 tahun.</p>
 ${tamago("CRA itu ramalan cuaca, bukan diagnosis. Ramalan bilang hujan, tetap lihat langitnya dulu (periksa per permukaan).")}
 <ul><li>Karies proksimal tidak otomatis meniadakan kebutuhan silen oklusal. Oklusal diperiksa terpisah.</li><li>Anak berkebutuhan khusus, hiposalivasi, dan pemakai alat ortodontik meningkatkan kebutuhan, tetap dinilai per gigi.</li></ul></section>`},

{id:"bahan",t:"Bahan: GIC vs resin",cat:"kucing-kardus",min:6,act:{mod:["m3","m3k"]},
 tldr:["<b>GIC nempel kimia</b>: conditioner → keringkan sampai <b>lembab</b> → aplikasi → <b>varnish</b>. Fluor, toleran lembab, retensi lebih lemah.","<b>Resin mengunci mekanis</b>: etsa 37% → kering <b>putih kapur</b> → (bonding) → silen → light cure. Retensi kuat, tanpa fluor.","Lab: DMFT <b>≥ 4,5 → GIC</b>, <b>≤ 4,4 → resin</b>. Unfilled tanpa bonding, filled dengan bonding.","Fuji VII = silen fisur. Fuji IX GP = restoratif, dipakai untuk ART."],
 say:"G I C nempel secara kimia. Conditioner, keringkan sampai lembab, aplikasi, lalu varnish. Resin mengunci secara mekanis. Etsa, kering putih kapur, lalu silen dan light cure. Di lab, D M F T empat koma lima ke atas pakai G I C, empat koma empat ke bawah pakai resin.",
 body:()=>`
 <section class="ms"><span class="move why">kenapa ada</span><h3>Hafal mekanisme, langkahnya ikut</h3><div class="sk" style="padding:10px">${D.bond}</div>
 <p>Hampir semua langkah PFS, PRR, dan ART bisa diturunkan dari pertanyaan: <b>"bahan ini nempel pakai apa?"</b></p></section>
 <section class="ms"><span class="move how">cara kerja</span><h3>GIC: ikatan kimia</h3>
 <p>Kaca <b>fluoroaluminosilikat</b> + <b>asam poliakrilat</b> + <b>air</b> → reaksi asam-basa → mengeras. Gugus karboksil asam poliakrilat berikatan dengan kalsium di gigi (pertukaran ion).</p>
 <ul><li>Butuh permukaan bersih → <b>conditioner</b> (asam poliakrilat; GC Dentin Conditioner 10%, Cavity Conditioner 20%) membersihkan smear layer.</li><li>Reaksinya butuh air → keringkan sampai <b>lembab</b>, jangan desikasi.</li><li>Fase awal rapuh: kebanyakan air larut, kekeringan retak → <b>varnish / cocoa butter</b>.</li><li>Melepas fluor, toleran lembab → cocok untuk risiko tinggi, anak kurang kooperatif, gigi erupsi sebagian.</li><li>Rasio bubuk:cairan sesuai pabrik, <b>tidak boleh diencerkan</b>. Aduk dengan <b>agate</b> atau plastik, bukan logam (logam terkikis partikel kaca).</li></ul></section>
 <section class="ms"><span class="move how">cara kerja</span><h3>Resin: kunci mikromekanis</h3>
 <p><b>Etsa asam fosfat 37%</b> melarutkan sebagian prisma enamel → pori mikro (permukaan putih kapur) → resin masuk → disinar → jadi <i>tag</i> yang mengunci.</p>
 <ul><li>Kena saliva setelah etsa → protein menutup pori → <b>etsa ulang</b>.</li><li>Sinar tidak tembus dalam → komposit diisi <b>per 2 mm</b> (juga mengurangi penyusutan).</li><li>Aturan lab: silen <b>unfilled</b> (Fissured Nova Plus, Bioseal) tanpa bonding; <b>filled</b> (Diafil Flow) dengan bonding.</li></ul>
 ${fact("warn","Secara umum, filled/unfilled hanya menunjukkan ada tidaknya pengisi, bukan aturan bonding. Tapi di lab dan kunci remed aturannya: unfilled tanpa bonding, filled dengan bonding. Untuk ujian, pegang aturan lab.")}</section>
 <section class="ms"><span class="move keep">pegang ini</span><h3>Tabel perbandingan</h3>
 ${tbl(["","Resin","GIC konvensional","RMGIC","Kompomer"],[["Mengeras","Polimerisasi","Asam-basa","Asam-basa + polimerisasi","Polimerisasi, asam-basa terbatas"],["Perlekatan","Mikromekanis setelah etsa","Kimia ke gigi","Sesuai produk","Biasanya perlu adhesif"],["Fluor","Sesuai produk","Ada","Sesuai produk","Sesuai produk"]])}
 ${tamago("Kompomer bukan RMGIC. Namanya mirip, kelakuannya beda.")}</section>
 <section class="ms"><span class="move keep">pegang ini</span><h3>9 tipe GIC</h3>
 ${tbl(["Tipe","Fungsi","Tipe","Fungsi"],[["I","Luting","VI","Core build up"],["II","Restorasi","VII","Fluor tinggi"],["III","Lining & basis","VIII","ART"],["IV","Fissure sealant","IX","Gigi desidui (pediatrik/geriatrik)"],["V","Semen ortodonti","",""]])}
 ${fact("ok","Daftar tipe I–IX ini cocok dengan literatur. <b>Koreksi:</b> Fuji VII itu GIC fluor tinggi (tipe VII) yang dipakai sebagai silen fisur, jadi jangan disebut \"tipe 4\".",["gictypes","fuji7"])}</section>
 <section class="ms"><span class="move keep">pegang ini</span><h3>Produk di lab</h3>
 ${tbl(["Produk","Jenis","Cara pakai"],[["Fuji VII (bubuk pink) + GC Dentin Conditioner","GIC silen fisur","Conditioner, tanpa bonding"],["Fuji IX GP","GIC restoratif kental","Kavitas PRR GIC dan ART. Cavity Conditioner 10 dtk atau Dentin Conditioner 20 dtk; finishing ± 6 menit sejak mulai aduk"],["Fissured Nova Plus, Bioseal","Resin sealant unfilled","Etsa saja"],["Diafil Flow","Resin flowable filled","Etsa + bonding. Untuk PFS dan lapisan silen PRR"],["Fine Etch 37 / etsa Biodinamica","Asam fosfat 37%","Semua jalur resin"],["Escom 250 (A2)","Komposit packable","Kavitas PRR B/C, dengan etsa + bonding"],["Botol oranye","Bonding agent","Hanya jalur resin yang perlu"]])}</section>
 <section class="ms"><span class="move how">cara kerja</span><h3>Memilih bahan silen</h3>
 ${tbl(["DMFT","Kategori WHO","Bahan (aturan lab)"],[["0–1,1","Sangat rendah","Resin"],["1,2–2,6","Rendah","Resin"],["2,7–4,4","Sedang","Resin"],["4,5–6,5","Tinggi","GIC"],["> 6,5","Sangat tinggi","GIC"]])}
 ${tbl(["","Silen resin","Silen GIC (Fuji VII)"],[["Dipilih bila","Risiko rendah, anak kooperatif, kontrol berkala","Risiko tinggi, anak kurang kooperatif / belum pernah ke dokter gigi"],["Kelebihan","Retensi kuat, tahan tekanan kunyah","Melepas fluor, toleran saliva"],["Kekurangan","Tanpa fluor","Retensi lebih lemah, mudah lepas karena abrasi"]])}
 ${fact("info","Pedoman ADA/AAPD belum bisa merekomendasikan satu jenis bahan silen di atas yang lain. Jadi aturan DMFT ini adalah aturan lab/kunci ujian, bukan kesimpulan riset. Untuk ujian, tetap pakai.",["adaaapd"])}
 ${tamago("Risiko tinggi tapi yang ada cuma resin? Boleh. Sebut alasannya dan jadwalkan kontrol ketat.")}</section>`},

{id:"pfs",t:"PFS lengkap",cat:"kucing-duduk",min:6,act:{seq:"pfsgic"},
 tldr:["<b>Tanpa bur.</b> Bersihkan pakai pumice + brush.","<b>GIC</b>: conditioner → cuci → lembab → aduk Fuji VII → aplikasi dari bagian tertinggi → cek sonde → varnish → cek oklusi → varnish ulang.","<b>Resin</b>: etsa 37% → putih kapur → silen (filled: bonding dulu) → light cure → cek sonde → cek oklusi.","Fatal: preparasi berlebihan, desikasi, varnish terlewat, kontaminasi, kontak berlebih."],
 say:"P F S itu tanpa bur. Jalur G I C: conditioner, cuci, keringkan sampai lembab, aduk Fuji tujuh, aplikasi dari bagian tertinggi, cek sonde, varnish, cek oklusi, varnish ulang. Jalur resin: etsa, putih kapur, silen, light cure, cek sonde, cek oklusi.",
 body:()=>`
 <section class="ms"><span class="move how">cara kerja</span><h3>Skrip OSCE: PFS GIC (risiko tinggi)</h3>
 ${steps(PROCS.pfsgic.steps.map(s=>`<b>${s[0]}.</b> ${s[1]} <span class="why2">↳ ${s[2]}</span>`))}
 ${more("Versi buku lab (18 langkah)",steps(["Verifikasi identitas, anamnesis, alergi, penjelasan, persetujuan.","CRA, diagnosis, catat gigi/permukaan/tahap erupsi.","Tentukan alasan memakai GIC, cek produk (masa berlaku, petunjuk).","Kontrol infeksi (APD, instrumen steril) dan ergonomi.","Bersihkan dan bilas (brush, pumice bila sesuai). Tanpa preparasi rutin.","Isolasi dan kontrol kelembapan (cotton roll, suction). Ganti kapas basah.","Kondisioner bila dipakai: Cavity Conditioner (20%) 10 dtk atau Dentin Conditioner (10%) 20 dtk, sesuai produk.","Bilas menyeluruh, pertahankan isolasi.","Hilangkan kelebihan air tanpa desikasi.","Takar dan campur sesuai rasio dan waktu produk.","Tempatkan dalam waktu kerja: tipis, merata, tanpa gelembung.","Pelindung (varnish/cocoa butter). Fuji VII: saat permukaan mulai kehilangan kilap.","Pertahankan isolasi sampai cukup keras.","Periksa cakupan dan adaptasi tanpa menggores bahan yang belum matang.","Lepas isolasi, cek oklusi dengan articulating paper.","Sesuaikan bila perlu (finishing setelah cukup keras), lapisi ulang pelindung.","Instruksi pasien dan rencana kontrol.","Dokumentasi dan kontrol infeksi."]))}
 ${tamago("Varnish dua kali: sekali segera, sekali lagi setelah oklusi diasah. Yang pertama nggak boleh ditunda.")}</section>
 <section class="ms"><span class="move how">cara kerja</span><h3>Skrip OSCE: PFS resin (risiko rendah)</h3>
 ${steps(PROCS.pfsres.steps.map(s=>`<b>${s[0]}.</b> ${s[1]} <span class="why2">↳ ${s[2]}</span>`))}
 ${more("Versi buku lab (18 langkah)",steps(["Identitas, anamnesis, persetujuan.","CRA dan pemeriksaan permukaan.","Tentukan kelayakan resin/kompomer. Harus bisa diisolasi.","Cek bahan, adhesif, curing light.","APD, ergonomi, pelindung mata.","Bersihkan dan bilas.","Isolasi (rubber dam / memadai), keringkan.","Etsa enamel (asam fosfat, waktu sesuai produk, lindungi mukosa).","Bilas menyeluruh (cegah tertelan).","Keringkan dengan udara bebas minyak dan air.","Bila terkontaminasi setelah etsa: hentikan, pulihkan sesuai sistem.","Adhesif sesuai sistem (kompomer perlu adhesif kompatibel).","Aplikasikan tipis, menutup seluruh sasaran, tanpa gelembung.","Sinari sesuai petunjuk.","Periksa cakupan dan adaptasi, perbaiki defek.","Lepas isolasi, cek oklusi.","Finishing bila perlu, evaluasi akhir.","Instruksi, kontrol, dokumentasi."]))}
 ${fact("warn","Durasi etsa 20 vs 30 detik dan conditioner 10/15/20 detik beda di tiap catatan. Jawab: \"sesuai petunjuk pabrik\".")}</section>
 <section class="ms"><span class="move break">di mana patah</span><h3>Kesalahan fatal (wajib diperbaiki sebelum lanjut)</h3>
 <ul><li>Diagnosis tidak sesuai.</li><li>Preparasi berlebihan (ngebur fisur sehat).</li><li>Salah indikasi bahan.</li><li>Kontaminasi atau desikasi.</li><li>Perlindungan awal (varnish) terlewat.</li><li>Defek atau kontak berlebih tidak diperbaiki.</li><li>Perubahan warna dianggap bukti resin sudah keras.</li></ul></section>
 ${exam("\"Gigi 46 pit dan fisur dalam, bebas karies (ICDAS 0). Rencana PFS dengan silen GIC Fuji VII, karena DMFT ≥ 4,5 (risiko tinggi), melepas fluor, dan lebih toleran saliva. Kekurangannya retensi lebih lemah, jadi kontrol tiap ± 3 bulan.\"")}`},

{id:"prr",t:"PRR A, B, C lengkap",cat:"kucing-lompat",min:7,act:{seq:"prra"},
 tldr:["PRR = <b>buang lesinya saja</b>, lalu <b>segel fisur sehat</b> di sekitarnya.","<b>A</b>: enamel < ½ tebal. Bur bulat ¼–½. Etsa + silen.","<b>B</b>: enamel > ½ tebal, hampir DEJ. ± 1–2 mm. Etsa + bonding + komposit + silen.","<b>C</b>: dentin. Anestesi, bur ≥ no. 2/330, bevel, liner bila perlu, komposit per 2 mm, silen."],
 say:"P R R itu buang lesinya saja, lalu segel fisur sehat di sekitarnya. Tipe A, enamel kurang dari setengah tebal, etsa dan silen. Tipe B, hampir D E J, etsa, bonding, komposit, silen. Tipe C, sudah dentin, anestesi, bevel, komposit per dua milimeter, lalu silen.",
 body:()=>`
 <section class="ms"><span class="move why">kenapa ada</span><h3>Kenapa tidak bur semua fisur saja?</h3><div class="sk" style="padding:10px">${D.road}</div>
 <p>Cara lama (restorasi kelas I) memperluas preparasi ke seluruh alur supaya "aman". Hasilnya jaringan sehat ikut hilang. PRR membuang lesinya saja, dan fisur sehat diamankan dengan silen.</p>
 ${fact("ok","Literatur PRR klasik: lesi kecil dibuang tanpa memperluas ke jaringan sehat; lubang eksplorasi minimal cukup diisi silen; kavitas yang lebih dalam diisi resin berpengisi, dan fisur lain disilen.",["mcconn","simonsen"])}</section>
 <section class="ms"><span class="move keep">pegang ini</span><h3>Tabel A / B / C</h3>
 ${tbl(["","A","B","C"],[["Kedalaman","Enamel < ½ tebal (± < 0,5 mm)","Enamel > ½ tebal, hampir DEJ","Dentin (selapis tipis)"],["Bur","Bulat ¼ / ½","Bulat, kavitas ± 1–2 mm","≥ no. 2 / fissure 330, bevel cavosurface"],["Anestesi","Tidak","Tidak disebut perlu","Perlu"],["Bahan","Etsa + silen","Etsa + bonding + komposit packable + silen","Seperti B, komposit per 2 mm"],["Kontraindikasi","Rampan karies; karies proksimal","Karies meluas/dalam/banyak permukaan","Karies luas; sampai proksimal; tidak bisa diisolasi"]])}
 ${fact("warn","Bur tipe B: catatan kuliah no. 1–2, tabel buku no. ½. Deskripsi PRR klasik (Simonsen) memakai bur bulat no. 1–2 untuk tipe B, jadi catatan kuliahmu sejalan dengan literatur. Tetap tanyakan dosen versi lab.",["simonsen"])}
 ${fact("warn","PRR A: kunci remed dan catatan kuliah = etsa + silen, <b>tanpa bonding dan tanpa komposit</b>. Tabel buku memakai bonding. Liner Ca(OH)₂ di tipe C: catatan = rutin, buku lab = hanya bila diindikasikan.")}
 ${tamago("A itu Atas (enamel). B itu Batas (hampir DEJ). C itu Cukup dalam (dentin).")}</section>
 <section class="ms"><span class="move break">di mana patah</span><h3>PFS, PRR, atau bukan keduanya?</h3>
 ${tbl(["Keadaan","Pilihan"],[["Sehat / lesi awal nonkavitas","PFS, tanpa preparasi rutin"],["Lesi lokal, fisur lain masih bisa dipertahankan","PRR, preparasi terbatas"],["Lesi luas, struktur hilang banyak, gejala pulpa","Restorasi lebih luas / perawatan pulpa. Jangan paksa PRR"]])}
 <ul><li>Satu titik karies → PRR. Semua pit dan fisur kena (kelas I) → bukan PRR.</li><li>Perubahan warna saja tidak cukup untuk menentukan preparasi.</li><li>Risiko tinggi tidak otomatis berarti fisur dipreparasi.</li><li>Kata kunci soal PFS: "karies (−)", "pit fisur dalam retentif", "aplikasi tanpa preparasi". PRR: "karies minimal", "kavitas kecil", "ICDAS 3/4", "bur bulat kecil".</li></ul></section>
 <section class="ms"><span class="move how">cara kerja</span><h3>Skrip OSCE: PRR A (versi kunci remed)</h3>
 ${steps(PROCS.prra.steps.map(s=>`<b>${s[0]}.</b> ${s[1]} <span class="why2">↳ ${s[2]}</span>`))}</section>
 <section class="ms"><span class="move how">cara kerja</span><h3>Skrip OSCE: PRR B</h3>
 ${steps(PROCS.prrb.steps.map(s=>`<b>${s[0]}.</b> ${s[1]} <span class="why2">↳ ${s[2]}</span>`))}
 ${more("PRR C (dari tabel buku)",steps(PROCS.prrc.steps.map(s=>`<b>${s[0]}.</b> ${s[1]} <span class="why2">↳ ${s[2]}</span>`)))}
 ${more("Restorasi preventif berbahan GIC (buku lab)",`<p>Pakai <b>Fuji IX GP</b> (restoratif), bukan Fuji VII. Istilah buku: "restorasi preventif berbahan GIC", karena PRR historis merujuk ke resin.</p>`+steps(["Identitas, anamnesis, persetujuan.","CRA, diagnosis lesi, keadaan pulpa, radiografi bila diindikasikan.","Tentukan kelayakan GIC restoratif, pilih bahan restoratif dan silen.","Kontrol infeksi, ergonomi, cek produk.","Catat oklusi awal, profilaksis, anestesi bila perlu.","Isolasi dan kontrol kelembapan.","Buka akses terbatas sesuai lesi. Jangan memperluas fisur sehat.","Angkat jaringan karies secara konservatif.","Evaluasi kavitas. Tidak memasang liner rutin.","Kondisioning, bilas, buang kelebihan air tanpa desikasi.","Campur sesuai rasio dan waktu. Jangan diencerkan.","Isi kavitas, bentuk kontur, tanpa gelembung.","Pelindung awal (varnish) segera.","Periksa adaptasi dan pengisian.","Segel fisur rentan lain dengan silen GIC (tahap terpisah).","Lepas isolasi, cek oklusi statis dan ekskursif.","Finishing bila sudah keras, lapisi ulang.","Evaluasi akhir, instruksi, dokumentasi."]))}
 ${tamago("Langkah yang tidak relevan (misalnya adhesif di PRR A jalur silen saja) ditandai TB, tapi wajib sebut alasannya.")}</section>
 ${exam("\"Gigi 36 karies enamel pada pit mesial oklusal, kedalaman < 0,5 mm (ICDAS D2, WHO D2, Site 1 Size 1). Rencana: preventif resin restorasi tipe A. Alasan: karies dini di pit, tidak melibatkan proksimal, tidak luas, jadi tidak perlu restorasi seluruh permukaan.\"")}`},

{id:"art",t:"ART lengkap",cat:"telur-ditinggal",min:7,act:{seq:"art"},
 tldr:["ART (WHO): buang karies pakai <b>hand instrument</b>, tambal <b>GIC Fuji IX</b>. Tanpa bur, tanpa listrik, minim sakit.","Alur 4 fase: <b>tandai</b> (indikator) → <b>buang</b> (ekskavator tajam) → <b>siapkan</b> (conditioner, lembab) → <b>isi & lindungi</b> (aduk 1:1 30 dtk, strip + jari, cocoa butter).","Kontraindikasi = <b>pulpa terlibat</b> (abses/fistula, kena pulpa, pulpitis kronis, sakit lama) atau <b>tidak terjangkau</b>.","Gagal paling sering karena <b>operator</b>: adukan kental, bahan dipaksa masuk."],
 say:"A R T itu buang karies pakai hand instrument, lalu tambal G I C Fuji sembilan. Tanpa bur, tanpa listrik. Alurnya: tandai pakai indikator, buang pakai ekskavator tajam, siapkan dengan conditioner sampai lembab, lalu isi dan lindungi. Kontraindikasinya: pulpa sudah terlibat, atau kavitas tidak terjangkau.",
 body:()=>`
 <section class="ms"><span class="move why">kenapa ada</span><h3>Restorasi tanpa listrik</h3>
 <p>Metode konservasi <b>tanpa preparasi bur</b>, hanya alat sederhana (hand instrument). Tidak menyakitkan (atraumatik), sesuai WHO, dengan bahan adhesif GIC.</p>
 <p><b>Tujuan:</b> perawatan restoratif untuk mencegah karies makin parah dengan prinsip MID (minimal intervention dentistry): deteksi, diagnosis, intersepsi, dan perawatan karies sedini mungkin.</p></section>
 <section class="ms"><span class="move how">cara kerja</span><h3>Kenapa bisa tanpa bur</h3><div class="sk" style="padding:10px">${D.indicator}</div>
 <p>GIC menempel <b>kimia</b>, jadi kavitas tidak perlu dibentuk untuk retensi. <b>Kenapa GIC:</b> mirip jaringan keras dan tidak mengiritasi pulpa/gingiva; melepas fluor sehingga mencegah karies; mengurangi pemotongan jaringan sehat.</p>
 ${fact("info","Caries indicator dipakai di protokol lab ini, tapi di literatur, kombinasi indikator + bur berisiko over-ekskavasi (dentin yang masih bisa dipertahankan ikut terbuang). Di ART kita pakai ekskavator tangan, jadi tetap konservatif.",["neves"])}</section>
 <section class="ms"><span class="move how">cara kerja</span><h3>14 langkah (versi catatanmu)</h3>
 ${steps(PROCS.art.steps.map(s=>`<b>${s[0]}.</b> ${s[1]} <span class="why2">↳ ${s[2]}</span>`))}
 ${fact("warn","Rangkuman menulis 15 langkah tanpa langkah pahat dan tanpa celluloid strip + tekan jari. Catatan tulisan tanganmu menulis keduanya. Langkah pahat bersifat \"bila ada\".")}
 ${tamago("Kenapa bubuk dibagi dua? Supaya semua bubuk kebagian basah. Kayak masak mi: bumbunya dituang bertahap biar rata.")}</section>
 <section class="ms"><span class="move break">di mana patah</span><h3>Indikasi vs kontraindikasi</h3>
 ${tbl(["Indikasi","Kontraindikasi"],[["Kavitas terjangkau hand instrument","Abses / fistula"],["Karies pada satu permukaan","Karies sudah mengenai pulpa"],["Karies enamel","Pulpitis kronis"],["Karies mengenai dentin tapi belum pernah sakit (pulpa aman)","Gigi pernah sakit dalam waktu lama"],["","Kavitas tidak terjangkau hand instrument"]])}
 ${tamago("Benang merah kontraindikasi: pulpanya sudah kena, atau alatnya nggak nyampe. ART nggak bisa merawat pulpa.")}</section>
 <section class="ms"><span class="move keep">pegang ini</span><h3>Untung, rugi, evaluasi</h3>
 <ul><li><b>Keuntungan</b>: tidak perlu peralatan dental rumit; tidak bergantung listrik; minim ketidaknyamanan pasien; operator tidak butuh banyak latihan; GIC melepas fluor (kariostatik); murah; waktu singkat; kalau gagal, masih bisa lanjut ke perawatan yang lebih radikal.</li>
 <li><b>Kerugian (catatan)</b>: belum ada penelitian jangka panjang tentang efisiensinya.</li></ul>
 ${fact("info","Update: meta-analisis 2012 dan 2018 sudah ada. Tumpatan ART satu permukaan bertahan ± 94% (gigi sulung, 2 tahun) dan ± 87% (gigi permanen, 3 tahun). Banyak permukaan jauh lebih lemah (± 65% di gigi sulung). Kalau ditanya kerugian versi catatan, jawab sesuai catatan, lalu boleh tambah \"untuk tumpatan banyak permukaan\".",["amorim18","amorim12"])}
 <ul><li>Karies sekunder setelah ART tergolong rendah.</li><li>Kegagalan lebih banyak karena kesalahan operator: adukan terlalu kental, bahan dipaksa masuk kavitas.</li><li>Kalau fraktur/lepas: tangani seperti kasus ART baru. Kalau pecah: buang yang pecah, cek sisanya masih melekat, aplikasikan bahan baru.</li></ul></section>
 <section class="ms"><span class="move keep">pegang ini</span><h3>Alat dan bahan</h3>
 ${tbl(["Catatanmu (11)","Rangkuman (tambahan)"],[["Sonde, pinset","Alas kerja, kaca mulut, nierbeken"],["Ekskavator kecil yang tajam","Masker, sarung tangan"],["Ball applicator, semen stopper","Botol irigasi, air, spuit + jarum irigasi, wadah buangan"],["Glass slab + paper pad, agate spatula","Micro applicator, instrumen plastis"],["Celluloid strip, cotton pellet/roll","Tisu"],["Articulating paper, GIC Fuji IX","Caries indicator, dentin conditioner, cocoa butter/varnish"]])}</section>`},

{id:"ergo",t:"Ergonomi dan posisi",cat:"kucing-karton",min:3,
 tldr:["Kursi: kedua kaki bertumpu, <b>pinggul sedikit lebih tinggi dari lutut</b>. Punggung dan kepala netral.","Posisi jam: regio 1 → 10.00, regio 2 → 11.00, regio 3 → 10.30, <b>regio 4 → 10.00</b>.","Jam = panduan orientasi, bukan posisi tetap.","Kamu juga dinilai dari kemampuan mengoreksi posturmu sendiri."],
 say:"Kursi: kedua kaki bertumpu, pinggul sedikit lebih tinggi dari lutut. Posisi jam regio empat: operator jam sepuluh, asisten jam tiga. Jam itu panduan, bukan posisi tetap.",
 body:()=>`
 <section class="ms"><span class="move keep">pegang ini</span><h3>Komponen ergonomi</h3>
 ${tbl(["Komponen","Yang benar"],[["Kursi","Kedua kaki bertumpu, pinggul sedikit lebih tinggi dari lutut"],["Kepala dan punggung","Posisi alami, tidak membungkuk/menunduk berlebihan"],["Bahu dan lengan","Bahu rileks, lengan dekat tubuh"],["Pergelangan","Mendekati netral"],["Pasien","Posisi kursi, kepala, arah pandang sesuai gigi"],["Asisten","Suction dan transfer instrumen tanpa menghalangi pandangan"],["Pandangan & cahaya","Langsung / tidak langsung (kaca mulut), cahaya cukup"],["Instrumen & bahan","Dalam jangkauan, urut sesuai tahapan"]])}</section>
 <section class="ms"><span class="move keep">pegang ini</span><h3>Posisi jam</h3>
 ${tbl(["Regio","Operator","Asisten"],[["1 (kanan atas)","10.00","02.00"],["2 (kiri atas)","11.00","02.30"],["3 (kiri bawah)","10.30","02.30"],["4 (kanan bawah)","10.00","03.00"]])}
 ${fact("warn","Ini tabel dari materi/kunci jawabanmu (operator tangan kanan). Buku lab menegaskan jam hanya orientasi: sesuaikan dengan gigi, permukaan, tangan dominan, dan kenyamanan pasien.")}
 <p><b>Evaluasi 3 tahap:</b> sebelum (siapkan posisi), selama (koreksi postur), sesudah (umpan balik instruktur).</p>
 ${tamago("Kalau lagi ngerjain lalu sadar badanmu bungkuk: betulkan sambil bilang. Itu nilai plus, bukan aib.")}</section>`},

{id:"osce",t:"Strategi OSCE",cat:"kucing-nunggu",min:5,act:{kasus:true},
 tldr:["Lembar jawaban: <b>diagnosis, rencana, alasan rencana, bahan, alasan bahan</b>, lalu praktik.","Skor per langkah: <b>2 benar, 1 belum memadai, 0 salah/tidak dilakukan, TB</b> (harus beralasan).","Nilai = skor ÷ skor maksimal item yang berlaku × 100%. Ada nilai sikap A–D.","Datang tepat waktu dengan alat lengkap: telat > 15 menit atau alat kurang = tidak boleh ikut."],
 say:"Lembar jawaban: diagnosis, rencana, alasan rencana, bahan, alasan bahan, lalu praktik. Skor tiap langkah: dua benar, satu belum memadai, nol salah. Datang tepat waktu dengan alat lengkap.",
 body:()=>`
 <section class="ms"><span class="move keep">pegang ini</span><h3>Aturan lab</h3>
 <ul><li>Alat tidak lengkap atau telat lebih dari 15 menit → tidak boleh ikut.</li><li>Jas lab, tidak boleh sandal, rambut panjang diikat.</li><li>Dilarang merekam atau live streaming.</li><li>Bahan fakultas sekali pakai. Gagal = ganti sendiri.</li><li>Model di okludator: 1 molar/premolar bebas karies dengan fisur dalam (PFS), 1 molar dengan karies di 1 pit (PRR).</li></ul></section>
 <section class="ms"><span class="move keep">pegang ini</span><h3>Pola soal yang sudah keluar</h3>
 ${tbl(["Ujian","Kasus","Jawaban"],[["Skills Lab 2020","Bebas karies, pit fisur dalam","PFS silen resin"],["Skills Lab 2020","Molar pit fisur dalam, DMFT 7","PFS silen GIC"],["OSCE 2024","Anak 8 th, pit fisur dalam, dmft 7","PFS GIC"],["OSCE 2025","Anak 8 th, dmft 2, kontrol berkala","PFS silen resin"],["Remed 1 (36)","Karies pit mesial < 0,5 mm","PRR A: preparasi, etsa, silen resin"],["Remed 1 (46)","Pit fisur dalam kekuningan, dmft 1","PFS silen resin"],["Latihan (16)","Karies sentral pit 2 mm, hampir DEJ","PRR B"],["Latihan (26/46)","Pit fisur dalam, risiko tinggi","PFS GIC"]])}
 <p>Kunci remed menyebut acuan Buku SL: <b>hal. 34–36</b> untuk PRR (gigi 36) dan <b>hal. 29–30</b> untuk PFS (gigi 46).</p></section>
 <section class="ms"><span class="move break">di mana patah</span><h3>Kesalahan fatal</h3>
 <p><b>PFS GIC:</b> diagnosis salah, preparasi berlebihan, dugaan komplikasi pulpa tidak ditangani, salah indikasi bahan, kontaminasi/desikasi, varnish terlewat, defek atau kontak berlebih tidak diperbaiki.</p>
 <p><b>PRR resin:</b> diagnosis salah, preparasi berlebihan, kontaminasi tidak ditangani, adhesif wajib terlewat, curing kurang, defek terbuka, kontak berlebih, kebutuhan perawatan pulpa diabaikan.</p></section>
 <section class="ms"><span class="move how">cara kerja</span><h3>Kalimat pembuka (semua stasiun)</h3>
 <div class="sk yolk"><p class="hand" style="font-size:21px;line-height:1.25">"Saya memposisikan pasien dan operator di jam 10 untuk regio 4, memakai masker, handscoon, dan haircap. Saya cek oklusi awal, isolasi dengan cotton roll, lalu pemeriksaan dengan kaca mulut, sonde, dan pinset. Diagnosisnya…"</p></div></section>
 <section class="ms"><span class="move keep">pegang ini</span><h3>Kalimat jawaban siap pakai</h3>
 ${tbl(["Isian","Contoh"],[["Diagnosis PFS","Gigi 46 pit dan fisur dalam, bebas karies (ICDAS 0 / sound)"],["Alasan PFS","Pit fisur dalam rentan karies, gigi sehat, tidak ada karies proksimal, risiko karies tinggi. Gigi baru erupsi (6–7 th) makin butuh"],["Diagnosis PRR A","Gigi 36 karies enamel pada pit mesial oklusal, < 0,5 mm"],["Alasan PRR A","Karies dini di pit, tidak melibatkan proksimal, tidak luas sehingga tidak perlu restorasi seluruh permukaan"],["Alasan bahan GIC","DMFT ≥ 4,5, melepas fluor, toleran saliva. Kekurangan: retensi lebih lemah"],["Alasan bahan resin","DMFT ≤ 4,4, kooperatif, kontrol berkala, retensi kuat. Kekurangan: tanpa fluor"]])}</section>
 <section class="ms"><span class="move break">di mana patah</span><h3>Tanyakan dosen sebelum masuk</h3>
 <ul><li>PRR A: pakai bonding atau tidak?</li><li>Bur PRR B: no. ½ atau no. 1–2?</li><li>Liner Ca(OH)₂ di PRR C: rutin atau hanya bila ada indikasi?</li><li>Kode ICDAS: notasi "D2" seperti kunci, atau 0–6?</li><li>Komposit PRR B: flowable atau packable?</li></ul>
 ${tamago("Tanya dosen itu bukan tanda nggak siap. Itu tanda kamu baca semua sumber dan nemu bedanya.")}</section>`},

{id:"cekfakta",t:"Cek fakta dan sumber",cat:"kucing-ngecek",min:3,
 tldr:["Materimu tetap jadi pedoman. Yang aku cek hanya bagian yang rancu.","<b>Dikoreksi</b>: K1–K4 hanya untuk gigi sulung; Fuji VII bukan \"tipe 4\"; usia erupsi M2 ± 11–13; Mount & Hume Size 0 = lesi awal.","<b>Update</b>: data survival ART sudah ada; pedoman ADA/AAPD tidak mengunggulkan satu bahan silen.","<b>Belum terverifikasi</b>: persentase tipe fisur Nagano."],
 say:"Materimu tetap jadi pedoman. Yang dikoreksi: K satu sampai K empat hanya untuk gigi sulung, Fuji tujuh bukan tipe empat, dan usia erupsi molar kedua kira-kira sebelas sampai tiga belas tahun.",
 body:()=>`
 <section class="ms"><span class="move keep">pegang ini</span><h3>Ringkasan pengecekan</h3>
 ${tbl(["Klaim","Status","Catatan"],[["K1–K4 untuk gigi permanen","✗ dikoreksi","K1–K4 = gigi sulung. Permanen: ICDAS + WHO + Mount & Hume"],["Fuji VII = GIC tipe 4","✗ dikoreksi","Fuji VII = tipe VII (fluor tinggi), dipakai sebagai silen"],["9 tipe GIC (I–IX)","✓","Sesuai literatur"],["Molar kedua erupsi 12–14 th","~ dirapikan","± 11–13 th (rahang bawah 11–13)"],["Mount & Hume Size 0 = tidak ada lesi","~ dirapikan","Size 0 = lesi awal tanpa kavitas"],["ART: belum ada penelitian jangka panjang","ⓘ update","Meta-analisis 2012 & 2018 sudah ada"],["Silen menghentikan lesi awal","✓","Pedoman ADA/AAPD"],["DMFT menentukan bahan silen","ⓘ aturan lab","Pedoman ADA/AAPD tidak mengunggulkan satu bahan"],["Penetrasi silen U terbaik, I/IK terburuk","✓","Studi in vitro 2018, 2023"],["Bur PRR B no. 1–2 (catatan kuliah)","✓ sejalan","Deskripsi PRR klasik (Simonsen)"],["Persentase tipe fisur","? belum","Sumber primer tidak terindeks"],["ICDAS 0–6","✓","Kriteria ICDAS II"]])}</section>
 <section class="ms" id="daftar-pustaka"><span class="move keep">pegang ini</span><h3>Daftar pustaka</h3>
 <ol class="refs">${Object.entries(REF).map(([k,v])=>`<li id="ref-${k}">${v}</li>`).join("")}</ol>
 ${tamago("Ada daftar pustakanya, kok. Bisa kamu cek sendiri di PubMed pakai nomor PMID-nya.")}</section>`}
];
MATERI_ALL.push({id:"osceart",t:"Strategi OSCE ART",cat:"kucing-nunggu",min:4,act:{seq:"art"},
 tldr:["Hafal <b>lima jawaban lisan</b>: definisi dan tujuan, indikasi dan kontraindikasi, alat dan bahan, 14 langkah dengan alasannya, kenapa GIC.","Buka dengan <b>kalimat pembuka</b>: APD, alat, diagnosis singkat, rencana ART.","Langkah yang paling sering salah: <b>lembab, bukan kering</b>; aduk <b>maksimal 30 detik</b> dengan agate; <b>strip lalu tekan jari</b>; tutup <b>cocoa butter</b>.","Format penilaian konservasi tidak ada di materimu: <b>tanyakan dosen</b>."],
 say:"Strategi OSCE A R T. Hafal lima jawaban lisan: definisi dan tujuan, indikasi dan kontraindikasi, alat dan bahan, empat belas langkah dengan alasannya, dan kenapa G I C. Langkah yang paling sering salah: kavitas harus lembab, bukan kering. Aduk maksimal tiga puluh detik dengan agate. Tutup strip lalu tekan jari. Terakhir cocoa butter.",
 body:()=>`
 <section class="ms"><span class="move keep">pegang ini</span><h3>Lima jawaban lisan</h3>
 <ol><li><b>Definisi dan tujuan</b>: restorasi tanpa bur, pakai hand instrument dan GIC, sesuai WHO. Tujuannya mencegah karies makin parah dengan prinsip minimal intervention.</li><li><b>Indikasi</b>: terjangkau hand instrument, satu permukaan, karies enamel, karies dentin yang belum pernah sakit. <b>Kontraindikasi</b>: abses/fistula, kena pulpa, pulpitis kronis, pernah sakit lama, tidak terjangkau.</li><li><b>Alat dan bahan</b>, sebut sambil menunjuk.</li><li><b>Langkah</b> sambil bilang alasannya.</li><li><b>Kenapa GIC</b>: menempel kimia (tidak perlu bentuk retensi), melepas fluor, tidak mengiritasi pulpa.</li></ol>
 ${tamago("Kalau blank di ruangan: mulai dari benang merah kontraindikasi. Pulpa kena atau alat nggak nyampe. Sisanya ikut keluar.")}</section>
 <section class="ms"><span class="move how">cara kerja</span><h3>Kalimat pembuka</h3>
 <div class="sk yolk"><p class="hand" style="font-size:20px;line-height:1.25">"Saya memakai masker dan sarung tangan, lalu menyiapkan alat: kaca mulut, sonde, pinset, ekskavator kecil yang tajam, ball applicator, semen stopper, agate spatula, glass slab dan paper pad, celluloid strip, cotton pellet, dan GIC Fuji IX. Gigi karies satu permukaan, terjangkau ekskavator, belum pernah sakit, tidak ada abses atau fistula. Rencana saya ART dengan GIC."</p></div></section>
 <section class="ms"><span class="move how">cara kerja</span><h3>Dua versi urutan</h3>
 <p>Catatan tulisan tanganmu: 14 langkah (ada pahat enamel menggantung dan celluloid strip + tekan jari). Rangkuman: 15 langkah tanpa keduanya. Isi intinya sama.</p>
 ${more("Versi catatan (14 langkah)",steps(PROCS.art.steps.map(s=>`<b>${s[0]}.</b> ${s[1]} <span class="why2">↳ ${s[2]}</span>`)))}
 ${more("Versi rangkuman (15 langkah)",steps(["Cuci kavitas dengan water syringe, keringkan dengan air syringe.","Aplikasikan caries indicator dengan micro applicator di seluruh kavitas, tunggu 10–15 detik.","Cuci sampai terlihat beda warna: karies aktif (merah/biru) vs jaringan sehat.","Ekskavasi karies aktif dengan ekskavator tajam sampai habis.","Cuci dengan irigasi spuit dan jarum irigasi.","Keringkan dengan cotton pellet.","Aplikasikan dentin conditioner dengan micro applicator, diamkan 15 detik.","Cuci dengan irigasi spuit.","Keringkan dengan cotton pellet, kavitas tetap lembab.","Ambil GIC 1:1 (1 scoop bubuk, 1 tetes liquid) di paper pad di atas glass slab.","Bubuk dibagi dua. Sebagian diaduk dengan seluruh liquid pakai agate spatula (gerakan melipat), sisanya ditambahkan sampai homogen. Maksimal 30 detik.","Masukkan ke kavitas dengan ball applicator (bulk).","Konturing: buang kelebihan dengan instrumen plastis atau ekskavator sebelum mengeras.","Setelah mengeras, periksa adaptasi ke dinding kavitas, bentuk anatomis, dan kehalusan permukaan.","Oleskan varnish/cocoa butter/vaselin di seluruh permukaan dengan cotton pellet."]))}
 ${fact("warn","Kalau penguji pakai versi rangkuman, langkah pahat dan strip + tekan jari mungkin tidak dinilai. Tetap aman disebut sebagai \"bila perlu\".")}</section>
 <section class="ms"><span class="move break">di mana patah</span><h3>Yang bikin ART gagal</h3>
 <ul><li>Ekskavator tumpul: dentin sehat ikut tercungkil, karies tertinggal.</li><li>Kavitas dikeringkan sampai kering: GIC kekurangan air.</li><li>Adukan terlalu kental atau dipaksa masuk: tidak rapat ke dinding. Ini penyebab gagal yang paling sering.</li><li>Spatula logam: terkikis partikel kaca.</li><li>Lupa cocoa butter/varnish: GIC awal larut atau retak.</li><li>Gigi dengan fistula atau pulpa terbuka tetap di-ART: salah indikasi.</li></ul></section>
 <section class="ms"><span class="move break">di mana patah</span><h3>Tanyakan dosen sebelum masuk</h3>
 <ul><li>Format lembar jawaban dan skor untuk stasiun konservasi.</li><li>Urutan yang dipakai: 14 langkah (catatan) atau 15 langkah (rangkuman)?</li><li>Durasi conditioner: 10, 15, atau 20 detik (sesuai produk)?</li><li>Pelindung akhir: varnish atau cocoa butter yang disediakan?</li></ul></section>
 ${exam("\"Gigi 75 karies dentin pada satu permukaan oklusal, terjangkau ekskavator, belum pernah sakit, tidak ada abses atau fistula. Rencana: ART dengan GIC Fuji IX. Alasan: satu permukaan, pulpa aman, tanpa bur sehingga atraumatik, GIC menempel kimia dan melepas fluor.\"")}`});
