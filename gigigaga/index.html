BM_MODS.push(
 {id:"bm7",t:"Infeksi odontogenik: ke mana menyebar",min:6,inti:true,sub:"spasia, tanda bahaya, kapan rujuk",cards:[
  {k:"ch",m:"how",t:"Jalur penyebaran",s:["Pulpa nekrosis → infeksi keluar lewat apeks ke tulang.","Infeksi menembus tulang di bagian yang paling tipis dan terdekat dengan apeks.","Posisi apeks terhadap perlekatan otot menentukan spasia yang dituju.","Molar bawah: apeks di bawah garis mylohyoid → spasia submandibula; di atasnya → spasia sublingual.","Gigi atas: kaninus → spasia kaninus (dekat mata); molar → bukal atau infratemporal."]},
  {k:"g",q:"Infeksi dari molar kedua bawah yang apeksnya di bawah perlekatan otot mylohyoid akan menyebar ke…",o:["Spasia submandibula","Spasia sublingual","Spasia kaninus","Spasia bukal atas"],y:"Apeks di bawah garis mylohyoid membuat nanah keluar di bawah otot itu, ke spasia submandibula."},
  {k:"c",m:"break",t:"Tanda bahaya: rujuk segera",b:"<ul><li><b>Sulit menelan atau bernapas</b>, suara berubah, lidah terangkat.</li><li>Trismus berat.</li><li>Bengkak cepat meluas, terutama ke dasar mulut atau leher.</li><li>Demam tinggi, lemas, takikardia (tanda sistemik/sepsis).</li><li>Bengkak periorbita.</li></ul><p><b>Angina Ludwig</b>: selulitis bilateral spasia submandibula, sublingual, dan submental. Ancaman utamanya <b>jalan napas</b>.</p>"},
  {k:"g",q:"Pasien bengkak dasar mulut kedua sisi, lidah terangkat, sulit menelan, suara serak. Tindakan?",o:["Rujuk segera ke rumah sakit, amankan jalan napas","Resep antibiotik oral dan kontrol 3 hari","Insisi intraoral di kursi gigi lalu pulang","Kompres hangat di rumah"],y:"Ini gambaran angina Ludwig. Prioritas pertama jalan napas, dan penanganan di rumah sakit."}]},
 {id:"bm8",t:"Drainase dan antibiotik",min:6,sub:"sumber, drainase, antibiotik bila sistemik",cards:[
  {k:"c",m:"keep",t:"Tiga pilar penanganan",b:"<ol><li><b>Hilangkan sumber</b>: perawatan saluran akar atau pencabutan.</li><li><b>Drainase</b>: lewat saluran akar, insisi abses, atau soket pencabutan.</li><li><b>Antibiotik</b> hanya bila ada keterlibatan sistemik atau penyebaran.</li></ol>"},
  {k:"c",m:"keep",t:"Kapan antibiotik (ADA 2019)",b:"<ul><li><b>Tidak dianjurkan</b> untuk pulpitis ireversibel simptomatik, periodontitis apikal, atau abses lokal tanpa tanda sistemik, bila perawatan definitif bisa dilakukan.</li><li><b>Dianjurkan</b> bila ada tanda sistemik (demam, malaise, limfadenopati) atau infeksi menyebar, sebagai tambahan perawatan definitif.</li><li>Pilihan pertama: <b>amoksisilin 500 mg 3×/hari</b> atau penisilin V 500 mg 4×/hari, <b>3–7 hari</b>. Evaluasi hari ke-3; hentikan 24 jam setelah gejala sistemik hilang.</li></ul>"},
  {k:"g",q:"Pasien pulpitis ireversibel simptomatik tanpa bengkak dan tanpa demam. Antibiotik?",o:["Tidak perlu; lakukan perawatan definitif (pulpektomi atau cabut)","Amoksisilin 7 hari","Antibiotik dosis tinggi lalu tunda perawatan","Antibiotik profilaksis rutin"],y:"Nyeri pulpitis berasal dari pulpa yang meradang, bukan infeksi sistemik. Antibiotik tidak mengurangi nyeri dan menambah risiko resistensi."},
  {k:"ch",m:"how",t:"Insisi abses intraoral",s:["Anestesi di sekitar abses, bukan langsung ke dalam nanah (pH asam, anestesi kurang bekerja, nanah bisa terdorong).","Insisi di titik paling berfluktuasi dan paling rendah agar nanah mengalir dengan gravitasi.","Diseksi tumpul dengan hemostat untuk membuka kantong nanah.","Irigasi, pasang drain bila perlu.","Hilangkan sumber infeksi, kontrol 24–48 jam."]},
  {k:"g",q:"Di mana insisi abses dibuat?",o:["Di titik paling berfluktuasi dan paling rendah","Di titik paling keras","Sejauh mungkin dari abses","Di gingiva cekat gigi tetangga"],y:"Titik berfluktuasi menunjukkan nanah dekat permukaan; posisi rendah memanfaatkan gravitasi untuk drainase."}]},
 {id:"bm9",t:"Pasien kompromis medis",min:7,inti:true,sub:"ASA, antikoagulan, jantung, MRONJ",cards:[
  {k:"c",m:"keep",t:"Klasifikasi ASA",b:"<ul><li><b>I</b>: sehat.</li><li><b>II</b>: penyakit sistemik ringan terkontrol (hipertensi terkontrol, diabetes terkontrol).</li><li><b>III</b>: penyakit sistemik berat yang membatasi aktivitas.</li><li><b>IV</b>: penyakit berat yang terus mengancam nyawa.</li><li><b>V–VI</b>: tidak diharapkan bertahan tanpa operasi / mati batang otak.</li></ul><p>Bedah mulut di praktik umum (tingkat 4 di SKDGI) ditujukan untuk <b>ASA I–II</b>.</p>"},
  {k:"c",m:"keep",t:"Antikoagulan dan antiplatelet (SDCEP)",b:"<ul><li><b>Warfarin</b>: cek INR idealnya ≤24 jam sebelumnya. <b>INR &lt;4</b>: lanjut tanpa menghentikan obat, dengan hemostasis lokal (jahit dan tampon). INR ≥4: tunda atau rujuk.</li><li><b>DOAC</b>: tindakan risiko rendah tanpa perubahan. Risiko lebih tinggi: apiksaban/dabigatran lewatkan dosis pagi; rivaroksaban/edoksaban (dosis pagi) tunda sampai 4 jam setelah hemostasis.</li><li><b>Aspirin tunggal</b>: lanjut.</li><li>Jangan hentikan obat pada pasien katup jantung mekanis, stent koroner, atau trombosis baru tanpa konsultasi.</li></ul>"},
  {k:"g",q:"Pasien warfarin, INR kemarin 2,6, butuh pencabutan satu gigi. Tindakan?",o:["Cabut tanpa menghentikan warfarin, dengan hemostasis lokal (jahit dan tampon)","Hentikan warfarin 5 hari dulu","Tolak dan rujuk ke rumah sakit","Beri vitamin K sebelum mencabut"],y:"Pedoman SDCEP: INR di bawah 4 aman ditangani tanpa menghentikan obat, karena risiko trombosis akibat penghentian lebih besar daripada risiko perdarahan yang bisa dikontrol lokal."},
  {k:"c",m:"keep",t:"Profilaksis endokarditis (AHA 2021)",b:"<p>Hanya untuk pasien <b>risiko tertinggi</b>: katup jantung prostetik atau bahan prostetik untuk perbaikan katup, riwayat endokarditis, kelainan jantung bawaan tertentu, transplantasi jantung dengan kelainan katup. Untuk tindakan yang memanipulasi gingiva, daerah periapikal, atau menembus mukosa.</p><p>Regimen dewasa: <b>amoksisilin 2 g</b> per oral 30–60 menit sebelum tindakan (anak 50 mg/kg). <b>Klindamisin tidak lagi dianjurkan</b>; alternatif alergi penisilin antara lain sefaleksin, azitromisin/klaritromisin, atau doksisiklin.</p>"},
  {k:"g",q:"Pasien dengan katup jantung prostetik akan dicabut giginya. Profilaksis yang sesuai AHA 2021?",o:["Amoksisilin 2 g per oral 30–60 menit sebelum tindakan","Klindamisin 600 mg","Amoksisilin 500 mg 3×/hari selama 7 hari setelah tindakan","Tidak perlu profilaksis"],y:"Dosis tunggal sebelum tindakan untuk pasien risiko tertinggi. Klindamisin sudah dihapus dari rekomendasi 2021."},
  {k:"c",m:"break",t:"Antiresorptif dan MRONJ",b:"<p><b>MRONJ</b>: tulang rahang terbuka (atau bisa diprobe lewat fistula) lebih dari 8 minggu, pada pasien dengan riwayat obat antiresorptif (bisfosfonat, denosumab) atau antiangiogenik, tanpa riwayat radiasi atau metastasis di rahang.</p><ul><li>Risiko jauh lebih tinggi pada dosis onkologi daripada dosis osteoporosis.</li><li>Paling baik: selesaikan perawatan gigi <b>sebelum</b> terapi dimulai.</li><li>Pada pasien yang sudah memakai: hindari pencabutan yang tidak perlu, teknik atraumatik, tutup luka, klorheksidin.</li></ul>"},
  {k:"c",m:"keep",t:"Hipertensi dan diabetes",b:"<ul><li>Ukur tekanan darah sebelum tindakan. Tindakan elektif ditunda bila sekitar <b>≥180/110 mmHg</b>; rujuk.</li><li>Diabetes: tanyakan kontrol gula, jadwal pagi setelah makan dan minum obat seperti biasa, siapkan gula oral untuk hipoglikemia.</li></ul>"}]},
 {id:"bm10",t:"Kegawatdaruratan di praktik",min:6,inti:true,sub:"sinkop, anafilaksis, hipoglikemia, BHD",cards:[
  {k:"c",m:"keep",t:"Pola umum",b:"<p>Hentikan tindakan → posisikan pasien → nilai <b>ABC</b> (jalan napas, napas, sirkulasi) → beri oksigen bila ada → tangani penyebab → panggil bantuan bila tidak membaik.</p>"},
  {k:"ch",m:"how",t:"Sinkop vasovagal",s:["Cemas atau nyeri → refleks vagal → pembuluh darah melebar dan denyut melambat.","Aliran darah ke otak turun → pucat, berkeringat dingin, pusing, lalu pingsan.","Baringkan terlentang dengan kaki diangkat → aliran balik ke jantung dan otak naik.","Longgarkan pakaian, beri oksigen, pantau. Biasanya sadar dalam 1–2 menit; bila tidak, pikirkan penyebab lain."]},
  {k:"g",q:"Pasien pucat, berkeringat, lalu pingsan setelah disuntik anestesi. Langkah pertama?",o:["Baringkan terlentang dengan kaki diangkat, cek napas dan nadi","Dudukkan tegak","Suntik adrenalin","Beri minum manis selagi tidak sadar"],y:"Posisi terlentang dengan kaki diangkat mengembalikan aliran darah ke otak. Pasien tidak sadar tidak boleh diberi minum."},
  {k:"c",m:"keep",t:"Anafilaksis",b:"<p>Tanda: gatal dan bentol menyeluruh, bengkak bibir/lidah, sesak, mengi, tekanan darah turun.</p><ul><li><b>Adrenalin intramuskular</b> (1 mg/mL) di sepertiga tengah anterolateral paha: dewasa dan anak &gt;12 tahun <b>0,5 mg (0,5 mL)</b>; anak 6–12 tahun 0,3 mg; di bawah 6 tahun 0,15 mg.</li><li>Ulangi tiap 5 menit bila belum membaik.</li><li>Panggil bantuan, oksigen, posisi sesuai kondisi (terlentang, kaki diangkat; duduk bila sesak).</li></ul>"},
  {k:"g",q:"Dosis adrenalin IM untuk anafilaksis pada orang dewasa?",o:["0,5 mg (0,5 mL larutan 1 mg/mL) di paha anterolateral","5 mg intravena","0,05 mg subkutan","1 mg per oral"],y:"Adrenalin IM 0,5 mg di paha adalah terapi utama anafilaksis dewasa, diulang tiap 5 menit bila perlu."},
  {k:"c",m:"keep",t:"Hipoglikemia dan bantuan hidup dasar",b:"<ul><li><b>Hipoglikemia</b> (pasien diabetes, gelisah, berkeringat, bingung): bila sadar dan bisa menelan, beri <b>15–20 g gula</b> oral; ulang bila perlu. Bila tidak sadar: jangan beri makan/minum, panggil bantuan.</li><li><b>BHD dewasa</b>: tidak responsif dan tidak bernapas normal → panggil bantuan → kompresi dada <b>100–120/menit, kedalaman 5–6 cm</b>, rasio <b>30:2</b>, pakai AED secepatnya.</li></ul>"}]},
 {id:"bm11",t:"Kista rahang",min:6,sub:"radikular, dentigerous, keratokista",cards:[
  {k:"c",m:"keep",t:"Tiga yang paling sering ditanya",b:"<ul><li><b>Kista radikular</b>: paling sering. Dari sisa epitel Malassez di apeks gigi <b>nonvital</b>. Radiolusen bulat berbatas jelas di apeks.</li><li><b>Kista dentigerous</b>: mengelilingi <b>mahkota gigi yang belum erupsi</b>, melekat di batas sementum-enamel (sering molar ketiga bawah, kaninus atas).</li><li><b>Keratokista odontogenik</b>: sering di ramus/korpus posterior mandibula, tumbuh memanjang di dalam tulang, <b>kambuh</b> relatif sering.</li></ul>"},
  {k:"g",q:"Radiolusen berbatas jelas mengelilingi mahkota molar ketiga bawah yang impaksi, melekat di servikal. Diagnosis kerja?",o:["Kista dentigerous","Kista radikular","Granuloma periapikal","Keratokista di apeks gigi vital"],y:"Kista yang melekat di batas sementum-enamel dan membungkus mahkota gigi belum erupsi khas dentigerous."},
  {k:"ch",m:"how",t:"Enukleasi atau marsupialisasi",s:["<b>Enukleasi</b>: kista diangkat utuh. Satu kali tindakan, dan seluruh jaringan bisa diperiksa histopatologis.","Tapi pada kista sangat besar atau dekat struktur penting, enukleasi berisiko fraktur rahang, cedera saraf, atau merusak benih gigi.","<b>Marsupialisasi</b>: dinding kista dibuka dan dijahit ke mukosa, tekanan di dalam kista turun, kista mengecil, tulang terbentuk kembali.","Pada anak, marsupialisasi bisa mempertahankan gigi yang sedang tumbuh. Setelah mengecil, sisa kista bisa dienukleasi."]},
  {k:"g",q:"Kista besar pada anak 9 tahun, melibatkan benih premolar. Pilihan yang mempertahankan benih?",o:["Marsupialisasi","Reseksi rahang","Enukleasi agresif dengan benihnya","Hanya antibiotik"],y:"Marsupialisasi mengecilkan kista dengan menurunkan tekanan dan memberi kesempatan gigi yang tumbuh untuk erupsi."},
  {k:"c",m:"keep",t:"Selalu periksa histopatologi",b:"<p>Lesi yang tampak seperti kista bisa saja tumor (misalnya ameloblastoma). Jaringan yang diangkat dikirim untuk pemeriksaan histopatologis.</p>"}]},
 {id:"bm12",t:"Preprostetik dan dislokasi TMJ",min:5,sub:"alveolektomi, torus, reposisi rahang",cards:[
  {k:"c",m:"keep",t:"Bedah preprostetik sederhana",b:"<p>Tujuannya menyiapkan jaringan supaya gigi tiruan stabil dan nyaman:</p><ul><li><b>Alveolektomi/alveoloplasti</b>: meratakan tonjolan tulang tajam atau undercut setelah pencabutan.</li><li><b>Pengambilan torus</b> palatinus/mandibularis bila mengganggu gigi tiruan.</li><li><b>Frenektomi</b> bila frenulum mengganggu tepi gigi tiruan.</li></ul><p>Prinsip: buang tulang seminimal mungkin, karena tulang alveolar tidak tumbuh lagi.</p>"},
  {k:"ch",m:"how",t:"Dislokasi TMJ anterior",s:["Membuka mulut terlalu lebar (menguap, tindakan gigi lama) → kondilus melewati eminensia artikularis ke depan.","Otot kunyah kejang → mulut terkunci terbuka, tidak bisa menutup.","Reposisi: operator di depan pasien, ibu jari (dibungkus kasa) di oklusal molar bawah atau linea oblika eksterna.","Tekan <b>ke bawah</b> dulu agar kondilus lepas dari eminensia, lalu dorong <b>ke belakang</b>.","Setelahnya: batasi membuka mulut, makanan lunak beberapa hari."]},
  {k:"g",q:"Urutan arah tekanan saat mereposisi dislokasi TMJ anterior?",o:["Ke bawah dulu, lalu ke belakang","Ke atas dulu, lalu ke depan","Langsung ke belakang","Ke samping kanan dan kiri bergantian"],y:"Kondilus terkunci di depan eminensia; harus diturunkan dulu supaya bisa melewati eminensia kembali ke fossa."},
  {k:"c",m:"keep",t:"Mencegah dislokasi saat praktik",b:"<p>Pada pasien dengan riwayat dislokasi: jangan membuka mulut terlalu lebar terlalu lama, pakai bite block, beri jeda. Satu kejadian dislokasi meningkatkan risiko kejadian berikutnya.</p>"}]}
);

  <section class="ms"><span class="move how">cara kerja</span><h3>Mekanika pencabutan</h3>${steps(["Lepas perlekatan gingiva.","Luksasi dengan elevator, tumpuan tulang interdental.","Tang sejauh mungkin ke apikal, sejajar sumbu gigi.","Tekanan apikal, goyangan bukal-lingual terkontrol; rotasi hanya untuk akar tunggal membulat.","Periksa akar utuh, haluskan tulang tajam, tekan soket.","Tampon ±30 menit."])}${fact("info","Prinsip setara textbook bedah mulut, ditulis ulang.",["hupp"])}</section>
  <section class="ms"><span class="move keep">pegang ini</span><h3>Indikasi dan kontraindikasi relatif</h3><p><b>Indikasi</b>: karies tak terestorasi, periodontitis lanjut, sumber infeksi, impaksi bermasalah, ortodonti/prostetik, sebelum radioterapi bila prognosis buruk.</p><p><b>Kontraindikasi relatif</b>: gangguan perdarahan, jantung tidak stabil, diabetes tak terkontrol, riwayat radiasi rahang, antiresorptif dosis onkologi.</p></section>
  <section class="ms"><span class="move break">di mana patah</span><h3>Komplikasi</h3>${tbl(["Komplikasi","Tanda","Penanganan"],[["Perdarahan","Merembes terus","Tekan tampon, hemostatik lokal, jahit"],["Dry socket","Hari 2–4, soket kosong, nyeri hebat, bau","Irigasi, dressing, analgesik"],["Komunikasi oroantral","Gelembung saat tiup hidung","Kecil: jaga bekuan + instruksi sinus; besar: tutup bedah/rujuk"],["Fraktur akar","Sisa akar di radiograf","Ambil bila mudah; ujung kecil dekat struktur penting bisa dipantau"],["Fraktur tuberositas","Tulang ikut bergerak saat cabut molar atas","Hentikan, stabilkan, rujuk bila besar"]])}
  ${fact("ok","Klorheksidin kumur (0,12% atau 0,2%) sebelum dan sesudah pencabutan menurunkan risiko dry socket (OR 0,38); gel di soket juga (OR 0,44). Kejadian 1–5% pada pencabutan rutin, sampai ±30% pada molar ketiga bedah.",["ds22"])}
  ${tamago("Dry socket itu luka yang kehilangan plester. Obatnya plester baru (dressing), bukan antibiotik.")}</section>`},
 {id:"bm-odontektomi",t:"Gigi impaksi dan odontektomi",cat:"kucing-kardus",min:7,
  tldr:["Klasifikasi: <b>Winter</b> (angulasi) dan <b>Pell & Gregory</b> (kelas I–III terhadap ramus, posisi A–C kedalaman).","Dicabut bila ada <b>patologi</b>; pencabutan profilaksis gigi tanpa gejala tidak didukung bukti kuat (Cochrane 2020).","Tanda risiko saraf: <b>akar menggelap, garis putih kanal terputus, kanal berbelok</b>.","Odontektomi: flap → buang tulang dengan irigasi → <b>potong gigi</b> → keluarkan → debridemen → jahit."],
  say:"Gigi impaksi diklasifikasikan dengan Winter dan Pell dan Gregory. Dicabut bila ada patologi. Pencabutan profilaksis untuk gigi tanpa gejala belum didukung bukti kuat. Tanda risiko saraf di radiograf: akar menggelap, garis putih kanal terputus, dan kanal berbelok.",
  body:()=>`
  <section class="ms"><span class="move keep">pegang ini</span><h3>Klasifikasi</h3>${tbl(["Sistem","Kategori"],[["Winter","Mesioangular (tersering), vertikal, horizontal, distoangular"],["Pell & Gregory kelas","I: ruang cukup · II: sebagian di ramus · III: seluruhnya di ramus"],["Pell & Gregory posisi","A: setinggi oklusal M2 · B: antara oklusal dan servikal · C: di bawah servikal"]])}</section>
  <section class="ms"><span class="move why">kenapa ada</span><h3>Kapan dicabut</h3><ul><li>Perikoronitis berulang.</li><li>Karies molar ketiga yang tak terawat, atau karies/resorpsi distal molar kedua.</li><li>Kista atau tumor terkait.</li><li>Penyakit periodontal di distal molar kedua.</li></ul>${fact("ok","Cochrane 2020: bukti untuk mencabut atau mempertahankan molar ketiga impaksi tanpa gejala dan tanpa penyakit bermutu rendah sampai sangat rendah.",["m3c20"])}</section>
  <section class="ms"><span class="move break">di mana patah</span><h3>Risiko saraf alveolaris inferior</h3><ul><li>Akar menggelap di tempat kanal melintas.</li><li>Garis putih (lamina) kanal terputus.</li><li>Kanal berbelok mengikuti akar.</li></ul>${fact("ok","Tiga tanda ini yang paling bermakna berkaitan dengan cedera saraf pada studi Rood & Shehab.",["rood90"])}${tamago("Kanal yang belok di dekat akar itu kayak kabel listrik di balik tembok yang mau dibor. Cek dulu sebelum ngebor.")}</section>
  <section class="ms"><span class="move how">cara kerja</span><h3>Langkah dan alasannya</h3>${steps(PROCS.odontektomi.steps.map(s=>`<b>${s[0]}.</b> ${s[1]} <span class="why2">↳ ${s[2]}</span>`))}</section>
  ${exam("\"Gigi 48 impaksi mesioangular kelas II posisi B dengan perikoronitis berulang. Rencana odontektomi dengan pemotongan gigi. Radiograf menunjukkan kanal berbelok dan garis putih terputus, jadi risiko parestesia dijelaskan saat informed consent dan dipertimbangkan CBCT.\"")}`},
 {id:"bm-infeksi",t:"Infeksi odontogenik",cat:"kucing-gelas",min:7,
  tldr:["Penyebaran ditentukan <b>letak apeks terhadap perlekatan otot</b> (misalnya mylohyoid).","Tanda bahaya: <b>sulit menelan/bernapas</b>, trismus berat, bengkak cepat meluas, demam tinggi → rujuk. <b>Angina Ludwig</b> mengancam jalan napas.","Tiga pilar: <b>hilangkan sumber, drainase, antibiotik bila sistemik</b>.","ADA 2019: tidak ada antibiotik untuk pulpitis/abses lokal tanpa tanda sistemik. Bila perlu: amoksisilin 500 mg 3×/hari, 3–7 hari."],
  say:"Penyebaran infeksi odontogenik ditentukan letak apeks terhadap perlekatan otot. Tanda bahaya adalah sulit menelan atau bernapas, trismus berat, dan bengkak yang cepat meluas. Penanganannya: hilangkan sumber, drainase, dan antibiotik hanya bila ada tanda sistemik.",
  body:()=>`
  <section class="ms"><span class="move how">cara kerja</span><h3>Gigi ke spasia</h3>${tbl(["Gigi sumber","Spasia yang sering terkena"],[["Molar bawah, apeks di bawah mylohyoid","Submandibula"],["Premolar/molar bawah, apeks di atas mylohyoid","Sublingual"],["Insisif bawah","Submental"],["Kaninus atas","Kaninus (dekat mata)"],["Molar atas","Bukal, infratemporal"]])}</section>
  <section class="ms"><span class="move break">di mana patah</span><h3>Rujuk segera bila</h3><ul><li>Sulit menelan atau bernapas, lidah terangkat, suara berubah.</li><li>Trismus berat.</li><li>Bengkak meluas cepat ke leher atau periorbita.</li><li>Demam tinggi, takikardia, lemas.</li></ul>${tamago("Infeksi gigi bisa jadi urusan jalan napas. Kalau lidah sudah terangkat, ini bukan lagi kasus kursi gigi.")}</section>
  <section class="ms"><span class="move keep">pegang ini</span><h3>Antibiotik (ADA 2019)</h3>${tbl(["Kondisi","Antibiotik?"],[["Pulpitis ireversibel simptomatik","Tidak"],["Nekrosis pulpa + periodontitis apikal simptomatik","Tidak (perawatan definitif)"],["Abses lokal tanpa tanda sistemik","Tidak, bila drainase/perawatan definitif bisa"],["Abses dengan tanda sistemik atau menyebar","Ya, sebagai tambahan perawatan definitif"]])}
  <p>Pilihan pertama: amoksisilin 500 mg 3×/hari atau penisilin V 500 mg 4×/hari, 3–7 hari. Evaluasi hari ke-3, hentikan 24 jam setelah gejala sistemik hilang.</p>${fact("ok","Pedoman klinis ADA 2019.",["ada19"])}</section>
  <section class="ms"><span class="move how">cara kerja</span><h3>Insisi abses</h3>${steps(PROCS.insisi.steps.map(s=>`<b>${s[0]}.</b> ${s[1]} <span class="why2">↳ ${s[2]}</span>`))}</section>`},
 {id:"bm-kompromis",t:"Pasien kompromis medis dan kegawatdaruratan",cat:"kucing-nunggu",min:8,
  tldr:["Praktik umum: bedah mulut untuk <b>ASA I–II</b>; ASA III ke atas konsultasi/rujuk.","<b>Warfarin INR &lt;4</b>: cabut tanpa menghentikan obat, hemostasis lokal (SDCEP).","Profilaksis endokarditis hanya untuk <b>risiko tertinggi</b>: amoksisilin 2 g 30–60 menit sebelum; <b>klindamisin tidak lagi dianjurkan</b> (AHA 2021).","Darurat: sinkop → baring, kaki diangkat. Anafilaksis → <b>adrenalin 0,5 mg IM</b> di paha. BHD 30:2, 100–120/menit."],
  say:"Bedah mulut di praktik umum untuk pasien A S A satu dan dua. Pasien warfarin dengan I N R di bawah empat boleh dicabut tanpa menghentikan obat. Profilaksis endokarditis hanya untuk pasien risiko tertinggi, amoksisilin dua gram sebelum tindakan. Anafilaksis ditangani dengan adrenalin nol koma lima miligram intramuskular di paha.",
  body:()=>`
  <section class="ms"><span class="move keep">pegang ini</span><h3>ASA</h3>${tbl(["Kelas","Arti"],[["I","Sehat"],["II","Penyakit sistemik ringan terkontrol"],["III","Penyakit sistemik berat"],["IV","Penyakit berat mengancam nyawa"],["V–VI","Tidak diharapkan bertahan / mati batang otak"]])}</section>
  <section class="ms"><span class="move keep">pegang ini</span><h3>Antikoagulan dan antiplatelet</h3>${tbl(["Obat","Sikap untuk pencabutan"],[["Warfarin","Cek INR ≤24 jam; INR <4 lanjut dengan hemostasis lokal; ≥4 tunda/rujuk"],["Apiksaban, dabigatran","Risiko lebih tinggi: lewatkan dosis pagi"],["Rivaroksaban, edoksaban (pagi)","Tunda dosis sampai 4 jam setelah hemostasis"],["Aspirin tunggal","Lanjut"],["Antiplatelet ganda","Konsultasi dokter yang meresepkan"]])}${fact("ok","Pedoman SDCEP edisi 2.",["sdcep"])}</section>
  <section class="ms"><span class="move keep">pegang ini</span><h3>Profilaksis endokarditis</h3><p>Risiko tertinggi: katup prostetik atau bahan prostetik perbaikan katup, riwayat endokarditis, kelainan jantung bawaan tertentu, transplantasi jantung dengan valvulopati.</p>${tbl(["Situasi","Regimen dosis tunggal 30–60 menit sebelum"],[["Dewasa","Amoksisilin 2 g oral"],["Anak","Amoksisilin 50 mg/kg"],["Alergi penisilin","Sefaleksin, azitromisin/klaritromisin, atau doksisiklin"]])}${fact("ok","AHA 2021: tidak ada perubahan kelompok risiko dari 2007; klindamisin dihapus karena efek samping lebih sering dan berat; doksisiklin ditambahkan.",["aha21"])}</section>
  <section class="ms"><span class="move break">di mana patah</span><h3>MRONJ</h3><p>Tulang rahang terbuka &gt;8 minggu pada pasien dengan riwayat antiresorptif/antiangiogenik, tanpa radiasi rahang atau metastasis.</p><ul><li>Risiko jauh lebih tinggi pada dosis onkologi.</li><li>Selesaikan perawatan gigi sebelum terapi dimulai.</li><li>Yang sudah memakai: hindari pencabutan tidak perlu, teknik atraumatik, tutup luka, klorheksidin.</li></ul>${fact("info","Posisi AAOMS 2022. \"Drug holiday\" sebelum pencabutan masih diperdebatkan; ikuti konsultasi dengan dokter yang meresepkan.",["mronj22"])}</section>
  <section class="ms"><span class="move how">cara kerja</span><h3>Kegawatdaruratan</h3>${tbl(["Kondisi","Tanda","Tindakan"],[["Sinkop","Pucat, berkeringat, pingsan, nadi lambat","Terlentang, kaki diangkat, oksigen"],["Anafilaksis","Bentol, bengkak bibir/lidah, sesak, hipotensi","Adrenalin 0,5 mg IM paha (anak 6–12: 0,3 mg; <6: 0,15 mg), ulang tiap 5 menit, panggil bantuan"],["Hipoglikemia","Gelisah, berkeringat, bingung","Sadar: 15–20 g gula oral; tidak sadar: jangan beri minum, panggil bantuan"],["Henti jantung","Tidak responsif, tidak bernapas normal","Kompresi 100–120/menit, 5–6 cm, 30:2, AED"]])}${fact("ok","Dosis adrenalin dan BHD sesuai pedoman resusitasi.",["resus21"])}</section>`},
 {id:"bm-kista",t:"Kista rahang, preprostetik, dislokasi TMJ",cat:"telur-kucing-tidur",min:6,
  tldr:["<b>Kista radikular</b> tersering (gigi nonvital). <b>Dentigerous</b> membungkus mahkota gigi belum erupsi. <b>Keratokista</b> sering kambuh.","<b>Enukleasi</b> mengangkat utuh; <b>marsupialisasi</b> untuk kista besar, dekat struktur penting, atau pada anak.","Semua jaringan diperiksa <b>histopatologi</b>.","Dislokasi TMJ: tekan <b>ke bawah, lalu ke belakang</b>; setelahnya batasi membuka mulut."],
  say:"Kista radikular paling sering dan berasal dari gigi nonvital. Kista dentigerous membungkus mahkota gigi yang belum erupsi. Kista besar atau pada anak bisa dimarsupialisasi. Dislokasi rahang direposisi dengan menekan ke bawah lalu ke belakang.",
  body:()=>`
  <section class="ms"><span class="move keep">pegang ini</span><h3>Kista yang sering</h3>${tbl(["Kista","Asal/letak","Catatan"],[["Radikular","Apeks gigi nonvital (sisa epitel Malassez)","Tersering"],["Dentigerous","Membungkus mahkota gigi belum erupsi, melekat di servikal","Sering M3 bawah, kaninus atas"],["Keratokista odontogenik","Posterior mandibula/ramus","Kambuh relatif sering"]])}${fact("info","Ringkasan setara textbook patologi/bedah mulut, ditulis ulang.",["hupp"])}</section>
  <section class="ms"><span class="move how">cara kerja</span><h3>Enukleasi vs marsupialisasi</h3>${tbl(["","Enukleasi","Marsupialisasi"],[["Cara","Kista diangkat utuh","Dinding dibuka dan dijahit ke mukosa"],["Kelebihan","Sekali tindakan, histopatologi lengkap","Aman untuk kista besar, melindungi struktur dan benih gigi"],["Kekurangan","Risiko fraktur/cedera saraf pada kista besar","Lama, perlu perawatan dan kontrol, sisa jaringan"]])}${tamago("Marsupialisasi itu mengempiskan balon pelan-pelan, bukan menariknya keluar sekaligus.")}</section>
  <section class="ms"><span class="move keep">pegang ini</span><h3>Bedah preprostetik</h3><ul><li>Alveoloplasti/alveolektomi: ratakan tulang tajam dan undercut.</li><li>Torus yang mengganggu gigi tiruan.</li><li>Frenektomi bila mengganggu tepi gigi tiruan.</li><li>Buang tulang seminimal mungkin.</li></ul></section>
  <section class="ms"><span class="move how">cara kerja</span><h3>Dislokasi TMJ anterior</h3>${steps(["Kondilus melewati eminensia ke depan; otot kejang, mulut terkunci terbuka.","Operator di depan, ibu jari berbalut kasa di oklusal molar bawah.","Tekan ke bawah sampai kondilus lepas dari eminensia.","Dorong ke belakang ke dalam fossa.","Batasi membuka mulut dan makanan lunak beberapa hari."])}</section>`}
);

  if(c.k==="g"){const L="ABCD",st=it.st;let h=`<div class="card"><span class="move guess">tebak dulu</span><h2 class="card-title">${esc(c.q)}</h2><div class="opts">${it.ord.map((o,i)=>{let cl="";if(st.picked!=null){if(o===0)cl="right";else if(o===st.picked)cl="wrong"}return `<button class="opt ${cl}" data-o="${o}" ${st.picked!=null?"disabled":""}><span class="lt">${L[i]}</span><span>${esc(c.o[o])}</span></button>`}).join("")}</div>`;
    if(st.picked===0)h+=`<div class="sk mint pop rx">${catImg(pick(["kucing-lompat","kucing-kardus","kucing-karton"]),"t1")}<div><b class="big2">${esc(st.line)}</b><p><b class="hand">Nalarnya:</b> ${esc(c.y)}</p></div></div>`;
    else if(st.picked!=null)h+=`<div class="sk pop rx laugh">${catImg(pick(["kucing-gelas","kucing-cair"]),"t1")}<div><b class="big2">${esc(st.line)}</b><p class="small">Oke, sekarang ngecek.</p></div></div><div class="sk check"><p><b class="hand">Kamu pilih:</b> ${esc(c.o[st.picked])}</p><p><b class="hand">Kenapa salah:</b> ${esc(it.w[st.picked-1]||"Belum cocok dengan soalnya.")}</p><p><b class="hand">Yang bener:</b> <b>${esc(c.o[0])}</b>. ${esc(c.y)}</p></div>`;

    $("#pl-body").innerHTML=`<div class="card fin">${catImg("kucing-lompat","t1")}<h2 class="card-title">Modul selesai!</h2><p>${P.ok} tebakan benar, ${P.ng} salah. Yang salah masuk antrean <b>Review</b>.</p><div class="row"><a class="btn" href="#/p/${P.p.id}" id="pl-done">Kembali ke paket</a>${nextMod(P)?`<a class="btn white" href="#/b/${P.p.id}/${nextMod(P)}">Modul berikutnya ›</a>`:""}</div></div>`;

// ================= KUIS (dipakai juga untuk Review) =================
function quizItemFromKey(k){
  if(k.startsWith("q:")){const q=QBY[k.slice(2)];if(!q)return null;return {k,tag:q[1],q:q[2],o:q[3],y:q[4],w:W_Q[q[0]]||[]}}
  if(k.startsWith("g:")){const [,pid,mid,ci]=k.split(":");const m=MOD_BY[mid];if(!m)return null;const c=m.cards[+ci];if(!c||c.k!=="g")return null;const gi=m.cards.slice(0,+ci).filter(x=>x.k==="g").length;return {k,tag:m.t,q:c.q,o:c.o,y:c.y,w:(W_MOD[m.id]||[])[gi]||[]}}
  return null}
let QZ=null;
function pgQuiz(pid,mode){const p=PACK[pid];
  let keys;if(mode==="review"){keys=shuffle(dueKeys()).slice(0,12)}else{if(!p)return pg404();keys=shuffle(QUIZ_ALL.filter(q=>p.quiz.includes(q[1])).map(q=>"q:"+q[0])).slice(0,10)}
  const items=keys.map(quizItemFromKey).filter(Boolean).map(x=>Object.assign(x,{ord:shuffle(x.o.map((_,i)=>i)),st:{}}));
  QZ={p,mode,items,i:0,ok:0,combo:0};renderQuiz()}
function renderQuiz(){const Q=QZ;const back=Q.mode==="review"?"#/review":"#/p/"+Q.p.id;

  if(!Q.items.length){V.innerHTML=head+`<div class="empty big">${catImg("telur-kucing-tidur","t1")}<div><h1 class="h1">Antrean kosong</h1><p>Belum ada yang perlu diulang. Salah dulu di modul atau kuis, nanti muncul di sini.</p><a class="btn" href="#/">Ke beranda</a></div></div>`;return}
  const it=Q.items[Q.i];
  if(!it){sparks();V.innerHTML=head+`<div class="empty big">${catImg("kucing-lompat","t1")}<div><h1 class="h1">${Q.ok}/${Q.items.length} benar</h1><p>${Q.ok===Q.items.length?"Bersih. Kucingnya bangga.":"Yang salah sudah masuk antrean Review."}</p><div class="row"><a class="btn" href="${location.hash}" id="qz-again">Ulang</a><a class="btn white" href="${back}">Kembali</a></div></div></div>`;
    $("#qz-again").onclick=e=>{e.preventDefault();Q.mode==="review"?pgQuiz(null,"review"):pgQuiz(Q.p.id)};return}
  const L="ABCD",st=it.st;
  let h=head+`<div class="quiz"><div class="row"><span class="move guess">${esc(it.tag)}</span><span class="spacer"></span><span class="muted small">${Q.i+1}/${Q.items.length}${Q.combo>=3?` · combo ${Q.combo}`:""}</span></div><div class="bar sm"><i style="width:${Math.round(100*Q.i/Q.items.length)}%"></i></div>
   <h2 class="card-title">${esc(it.q)}</h2><div class="opts">${it.ord.map((o,i)=>{let cl="";if(st.picked!=null){if(o===0)cl="right";else if(o===st.picked)cl="wrong"}return `<button class="opt ${cl}" data-o="${o}" ${st.picked!=null?"disabled":""}><span class="lt">${L[i]}</span><span>${esc(it.o[o])}</span></button>`}).join("")}</div>`;
  if(st.picked===0)h+=`<div class="sk mint pop rx">${catImg("kucing-kardus","t1")}<div><b class="big2">${esc(st.line)}</b><p><b class="hand">Nalarnya:</b> ${esc(it.y)}</p></div></div>`;
  else if(st.picked!=null)h+=`<div class="sk pop rx laugh">${catImg("kucing-cair","t1")}<div><b class="big2">${esc(st.line)}</b></div></div><div class="sk check"><p><b class="hand">Kamu pilih:</b> ${esc(it.o[st.picked])}</p><p><b class="hand">Kenapa salah:</b> ${esc(it.w[st.picked-1]||"Belum cocok dengan soalnya.")}</p><p><b class="hand">Yang bener:</b> <b>${esc(it.o[0])}</b>. ${esc(it.y)}</p></div>`;
  h+=`<div class="row" style="margin-top:6px"><span class="spacer"></span><button class="btn" id="qz-next" ${st.picked==null?"disabled":""}>${Q.i===Q.items.length-1?"Lihat hasil":"Lanjut ›"}</button></div></div>`;
  V.innerHTML=h;
  V.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(st.picked!=null)return;const o=+b.dataset.o,ok=o===0;st.picked=o;if(ok){Q.ok++;Q.combo++;st.line=COMBO_LINE[Q.combo]||pick(PRAISE);markRight(it.k)}else{Q.combo=0;st.line=pick(ROAST);markWrong(it.k)}S.n++;save();renderQuiz();const e=$(".rx");if(e)e.scrollIntoView({behavior:reduce?"auto":"smooth",block:"nearest"})});
  $("#qz-next").onclick=()=>{Q.i++;renderQuiz();window.scrollTo({top:0})};
}

// ================= SUSUN URUTAN =================
function pgUrutan(pid,k){const p=PACK[pid],P=PROCS[k];if(!p||!P)return pg404();
  const U={pool:shuffle(P.steps.map((_,i)=>i)),placed:[],miss:0,hint:""};
  const draw=()=>{const n=P.steps.length,done=U.placed.length===n;
    V.innerHTML=`${crumbs([["Jelajah","#/jelajah"],[p.t,"#/p/"+p.id],["Urutan "+P.name]])}<div class="phead"><h1 class="h1">Susun urutan ${esc(P.name)}</h1><p class="muted">Ketuk langkah berikutnya. Salah ketuk, muncul petunjuk alasannya.</p></div>
    <div class="row"><span class="stat">${U.placed.length}/${n}</span><span class="stat">salah ${U.miss}</span><span class="spacer"></span><button class="btn sm white" id="u-re">Ulang</button></div><div class="bar"><i style="width:${Math.round(100*U.placed.length/n)}%"></i></div>
    <ol class="seq">${U.placed.map(i=>`<li><span class="n">${i+1}</span><div><b>${esc(P.steps[i][0])}</b><span class="why">${esc(P.steps[i][2])}</span></div></li>`).join("")}</ol>
    ${U.hint?`<div class="hint">${U.hint}</div>`:""}
    ${done?`<div class="sk mint pop">${catImg("kucing-lompat","t1")}<b class="big2">${U.miss?"Selesai, "+U.miss+" kali salah. Ulang sampai nol.":"Nol salah. Siap ujian."}</b></div>`:`<div class="pool">${U.pool.filter(i=>!U.placed.includes(i)).map(i=>`<button data-i="${i}">${esc(P.steps[i][0])}</button>`).join("")}</div>`}`;
    V.querySelectorAll(".pool button").forEach(b=>b.onclick=()=>{const i=+b.dataset.i,exp=U.placed.length;if(i===exp){U.placed.push(i);U.hint="";if(U.placed.length===n){sparks();markRight("o:"+k)}}else{U.miss++;b.classList.add("wrong");U.hint=`<b>Belum.</b> Langkah ke-${exp+1} itu soal: ${esc(P.steps[exp][2])}`;if(U.miss===1)markWrong("o:"+k)}save();setTimeout(draw,U.hint&&i!==exp?320:0)});
    $("#u-re").onclick=()=>pgUrutan(pid,k)};
  draw()}

function pgTraps(pid){const p=PACK[pid];if(!p)return pg404();

  V.querySelectorAll(".flip").forEach(b=>b.onclick=()=>b.setAttribute("aria-pressed",String(b.getAttribute("aria-pressed")!=="true")))}
function pgCases(pid,ci){const p=PACK[pid];if(!p)return pg404();const list=p.cases.map(id=>CASE_BY[id]).filter(Boolean);ci=Math.min(+ci||0,list.length-1);const C=list[ci];
  const st={qi:0,score:0,picked:null,ord:shuffle([0,1,2,3])};
  const draw=()=>{const q=C.qs[st.qi];
    V.innerHTML=`${crumbs([["Jelajah","#/jelajah"],[p.t,"#/p/"+p.id],["Kasus"]])}<div class="chips">${list.map((c,i)=>`<a class="chip" href="#/x/${p.id}/${i}" aria-pressed="${i===ci}">${i+1} · ${esc(c.title)}</a>`).join("")}</div>
    <div class="sk yolk"><div class="tape"></div><p class="vign">${esc(C.v)}</p></div>
    ${q?`<div class="quiz"><span class="move guess">${esc(q[0])}</span><h2 class="card-title">${esc(q[1])}</h2><div class="opts">${st.ord.filter(o=>o<q[2].length).map((o,i)=>{let cl="";if(st.picked!=null){if(o===0)cl="right";else if(o===st.picked)cl="wrong"}return `<button class="opt ${cl}" data-o="${o}" ${st.picked!=null?"disabled":""}><span class="lt">${"ABCD"[i]}</span><span>${esc(q[2][o])}</span></button>`}).join("")}</div>
     ${st.picked!=null?`<div class="sk ${st.picked===0?"mint":""} pop"><b class="big2">${st.picked===0?esc(pick(PRAISE)):esc(pick(ROAST))}</b><p><b class="hand">Nalarnya:</b> ${esc(q[3])}</p></div><div class="row"><span class="spacer"></span><button class="btn" id="cs-next">${st.qi<C.qs.length-1?"Lanjut ›":"Lihat jawaban lengkap"}</button></div>`:""}</div>`
     :`<div class="sk mint"><h3>${st.score}/${C.qs.length} benar</h3><dl class="answers">${Object.entries(C.ans||{}).map(([a,b])=>`<div><dt>${esc(a.replace(/_/g," "))}</dt><dd>${esc(b)}</dd></div>`).join("")}</dl><div class="row" style="margin-top:10px"><a class="btn sm mint" href="#/u/${p.id}/${C.proc}">Susun urutan ${esc(PROCS[C.proc].name)} ›</a>${ci<list.length-1?`<a class="btn sm white" href="#/x/${p.id}/${ci+1}">Kasus berikutnya</a>`:""}</div></div>`}`;
    V.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(st.picked!=null)return;st.picked=+b.dataset.o;if(st.picked===0)st.score++;draw()});
    const nx=$("#cs-next");if(nx)nx.onclick=()=>{st.qi++;st.picked=null;st.ord=shuffle([0,1,2,3]);draw()}};
  draw()}

// ================= REVIEW & PROFIL =================
function pgReview(){const d=dueKeys();const byPack={};d.forEach(k=>{const pid=k.startsWith("g:")?k.split(":")[1]:k.startsWith("q:")?(PACKS.find(p=>QBY[k.slice(2)]&&p.quiz.includes(QBY[k.slice(2)][1]))||{}).id:"lain";byPack[pid]=(byPack[pid]||0)+1});
  V.innerHTML=`<div class="phead"><h1 class="h1">Review</h1><p class="muted">Semua yang pernah salah, dari semua paket, dikumpulkan di sini sampai kamu jawab benar.</p></div>
  <div class="sk yolk revbox">${catImg(d.length?"kucing-ngecek":"telur-kucing-tidur","t1")}<div><b class="big">${d.length}</b><p>soal menunggu diulang</p>${d.length?`<a class="btn" href="#/r/go">${ic("rep")} Mulai sesi (maks 12)</a>`:`<a class="btn white" href="#/jelajah">Jelajah dulu</a>`}</div></div>
  ${d.length?`<section><h2 class="h2">Asal soal</h2><div class="slist">${Object.entries(byPack).map(([pid,n])=>`<div class="srow"><span class="lv kk">${n}</span><span class="st">${esc(PACK[pid]?PACK[pid].t:"Lainnya")}</span></div>`).join("")}</div></section>`:""}`}
function pgProfil(){const nWish=Object.keys(S.wish).length;
  V.innerHTML=`<div class="phead"><h1 class="h1">Profil</h1></div>
  <div class="grid g-stat"><div class="sk"><b class="big">${S.n}</b><p>jawaban</p></div><div class="sk"><b class="big">${Object.keys(S.mread).length}</b><p>bab dibaca</p></div><div class="sk"><b class="big">${PACKS.filter(p=>packProg(p).pct>=100).length}</b><p>paket tuntas</p></div><div class="sk"><b class="big">${nWish}</b><p>topik diminta</p></div></div>
  <section class="sk blue"><h3>Langganan</h3><p>Semua paket di versi ini gratis. Struktur Free/Pro sudah disiapkan di app, harga dan cara bayar belum ditentukan.</p><div class="plans"><div class="plan"><b>Free</b><span>Peta kurikulum, pencarian, paket dasar</span></div><div class="plan pro"><b>Pro</b><span>Semua paket, review tanpa batas, mode ujian (rencana)</span></div></div></section>
  <section class="sk"><h3>Pengaturan</h3><div class="chips"><button class="chip" id="pf-snd" aria-pressed="${!!S.sound}">Suara Dengerin: ${S.sound?"nyala":"mati"}</button><button class="chip" id="pf-theme">Tema: ${document.documentElement.dataset.theme||"ikut sistem"}</button></div><div class="row" id="pf-reset-w" style="margin-top:10px"><button class="btn sm white" id="pf-reset">Reset progres</button></div></section>
  <section class="sk alt"><h3>Sumber dan kredit</h3><ul class="tight small"><li>Kerangka kurikulum: <a href="${SRC.skdgi2015.u}" target="_blank" rel="noopener">${esc(SRC.skdgi2015.t)}</a> (resmi).</li><li>Daftar keterampilan klinis dan penyakit: ${esc(SRC.skdgi2020.t)} (draf, tingkat kemampuan perlu dicek ulang).</li><li>Isi paket: draf dari catatan Blok 24, akan ditulis ulang dari textbook dan evidence terbaru dengan sitasi per klaim.</li><li>Gaya visual dan maskot: tamagoendogg.</li></ul></section>`;
  $("#pf-snd").onclick=()=>{S.sound=!S.sound;save();if(!S.sound)hush();pgProfil()};
  $("#pf-theme").onclick=()=>{const r=document.documentElement,t=r.dataset.theme;r.dataset.theme=t==="dark"?"light":t==="light"?"":"dark";if(!r.dataset.theme)delete r.dataset.theme;try{localStorage.setItem("tkg-theme",r.dataset.theme||"")}catch(e){}pgProfil()};
  $("#pf-reset").onclick=()=>{$("#pf-reset-w").innerHTML='<span>Hapus semua progres?</span><button class="btn sm" id="pf-yes">Ya</button><button class="btn sm white" id="pf-no">Batal</button>';$("#pf-no").onclick=pgProfil;$("#pf-yes").onclick=()=>{S.learn={};S.wrong={};S.right={};S.mread={};S.n=0;S.last=null;save();pgProfil()}};
}

// ================= ROUTER =================
function route(){hush();const h=location.hash||"#/";const [path,qs]=h.slice(1).split("?");const a=path.split("/").filter(Boolean);const q=new URLSearchParams(qs||"");
  setNav(h);if(!/^#\/b\//.test(h)&&PL){PL=null;$("#player").hidden=true;document.body.classList.remove("noscroll")}
  window.scrollTo({top:0});
  switch(a[0]){
   case undefined:pgHome();break;
   case "jelajah":pgJelajah(a[1]);break;
   case "d":pgDisc(a[1]);break;case "s":pgSkill(a[1]);break;case "c":pgCond(a[1]);break;case "k":pgKomp(a.slice(1).join("/"));break;
   case "p":pgPack(a[1]);break;case "m":pgMateri(a[1],q.get("p"));break;
   case "b":if(PACK[a[1]])pgPack(a[1]);openPlayer(a[1],a[2]);break;
   case "q":pgQuiz(a[1]);break;case "u":pgUrutan(a[1],a[2]);break;case "t":pgTraps(a[1]);break;case "x":pgCases(a[1],a[2]);break;
   case "review":pgReview();break;case "r":pgQuiz(null,"review");break;case "profil":pgProfil();break;
   default:pg404()}
  const t=document.querySelector("#view h1");document.title=(t&&a[0]?t.textContent.trim()+" · ":"")+"GigiGaga";
}
window.addEventListener("hashchange",route);
try{const th=localStorage.getItem("tkg-theme");if(th)document.documentElement.dataset.theme=th}catch(e){}
route();

})();
