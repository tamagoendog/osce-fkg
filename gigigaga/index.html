const IK_MODS=[
 {id:"ik1",t:"Gigi sulung bukan permanen versi mini",min:5,inti:true,sub:"anatomi yang mengubah cara merawat",cards:[
  {k:"c",m:"why",t:"Kenapa bentuknya beda",b:"<p>Gigi sulung hanya dipakai beberapa tahun, dan di bawahnya ada <b>benih gigi permanen</b> yang sedang tumbuh. Hampir semua perbedaannya bisa diturunkan dari dua fakta itu.</p><p>Tiga yang paling berpengaruh di klinik: <span class='hl'>enamel lebih tipis</span>, <span class='hl'>ruang pulpa lebih besar dengan tanduk pulpa tinggi</span>, dan <span class='hl'>akar molar yang melebar</span>.</p>"},
  {k:"ch",m:"how",t:"Dari anatomi ke keputusan klinis",s:["Enamel dan dentin tipis → karies menembus ke dentin lalu ke pulpa jauh lebih cepat daripada di gigi permanen.","Tanduk pulpa tinggi (terutama mesiobukal molar) → preparasi yang terasa dangkal pun bisa membuka pulpa.","Akibatnya lesi proksimal molar sulung sering berakhir dengan <b>perawatan pulpa</b>.","Servikal menyempit dan ada tonjolan servikal di bukal molar pertama → retensi tambalan proksimal lemah, tapi pas untuk <b>mahkota stainless steel</b> yang \"mengunci\" di bawah tonjolan itu."]},
  {k:"g",q:"Kenapa akar molar sulung melebar (divergen)?",o:["Memberi ruang untuk benih premolar di antara akarnya","Supaya kuat menahan gaya kunyah orang dewasa","Karena akarnya belum selesai terbentuk","Supaya gigi gampang dicabut"],y:"Benih premolar tumbuh tepat di bawah molar sulung, di antara akarnya. Akar yang melebar memberi ruang itu, dan nantinya teresorpsi saat premolar erupsi."},
  {k:"c",m:"keep",t:"Perbedaan yang sering ditanya",b:"<ul><li><b>Warna</b>: lebih putih susu (enamel lebih opak).</li><li><b>Enamel</b>: lebih tipis, ketebalan merata.</li><li><b>Mahkota</b>: lebih pendek, servikal menyempit tajam.</li><li><b>Pulpa</b>: relatif lebih besar, tanduk pulpa lebih tinggi.</li><li><b>Akar</b>: lebih panjang dan ramping dibanding mahkotanya; akar molar melebar.</li><li><b>Kontak proksimal molar</b>: berupa bidang lebar, bukan titik → karies proksimal sulit terlihat, butuh radiograf bitewing.</li></ul>"},
  {k:"g",q:"Preparasi kelas II molar sulung, bur masuk sedikit lebih dalam dari rencana. Risiko terbesar?",o:["Terbukanya tanduk pulpa","Fraktur akar","Benih premolar terkena","Retak enamel di sisi lingual"],y:"Tanduk pulpa sulung tinggi dan dekat permukaan, jadi kedalaman yang aman di gigi permanen bisa sudah mengenai pulpa di gigi sulung."},
  {k:"c",m:"ana",t:"Rumah kontrakan di atas fondasi rumah baru",b:"<p>Gigi sulung itu rumah kontrakan yang dibangun tepat di atas fondasi rumah permanen. Dindingnya tipis (enamel), ruangannya besar (pulpa), dan tiangnya dibuat mengangkang supaya fondasi baru di bawahnya tidak tertindih (akar melebar).</p>"}]},
 {id:"ik2",t:"Jadwal erupsi dan cara membacanya",min:5,sub:"urutan lebih penting dari angka",cards:[
  {k:"c",m:"keep",t:"Rentang erupsi (perkiraan)",b:"<p><b>Gigi sulung</b> (bulan): insisif sentral 6–12, lateral 9–16, molar pertama 13–19, kaninus 16–23, molar kedua 23–33. Lengkap sekitar usia 2,5–3 tahun.</p><p><b>Gigi permanen</b> (tahun): molar pertama dan insisif sentral bawah 6–7, insisif sentral atas 7–8, lateral 7–9, kaninus bawah 9–10, premolar 10–12, kaninus atas 11–12, molar kedua 11–13, molar ketiga 17–21.</p><p class='muted'>Angka berbeda tipis antar tabel. Yang dihafal: urutan dan kira-kira usianya.</p>"},
  {k:"ch",m:"how",t:"Molar enam tahun yang sering tertukar",s:["Sekitar usia 6 tahun, molar pertama permanen tumbuh di belakang molar kedua sulung.","Ia tidak menggantikan gigi apa pun, jadi tidak ada gigi yang tanggal sebelumnya.","Orang tua sering mengira itu gigi susu yang \"nanti juga ganti\".","Akibatnya gigi permanen pertama dibiarkan berlubang, padahal ia kunci oklusi seumur hidup.","Karena baru erupsi dan fisurnya dalam, ia kandidat utama <b>PFS dan fluor</b>."]},
  {k:"g",q:"Ibu: \"Geraham baru anak saya (6 tahun) berlubang, tapi nanti juga ganti kan?\" Gigi apa itu?",o:["Molar pertama permanen, tidak akan diganti","Molar kedua sulung, nanti diganti premolar","Molar pertama sulung yang erupsi terlambat","Premolar yang erupsi terlalu cepat"],y:"Gigi yang muncul di belakang deretan gigi sulung pada usia ±6 tahun adalah molar pertama permanen. Tidak ada gigi yang menggantikannya."},
  {k:"c",m:"break",t:"Kapan erupsi perlu dicurigai",b:"<ul><li><b>Gigi natal/neonatal</b>: ada saat lahir atau di bulan pertama. Biasanya insisif bawah dari seri sulung, bukan gigi tambahan. Dicabut bila sangat goyang (risiko teraspirasi) atau melukai lidah/puting saat menyusu.</li><li><b>Erupsi jauh terlambat</b> dari rentang: evaluasi radiograf dan kondisi sistemik (misalnya hipotiroid, sindrom Down).</li><li><b>Persistensi gigi sulung</b>: gigi sulung belum tanggal padahal penggantinya sudah muncul.</li><li><b>Ankilosis</b>: gigi sulung menyatu dengan tulang, tampak lebih rendah dari tetangganya (infraoklusi), bunyi perkusi padat.</li></ul>"},
  {k:"g",q:"Gigi 85 tampak lebih rendah dari gigi sebelahnya dan bunyi ketukannya \"padat\". Curiga apa?",o:["Ankilosis","Intrusi akibat trauma","Gigi natal","Persistensi biasa"],y:"Infraoklusi ditambah bunyi perkusi padat (bukan redam) khas ankilosis: ligamen periodontal hilang dan akar menyatu dengan tulang, jadi gigi tertinggal saat tulang tumbuh."},
  {k:"c",m:"keep",t:"Soal tumbuh gigi (teething)",b:"<p>Tumbuh gigi bisa membuat rewel, ngiler, dan gusi gatal. Tapi <b>demam tinggi, diare berat, atau sakit berat jangan langsung disalahkan ke tumbuh gigi</b>; cari penyebab lain.</p>"}]},
 {id:"ik3",t:"Membaca anak sebelum membaca giginya",min:6,inti:true,sub:"Frankl, tell-show-do, teknik dasar",cards:[
  {k:"c",m:"why",t:"Kenapa perilaku dulu",b:"<p>Anak yang takut tidak bisa dirawat dengan aman, dan pengalaman buruk di kursi gigi sering terbawa sampai dewasa. Tujuan manajemen perilaku ada dua: <span class='hl'>perawatan hari ini berhasil dengan aman</span>, dan <span class='hl'>anak pulang dengan sikap positif</span> terhadap perawatan gigi.</p>"},
  {k:"c",m:"keep",t:"Skala Frankl",b:"<ul><li><b>1 · Definitely negative (− −)</b>: menolak, menangis keras, melawan.</li><li><b>2 · Negative (−)</b>: enggan, menarik diri, tidak mau ikut instruksi.</li><li><b>3 · Positive (+)</b>: menerima perawatan, kadang hati-hati, mau ikut instruksi.</li><li><b>4 · Definitely positive (+ +)</b>: akrab dengan operator, tertarik, menikmati.</li></ul><p class='muted'>Dicatat di awal dan sepanjang kunjungan. Skor berubah, dan perubahannya menunjukkan teknik yang dipakai berhasil atau tidak.</p>"},
  {k:"ch",m:"how",t:"Tell-show-do bekerja karena mengurangi ketidakpastian",s:["<b>Tell</b>: jelaskan dengan kata yang dimengerti anak (\"sikat putar\", \"air mancur kecil\").","<b>Show</b>: tunjukkan bunyinya, rasanya, di kuku atau jarinya.","<b>Do</b>: kerjakan <i>persis</i> seperti yang ditunjukkan.","Anak takut pada yang tidak bisa ditebak. Begitu bisa ditebak, rasa takut turun.","Kalau yang dilakukan berbeda dari yang ditunjukkan, kepercayaan rusak dan teknik ini tidak jalan lagi."]},
  {k:"g",q:"Anak 5 tahun takut bunyi bur. Penerapan tell-show-do yang benar?",o:["Sebut \"sikat putar\", perdengarkan dan sentuhkan ke kukunya, lalu pakai alat yang sama","Kerjakan secepat mungkin supaya anak tidak sempat takut","Bilang \"ini sama sekali tidak sakit\" lalu langsung mulai","Tunjukkan sikat putar, tapi pakai alat lain yang belum ditunjukkan"],y:"Kuncinya urutan dan konsistensi: dijelaskan, ditunjukkan, lalu dikerjakan persis seperti yang ditunjukkan."},
  {k:"c",m:"how",t:"Teknik dasar lain",b:"<ul><li><b>Penguatan positif</b>: puji perilaku yang spesifik (\"buka mulutnya lebar, hebat\"), bukan sekadar \"pintar\".</li><li><b>Distraksi</b>: alihkan perhatian (cerita, hitung, video).</li><li><b>Voice control</b>: perubahan volume, nada, atau tempo yang disengaja untuk merebut perhatian dan menghentikan perilaku mengganggu. Bukan marah. Jelaskan ke orang tua dulu.</li><li><b>Komunikasi nonverbal</b>: kontak mata, ekspresi, sentuhan yang menenangkan.</li><li><b>Kehadiran/ketidakhadiran orang tua</b>: dipakai sesuai respons anak.</li><li><b>Modelling</b>: anak melihat anak lain atau saudaranya dirawat dengan tenang.</li></ul>"},
  {k:"g",q:"Tujuan utama voice control adalah…",o:["Merebut perhatian anak dan menghentikan perilaku yang mengganggu","Menghukum anak yang tidak menurut","Membuat orang tua lebih percaya pada dokter","Mempercepat perawatan"],y:"Voice control adalah perubahan suara yang terkontrol untuk mendapatkan perhatian, bukan ekspresi marah atau hukuman."},
  {k:"c",m:"break",t:"Teknik lanjut: hanya dengan indikasi",b:"<p><b>Stabilisasi protektif</b>, <b>sedasi</b> (misalnya N₂O), dan <b>anestesi umum</b> dipakai bila teknik dasar tidak cukup dan perawatan tidak bisa ditunda. Butuh informed consent tertulis dan indikasi jelas; sedasi dan anestesi umum biasanya dirujuk.</p><p><b>Hand-over-mouth (HOME)</b> sudah tidak ada dalam pedoman AAPD. Jangan dipakai.</p>"}]},
 {id:"ik4",t:"Pasien anak berkebutuhan khusus",min:4,sub:"tingkat 2: paham, siapkan, rujuk",cards:[
  {k:"c",m:"why",t:"Kenapa perlu persiapan khusus",b:"<p>Kondisi medis, sensorik, atau perkembangan bisa mengubah risiko karies dan periodontal, cara berkomunikasi, posisi kursi, dan obat yang aman. Di tingkat dokter gigi umum, targetnya <b>mengenali, menyiapkan, merawat yang sederhana, dan merujuk</b> yang kompleks.</p>"},
  {k:"c",m:"keep",t:"Contoh yang sering ditemui",b:"<ul><li><b>Autisme</b>: butuh rutinitas yang sama, peka terhadap suara/lampu/sentuhan. Kunjungan pengenalan singkat, urutan sama tiap kali.</li><li><b>Sindrom Down</b>: penyakit periodontal lebih awal dan lebih berat, makroglosia, sering ada kelainan jantung bawaan (konsultasi dokter anak/jantung soal profilaksis antibiotik bila ada indikasi).</li><li><b>Cerebral palsy</b>: refleks dan kontrol otot terganggu, posisi kepala perlu ditopang, risiko tersedak.</li><li><b>Anak dengan obat sirup bergula jangka panjang</b>: risiko karies naik.</li></ul>"},
  {k:"g",q:"Strategi paling membantu untuk kunjungan pertama anak autis?",o:["Kunjungan pengenalan singkat, urutan sama tiap kali, kurangi rangsang lampu dan suara","Langsung tindakan lengkap supaya tidak perlu datang berkali-kali","Ganti operator tiap kunjungan supaya anak terbiasa orang baru","Pakai banyak mainan berbunyi untuk distraksi"],y:"Anak autis lebih nyaman dengan hal yang bisa ditebak dan rangsang yang minim. Pengenalan bertahap dengan urutan yang konsisten mengurangi kecemasan."},
  {k:"c",m:"keep",t:"Yang selalu dikerjakan",b:"<ul><li>Riwayat medis lengkap dan obat yang dipakai.</li><li>Konsultasi dengan dokter yang merawat bila perlu.</li><li>Kunjungan pendek, di jam anak paling tenang.</li><li>Pencegahan agresif: fluor, sealant, edukasi pengasuh.</li></ul>"}]},
 {id:"ik5",t:"Karies anak usia dini (ECC)",min:5,inti:true,sub:"definisi, pola, dan kenapa insisif bawah selamat",cards:[
  {k:"c",m:"keep",t:"Definisi (AAPD)",b:"<p><b>ECC</b>: satu atau lebih permukaan gigi sulung yang karies (kavitas maupun belum), hilang karena karies, atau ditambal, pada anak <b>di bawah 6 tahun</b> (71 bulan).</p><p><b>S-ECC (berat)</b>: di bawah 3 tahun, karies permukaan halus apa pun sudah termasuk berat. Usia 3–5 tahun: karies permukaan halus di insisif atas, atau skor dmfs ≥4 (3 tahun), ≥5 (4 tahun), ≥6 (5 tahun).</p>"},
  {k:"ch",m:"how",t:"Kenapa polanya khas",s:["Minuman manis atau susu dalam botol menjelang tidur, dan ngemil manis yang sering.","Gula berlama-lama di permukaan gigi, sementara aliran ludah turun saat tidur.","Asam dari bakteri tidak sempat dinetralkan → demineralisasi permukaan halus.","Insisif atas paling dulu kena; insisif bawah terlindung lidah dan dekat muara kelenjar ludah.","Tanpa intervensi, lesi meluas ke molar sulung pertama."]},
  {k:"g",q:"Pola karies: semua insisif atas rusak, insisif bawah utuh. Kenapa insisif bawah selamat?",o:["Terlindung lidah dan dekat muara kelenjar ludah","Enamel insisif bawah lebih tebal","Insisif bawah erupsi lebih lambat","Insisif bawah lebih sering tersikat"],y:"Saat menyusu atau minum dari botol, lidah menutupi insisif bawah, dan ludah dari kelenjar submandibula/sublingual membilas daerah itu."},
  {k:"c",m:"how",t:"Penilaian risiko karies (CRA)",b:"<p>CRA menggabungkan tiga kelompok: <b>faktor risiko</b> (gula sering, plak, karies ibu/pengasuh, status sosial), <b>faktor pelindung</b> (fluor, sikat gigi diawasi, kunjungan rutin), dan <b>temuan klinis</b> (white spot, kavitas, restorasi baru). Hasilnya rendah/sedang/tinggi, yang menentukan <b>interval kontrol</b> dan <b>intervensi</b>.</p>"},
  {k:"g",q:"Anak 2 tahun punya white spot di servikal insisif atas, minum susu botol sampai tertidur. Risiko kariesnya?",o:["Tinggi","Rendah, karena belum ada kavitas","Sedang, tunggu sampai ada kavitas","Tidak bisa dinilai sebelum usia 3 tahun"],y:"White spot aktif pada balita ditambah kebiasaan minum manis menjelang tidur sudah cukup untuk kategori risiko tinggi."}]},
 {id:"ik6",t:"Fluor dan SDF: dosis yang pas",min:6,inti:true,sub:"pasta gigi, varnish, silver diamine fluoride",cards:[
  {k:"ch",m:"how",t:"Cara fluor bekerja",s:["Fluor di ludah dan plak ikut masuk saat enamel mengalami remineralisasi.","Terbentuk fluorapatit/fluorhidroksiapatit yang lebih tahan asam.","Demineralisasi melambat, remineralisasi lebih cepat, metabolisme bakteri ikut terhambat.","Karena itu efek <b>topikal</b> (kontak dengan permukaan gigi) yang paling penting."]},
  {k:"c",m:"keep",t:"Pasta gigi berfluor untuk anak",b:"<ul><li><b>Di bawah 3 tahun</b>: <span class='hl'>olesan tipis sebesar butir beras</span> (smear).</li><li><b>3–6 tahun</b>: <span class='hl'>sebesar kacang polong</span>.</li><li>Sikat 2× sehari, disikatkan atau diawasi orang tua. Ludahkan sisa pasta, jangan kumur berlebihan.</li></ul>"},
  {k:"g",q:"Anak 2 tahun. Berapa banyak pasta gigi berfluor yang dipakai?",o:["Olesan tipis sebesar butir beras","Sebesar kacang polong","Pakai pasta tanpa fluor sampai umur 6 tahun","Sepanjang bulu sikat"],y:"Di bawah 3 tahun cukup smear sebesar butir beras: dapat manfaat fluor, risiko tertelan berlebihan kecil."},
  {k:"c",m:"keep",t:"Varnish fluor",b:"<p>NaF 5% (22.600 ppm F), dioleskan tipis, mengeras saat kena ludah, melepas fluor perlahan. Untuk risiko sedang–tinggi, diulang tiap <b>3–6 bulan</b>.</p>"},
  {k:"c",m:"keep",t:"Silver diamine fluoride (SDF) 38%",b:"<p>Dioleskan pada lesi kavitas untuk <b>menghentikan</b> karies tanpa pengeboran. Cocok untuk anak yang belum kooperatif atau lesi banyak.</p><ul><li><b>Wajib diinformasikan</b>: lesi yang diolesi berubah <b>hitam permanen</b>.</li><li>Kontraindikasi: alergi perak, ulserasi atau stomatitis di mulut.</li><li>Hindari mengenai kulit/mukosa (noda sementara).</li></ul>"},
  {k:"g",q:"Orang tua setuju SDF untuk karies insisif atas anaknya. Informasi yang wajib disampaikan?",o:["Lesi yang diolesi akan menghitam permanen","Gigi akan memutih setelah beberapa minggu","SDF menggantikan sikat gigi","SDF cukup sekali seumur hidup"],y:"Noda hitam pada lesi adalah efek pasti dari perak, dan alasan utama penolakan. Persetujuan harus berdasarkan informasi ini."},
  {k:"c",m:"break",t:"Seberapa kuat buktinya",b:"<p>Varnish: Cochrane 2013 menemukan pencegahan sekitar <b>37% permukaan karies gigi sulung</b> dan 43% gigi permanen dibanding tanpa varnish.</p><p>SDF: AAPD 2017 memberi rekomendasi <b>kondisional</b> berbasis bukti mutu rendah; Cochrane 2024 menilai buktinya masih belum pasti. Artinya SDF berguna, tapi bukan pengganti kontrol diet dan fluor rutin.</p>"}]},
 {id:"ik7",t:"Pulpa gigi sulung: sampai mana bisa diselamatkan",min:7,inti:true,sub:"IPT, pulpotomi, pulpektomi, atau cabut",cards:[
  {k:"c",m:"why",t:"Kenapa gigi sulung dipertahankan",b:"<p>Gigi sulung menjaga ruang untuk gigi permanen, membantu mengunyah dan bicara, dan menghindarkan anak dari pencabutan. Tujuan terapi pulpa: <b>gigi tetap sehat dan berfungsi sampai waktunya tanggal sendiri</b>.</p>"},
  {k:"ch",m:"how",t:"Mendiagnosis pulpa sulung",s:["Riwayat nyeri: <b>terprovokasi dan cepat hilang</b> (cenderung reversibel) vs <b>spontan, malam hari, lama</b> (ireversibel).","Tanda klinis: pembengkakan, fistula, kegoyangan patologis → pulpa nonvital/infeksi.","Radiograf: radiolusensi furkasi atau periapikal, resorpsi akar internal/eksternal, jarak ke benih.","Saat pulpa terbuka: perdarahan merah segar yang <b>berhenti dengan tekanan</b> → pulpa radikular masih sehat.","Tes vitalitas listrik/termal kurang andal pada anak, jadi tidak dipakai sendirian."]},
  {k:"c",m:"keep",t:"Tabel keputusan",b:"<ul><li><b>Lesi dalam, tanpa gejala pulpa</b> → <b>IPT</b> (indirect pulp treatment): sisakan dentin terdekat pulpa, tutup rapat.</li><li><b>Pulpa terbuka, vital, perdarahan berhenti</b> → <b>pulpotomi</b>.</li><li><b>Pulpitis ireversibel atau nekrosis, akar cukup, bisa direstorasi</b> → <b>pulpektomi</b>.</li><li><b>Resorpsi akar luas, tidak bisa direstorasi, infeksi mengenai benih</b> → <b>cabut</b> + pertimbangkan space maintainer.</li></ul>"},
  {k:"g",q:"Saat pulpotomi, perdarahan dari orifis tidak berhenti setelah ditekan kapas basah beberapa menit. Artinya?",o:["Radang sudah sampai pulpa radikular; beralih ke pulpektomi atau cabut","Tekan lebih lama sampai berhenti, lalu lanjut pulpotomi","Normal, langsung tutup dengan MTA","Tanda pulpa nekrosis total"],y:"Hemostasis adalah ujian untuk pulpa radikular. Kalau perdarahan tetap berlanjut, peradangan sudah melewati pulpa koronal dan pulpotomi kemungkinan gagal."},
  {k:"c",m:"keep",t:"Bahan pulpotomi: apa kata bukti",b:"<p>Meta-analisis 2017: IPT berhasil ±94% di 24 bulan. Semua jenis pulpotomi digabung ±83%. <b>MTA (±90%) dan formokresol (±85%) tertinggi</b> dan tidak berbeda bermakna; keduanya lebih baik daripada kalsium hidroksida.</p><p>Formokresol makin ditinggalkan karena kekhawatiran toksisitas, jadi MTA atau bahan kalsium silikat lain (misalnya Biodentine) sering jadi pilihan. Ferric sulfate juga dipakai.</p>"},
  {k:"g",q:"Bahan pulpotomi gigi sulung dengan bukti keberhasilan terbaik?",o:["MTA","Kalsium hidroksida","Eugenol murni","Natrium hipoklorit sebagai satu-satunya bahan"],y:"MTA punya angka keberhasilan tertinggi bersama formokresol, dengan bukti mutu tinggi, dan tidak membawa isu toksisitas formokresol."}]},
 {id:"ik8",t:"Pulpektomi gigi sulung",min:5,sub:"bahan harus ikut teresorpsi",cards:[
  {k:"c",m:"how",t:"Saluran akar sulung itu beda",b:"<p>Saluran berbentuk pita, berliku, banyak saluran tambahan, dan akarnya sedang teresorpsi. Instrumentasi dibuat <b>pendek dari apeks radiografis</b> dan tidak agresif supaya tidak mendorong bahan atau melukai benih.</p>"},
  {k:"c",m:"keep",t:"Indikasi dan kontraindikasi",b:"<p><b>Indikasi</b>: pulpitis ireversibel atau nekrosis pada gigi yang masih bisa direstorasi dan akarnya masih cukup panjang.</p><p><b>Kontraindikasi</b>: resorpsi akar luas, perforasi dasar pulpa, lesi periapikal yang mengenai benih, gigi tidak bisa direstorasi, gigi yang akan tanggal dalam waktu dekat.</p>"},
  {k:"g",q:"Kenapa bahan pengisi saluran akar gigi sulung harus bisa diresorpsi?",o:["Supaya ikut terserap bersama akar saat gigi permanen erupsi","Supaya lebih murah","Supaya saluran lebih cepat kering","Supaya radiopak"],y:"Akar gigi sulung akan teresorpsi. Bahan yang tidak bisa diresorpsi (seperti gutta-percha) bisa tertinggal dan mengganggu erupsi gigi permanen."},
  {k:"c",m:"keep",t:"Bahan pengisi: apa kata bukti",b:"<p>Meta-analisis 2020 (18 bulan): <b>ZOE dan Endoflas</b> berhasil sekitar 90%, sedangkan pasta iodoform saja 71% atau kurang. Gutta-percha tidak dipakai di gigi sulung.</p>"},
  {k:"c",m:"keep",t:"Restorasi akhir",b:"<p>Gigi sulung pascaperawatan pulpa paling awet ditutup <b>mahkota stainless steel (SSC)</b>. Kebocoran tepi adalah penyebab umum kegagalan terapi pulpa.</p>"},
  {k:"g",q:"Molar sulung pascapulpektomi. Restorasi akhir yang dianjurkan?",o:["Mahkota stainless steel","Tambalan GIC satu permukaan","Tidak perlu ditutup","Pasak dan inti"],y:"Mahkota menutup seluruh gigi yang sudah rapuh dan mencegah kebocoran, yang sering jadi penyebab kegagalan terapi pulpa."}]}
];

const IK_W={
 ik1:[["Gaya kunyah anak lebih kecil. Bentuk akar mengikuti kebutuhan ruang benih, bukan beban kunyah.","Akar molar sulung yang sudah terbentuk lengkap pun tetap melebar; ini bentuk, bukan tahap.","Akar melebar justru membuat pencabutan lebih berisiko mematahkan akar atau melukai benih."],
      ["Fraktur akar bukan akibat kedalaman preparasi kavitas.","Benih ada di bawah akar, jauh dari dasar kavitas oklusal.","Retak enamel lingual tidak berkaitan dengan kedalaman bur ke arah pulpa."]],
 ik2:[["Molar kedua sulung sudah ada sejak usia ±2–3 tahun, bukan baru tumbuh di usia 6.","Molar pertama sulung tumbuh di usia 1–1,5 tahun dan letaknya di depan molar kedua sulung.","Premolar baru erupsi usia 10–12 tahun dan menggantikan molar sulung, bukan tumbuh di belakangnya."],
      ["Intrusi butuh riwayat trauma dan biasanya mengenai insisif; perkusinya tidak khas padat.","Gigi natal muncul saat lahir, bukan molar kedua sulung anak usia sekolah.","Persistensi berarti gigi sulung belum tanggal; ia tidak membuat gigi tenggelam di bawah bidang oklusal."]],
 ik3:[["Kecepatan tanpa penjelasan justru menambah ketidakpastian, sumber utama rasa takut.","Janji \"sama sekali tidak sakit\" yang tidak terbukti merusak kepercayaan.","Kalau yang dikerjakan berbeda dari yang ditunjukkan, kepercayaan rusak dan teknik ini gagal."],
      ["Voice control tidak boleh dipakai untuk menghukum atau melampiaskan marah.","Kepercayaan orang tua datang dari penjelasan, bukan dari perubahan suara ke anak.","Kecepatan bukan tujuannya; tujuannya mendapatkan perhatian anak."]],
 ik4:[["Tindakan panjang di kunjungan pertama justru menambah kecemasan anak autis.","Pergantian orang membuat situasi tidak bisa ditebak, kebalikan dari yang dibutuhkan.","Banyak bunyi dan rangsang bisa membuat anak dengan sensitivitas sensorik makin tertekan."]],
 ik5:[["Ketebalan enamel insisif atas dan bawah tidak berbeda bermakna; bedanya ada di perlindungan lidah dan ludah.","Insisif bawah justru erupsi lebih dulu, jadi lebih lama terpapar.","Kebiasaan menyikat tidak membedakan rahang atas dan bawah secara sistematis."],
      ["White spot aktif sudah lesi karies; tidak perlu menunggu kavitas.","Menunggu kavitas berarti kehilangan kesempatan remineralisasi.","CRA bisa dan sebaiknya dinilai sejak gigi pertama erupsi."]],
 ik6:[["Sebesar kacang polong untuk usia 3–6 tahun.","Pasta tanpa fluor menghilangkan manfaat pencegahan; yang diatur adalah jumlahnya.","Sepanjang bulu sikat terlalu banyak untuk balita dan menambah risiko fluorosis."],
      ["SDF tidak memutihkan; justru menghitamkan lesi.","SDF adalah tambahan, bukan pengganti kebersihan mulut.","Efek terbaik didapat dengan aplikasi berulang sesuai protokol."]],
 ik7:[["Perdarahan yang tidak berhenti adalah tanda radang di pulpa radikular, bukan masalah kurang lama menekan.","Menutup pulpa yang meradang dengan MTA tetap berisiko gagal.","Pulpa nekrosis tidak berdarah segar; perdarahan berlebih justru tanda radang."],
      ["Kalsium hidroksida punya keberhasilan lebih rendah daripada MTA dan formokresol.","Eugenol murni tidak dipakai sebagai medikamen pulpotomi.","Natrium hipoklorit sebagai bahan tunggal kurang berhasil dibanding formokresol pada data yang ada."]],
 ik8:[["Biaya bukan alasan biologisnya.","Resorpsi bahan tidak berhubungan dengan kecepatan saluran kering.","Radiopasitas penting untuk evaluasi, tapi bukan alasan utama bahan harus bisa diresorpsi."],
      ["Tambalan satu permukaan mudah bocor pada gigi yang sudah rapuh.","Gigi pascaperawatan pulpa wajib ditutup rapat; kebocoran membuat perawatan gagal.","Pasak dan inti tidak dipakai di gigi sulung."]]
};

// ================= IKGA bagian 2: anestesi & pencabutan, restorasi sulung, space maintainer, trauma =================
IK_MODS.push(
 {id:"ik9",t:"Anestesi lokal anak: dihitung, bukan ditebak",min:6,inti:true,sub:"dosis per kg, teknik, instruksi pulang",cards:[
  {k:"c",m:"why",t:"Kenapa harus dihitung",b:"<p>Berat badan anak kecil, jadi batas toksik anestesi lokal tercapai jauh lebih cepat daripada orang dewasa. Overdosis anestesi lokal termasuk penyebab komplikasi serius pada perawatan gigi anak. Karena itu dosis maksimal <b>dihitung dari berat badan</b> sebelum menyuntik.</p>"},
  {k:"c",m:"keep",t:"Dosis maksimal (pedoman AAPD)",b:"<ul><li><b>Lidokain</b>: 4,4 mg/kg, maksimal 300 mg.</li><li><b>Mepivakain</b>: 4,4 mg/kg, maksimal 300 mg.</li><li><b>Artikain</b>: 7 mg/kg, maksimal 500 mg.</li><li><b>Prilokain</b>: 8 mg/kg, maksimal 600 mg.</li></ul><p>Satu karpul 1,8 mL lidokain 2% = <b>36 mg</b>.</p>"},
  {k:"ch",m:"how",t:"Cara menghitung",s:["Timbang anak, jangan menebak dari umur.","Dosis maksimal = berat (kg) × mg/kg. Contoh 20 kg × 4,4 = 88 mg lidokain.","Bagi dengan isi satu karpul: 88 ÷ 36 ≈ 2,4 karpul.","Itu batas atas, bukan target. Pakai sesedikit mungkin yang cukup."]},
  {k:"g",q:"Anak 15 kg, lidokain 2% karpul 1,8 mL. Batas maksimalnya kira-kira?",o:["± 1,8 karpul","± 3 karpul","± 4 karpul","Sama dengan dewasa, maksimal 8 karpul"],y:"15 × 4,4 = 66 mg; 66 ÷ 36 ≈ 1,8 karpul."},
  {k:"c",m:"how",t:"Teknik pada anak",b:"<ul><li>Anestesi topikal dulu di titik suntik, lalu injeksi pelan.</li><li><b>Foramen mandibula anak lebih rendah</b> daripada dewasa (sekitar setinggi bidang oklusal), jadi blok mandibula diarahkan lebih rendah.</li><li>Untuk molar sulung, infiltrasi bukal (terutama dengan artikain) sering cukup karena tulang anak lebih tipis dan porous.</li></ul>"},
  {k:"g",q:"Setelah blok mandibula, anak boleh pulang. Instruksi paling penting?",o:["Awasi supaya anak tidak menggigit bibir atau pipi yang masih baal","Langsung makan supaya tidak lemas","Kumur air hangat tiap jam","Kompres hangat di pipi"],y:"Bibir dan pipi yang baal sering digigit anak tanpa terasa, menimbulkan luka (trauma pascaanestesi) yang sering disangka infeksi."}]},
 {id:"ik10",t:"Pencabutan gigi sulung",min:5,sub:"lindungi benih di bawahnya",cards:[
  {k:"c",m:"keep",t:"Kapan dicabut",b:"<ul><li>Tidak bisa direstorasi atau dirawat pulpanya.</li><li>Infeksi yang mengancam benih gigi permanen.</li><li>Persistensi yang menghambat erupsi gigi pengganti.</li><li>Atas pertimbangan ortodonti.</li></ul><p>Kontraindikasi relatif: gangguan perdarahan, infeksi akut dengan gejala sistemik, kondisi medis tertentu. Konsultasikan dulu.</p>"},
  {k:"ch",m:"how",t:"Kenapa harus hati-hati",s:["Akar molar sulung melebar dan memeluk benih premolar.","Tang yang terlalu dalam atau gerakan terlalu kuat bisa ikut menarik atau melukai benih.","Akar yang sudah teresorpsi sebagian rapuh dan mudah patah.","Ujung akar kecil yang patah dekat benih <b>sering dibiarkan</b> dan dipantau, karena mengambilnya bisa merusak benih."]},
  {k:"g",q:"Ujung akar molar sulung patah kecil, letaknya dekat benih premolar. Pilihan paling aman?",o:["Biarkan, catat, dan pantau radiografis","Bor tulang sampai ujung akar terambil","Cungkil dengan elevator lurus sekuat mungkin","Tunggu 1 minggu lalu cabut ulang"],y:"Fragmen kecil biasanya teresorpsi atau terdorong keluar. Mengejarnya berisiko merusak benih gigi permanen."},
  {k:"c",m:"keep",t:"Tingkat kompetensi (draf SKDGI 2020)",b:"<ul><li>Pencabutan dengan anestesi topikal (gigi sangat goyang): L4.</li><li>Dengan infiltrasi: L4.</li><li>Dengan blok mandibula: L2.</li></ul><p class='muted'>Tingkat masih perlu dicek ke dokumen asli.</p>"},
  {k:"c",m:"keep",t:"Setelah mencabut",b:"<p>Instruksi untuk anak dan orang tua: gigit tampon, jangan kumur keras di hari pertama, makanan lunak, awasi bibir yang baal. Lalu <b>pertimbangkan space maintainer</b>, terutama setelah kehilangan molar sulung.</p>"}]},
 {id:"ik11",t:"Memilih restorasi gigi sulung",min:5,inti:true,sub:"bahan menurut risiko dan luas lesi",cards:[
  {k:"c",m:"why",t:"Kenapa tidak cukup ditambal biasa",b:"<p>Restorasi gigi sulung harus bertahan sampai gigi tanggal, padahal giginya kecil, enamel tipis, dan anak belum tentu kooperatif. Pilihannya ditentukan oleh <b>risiko karies</b>, <b>luas lesi (jumlah permukaan)</b>, <b>kooperasi</b>, dan <b>sisa umur gigi</b>.</p>"},
  {k:"c",m:"keep",t:"Peta pilihan",b:"<ul><li><b>Lesi kecil satu permukaan</b>: GIC, RMGIC, kompomer, atau komposit (komposit butuh isolasi baik).</li><li><b>Lesi multipermukaan molar</b>, terutama risiko tinggi: <b>mahkota stainless steel (SSC)</b>.</li><li><b>Setelah terapi pulpa</b>: SSC.</li><li><b>Anterior</b> rusak luas: strip crown komposit atau mahkota estetik.</li><li><b>Anak tidak kooperatif, lesi banyak</b>: ART dengan GIC, SDF, atau teknik Hall sebagai jembatan.</li></ul>"},
  {k:"g",q:"Molar sulung karies tiga permukaan, anak risiko karies tinggi. Restorasi paling awet?",o:["Mahkota stainless steel","Komposit tiga permukaan","GIC konvensional","Amalgam"],y:"Mahkota menutup semua permukaan sekaligus. Cochrane 2015: mahkota menurunkan risiko kegagalan besar dan nyeri jangka panjang dibanding tambalan."},
  {k:"c",m:"keep",t:"Seberapa kuat buktinya",b:"<p>Cochrane 2015 (bukti mutu sedang): mahkota pada molar sulung yang karies atau pascaperawatan pulpa <b>menurunkan risiko kegagalan besar (RR 0,18) dan nyeri (RR 0,15)</b> dalam jangka panjang dibanding tambalan. Mahkota dengan teknik Hall juga lebih sedikit menimbulkan rasa tidak nyaman saat dipasang.</p>"},
  {k:"g",q:"Lesi kecil satu permukaan oklusal pada anak kooperatif, isolasi bisa baik. Pilihan yang masuk akal?",o:["Restorasi adhesif (komposit atau RMGIC/kompomer)","Mahkota stainless steel","Langsung pulpotomi","Cabut"],y:"Lesi kecil cukup restorasi adhesif yang konservatif. Mahkota disiapkan untuk lesi luas atau pascaterapi pulpa."}]},
 {id:"ik12",t:"Mahkota stainless steel dan teknik Hall",min:6,sub:"mengunci karies, bukan selalu mengebor",cards:[
  {k:"ch",m:"how",t:"SSC konvensional",s:["Anestesi dan isolasi, buang karies.","Kurangi oklusal ±1–1,5 mm dan buat slice proksimal sampai kontak terbuka.","Bukal dan lingual hampir tidak dipreparasi: tonjolan servikal justru jadi pengunci.","Pilih ukuran, bentuk dan crimp tepi supaya rapat di servikal.","Semen dengan GIC, buang sisa semen, cek oklusi."]},
  {k:"c",m:"how",t:"Teknik Hall",b:"<p>Mahkota stainless steel dipasang <b>tanpa anestesi, tanpa membuang karies, dan tanpa preparasi</b>. Bila kontak terlalu rapat, pasang separator ortodonti beberapa hari sebelumnya. Mahkota diisi semen GIC, ditekan dengan jari, lalu anak menggigit sampai duduk.</p><p>Oklusi terasa sedikit tinggi di awal dan biasanya menyesuaikan sendiri dalam beberapa minggu.</p>"},
  {k:"g",q:"Kenapa teknik Hall bisa berhasil tanpa membuang karies?",o:["Karies tertutup rapat, bakteri kehilangan pasokan gula sehingga lesi berhenti","Semen GIC membunuh semua bakteri di dentin","Mahkota baja menyerap asam","Karies gigi sulung tidak pernah berkembang ke pulpa"],y:"Prinsipnya sama dengan sealant: lesi yang ditutup rapat kehilangan pasokan nutrisi, sehingga aktivitas bakteri berhenti."},
  {k:"c",m:"break",t:"Kapan Hall tidak boleh",b:"<ul><li>Ada tanda pulpitis ireversibel atau nekrosis: nyeri spontan, abses, fistula, radiolusensi furkasi/periapikal.</li><li>Tidak ada lapisan dentin sehat yang jelas antara lesi dan pulpa di radiograf.</li><li>Gigi rusak sampai mahkota tidak punya pegangan.</li><li>Anak tidak bisa diajak bekerja sama sama sekali.</li></ul>"},
  {k:"g",q:"Kontraindikasi teknik Hall?",o:["Ada fistula di dekat gigi tersebut","Lesi karies sampai dentin tanpa gejala","Anak takut suara bur","Kontak proksimal rapat"],y:"Fistula menandakan pulpa nonvital dengan infeksi. Menutupnya dengan mahkota tidak menyelesaikan infeksi."},
  {k:"c",m:"keep",t:"Bukti",b:"<p>Belum ada RCT yang membandingkan langsung Hall dengan SSC konvensional (Cochrane 2015). Tinjauan 2020 untuk karies dentin gigi sulung: pendekatan tanpa atau dengan pembuangan karies selektif tampak lebih menguntungkan daripada pembuangan karies total pada gigi vital tanpa gejala, dan mahkota didukung untuk lesi multipermukaan.</p>"}]},
 {id:"ik13",t:"Kenapa ruang bisa hilang",min:5,inti:true,sub:"space maintainer: indikasi dan pilihan alat",cards:[
  {k:"ch",m:"how",t:"Mekanisme hilangnya ruang",s:["Gigi sulung hilang terlalu cepat → kontak di sisi itu terputus.","Gigi di belakangnya (terutama molar permanen) bergeser ke mesial; kaninus sulung bisa bergeser ke distal.","Ruang untuk gigi pengganti menyempit.","Akibatnya gigi pengganti impaksi, erupsi di luar lengkung, atau berjejal."]},
  {k:"c",m:"keep",t:"Seberapa cepat",b:"<p>Tinjauan sistematis: kehilangan ruang <b>paling besar di bulan-bulan pertama</b> setelah pencabutan, dan lebih besar di rahang bawah serta setelah kehilangan molar kedua sulung. Setelah kehilangan molar pertama sulung, ruang yang hilang sekitar 1–1,5 mm dalam 6–24 bulan.</p>"},
  {k:"g",q:"Kehilangan gigi sulung mana yang paling banyak menghilangkan ruang?",o:["Molar kedua sulung","Insisif sentral sulung","Kaninus sulung atas","Insisif lateral sulung bawah"],y:"Molar kedua sulung adalah penahan utama molar pertama permanen. Tanpa itu, molar permanen bergerak mesial dan memakan ruang premolar kedua."},
  {k:"c",m:"keep",t:"Pilihan alat",b:"<ul><li><b>Band and loop</b>: satu gigi hilang, satu sisi.</li><li><b>Lingual holding arch</b>: kehilangan posterior dua sisi di rahang bawah (setelah insisif permanen erupsi).</li><li><b>Nance appliance / transpalatal arch</b>: rahang atas, dua sisi.</li><li><b>Distal shoe</b>: molar kedua sulung hilang <b>sebelum</b> molar pertama permanen erupsi, sebagai pemandu erupsinya.</li><li><b>Lepasan</b>: banyak gigi hilang atau perlu estetik/fungsi bicara di anterior.</li></ul>"},
  {k:"g",q:"Gigi 85 dicabut pada anak 4 tahun; molar pertama permanen belum erupsi. Alat yang tepat?",o:["Distal shoe","Band and loop pada 84","Lingual holding arch","Tidak perlu alat"],y:"Tanpa molar kedua sulung, molar pertama permanen yang belum erupsi tidak punya pemandu dan akan erupsi terlalu ke mesial. Distal shoe menjadi pemandu itu."}]},
 {id:"ik14",t:"Space maintainer: kapan tidak perlu",min:4,sub:"tidak semua pencabutan butuh alat",cards:[
  {k:"c",m:"keep",t:"Pertimbangan sebelum memasang",b:"<ul><li><b>Gigi pengganti hampir erupsi</b> (tinggal sedikit tulang di atasnya): alat tidak banyak gunanya.</li><li><b>Ada kelebihan ruang</b> pada analisis ruang.</li><li><b>Gigi anterior sulung</b> setelah kaninus sulung erupsi biasanya tidak kehilangan ruang berarti.</li><li><b>Kebersihan mulut buruk dan risiko karies tinggi</b>: alat cekat bisa menambah risiko, perlu pengawasan ketat.</li><li>Tidak ada gigi pengganti (agenesis): rencanakan bersama ortodontis.</li></ul>"},
  {k:"g",q:"Gigi 74 harus dicabut, benih 34 sudah hampir menembus tulang alveolar. Langkah yang masuk akal?",o:["Tidak perlu space maintainer, pantau erupsi","Wajib band and loop","Wajib lingual arch","Distal shoe"],y:"Kalau gigi pengganti akan erupsi dalam waktu dekat, ruang tidak sempat hilang berarti dan alat tidak memberi manfaat."},
  {k:"c",m:"keep",t:"Merawat alatnya",b:"<p>Kontrol tiap ±6 bulan: semen lepas, band longgar, karies di bawah band, alat menghambat erupsi. Lepas alat setelah gigi pengganti erupsi.</p>"}]},
 {id:"ik15",t:"Trauma gigi sulung: lindungi benihnya",min:6,inti:true,sub:"prinsip IADT 2020 untuk gigi sulung",cards:[
  {k:"c",m:"why",t:"Kenapa trauma gigi sulung berbeda",b:"<p>Apeks gigi sulung sangat dekat dengan benih gigi permanen. Benturan pada gigi sulung bisa menular ke benihnya: hipoplasia enamel (gigi Turner), perubahan warna, dilaserasi, atau gangguan erupsi. Prinsipnya: <b>keputusan diambil untuk melindungi benih</b>, bukan sekadar menyelamatkan gigi sulung.</p>"},
  {k:"c",m:"keep",t:"Prinsip penatalaksanaan",b:"<ul><li><b>Avulsi gigi sulung: tidak direplantasi.</b> Replantasi berisiko merusak benih.</li><li><b>Intrusi</b>: pada umumnya dibiarkan erupsi ulang secara spontan dan dipantau.</li><li><b>Luksasi lateral</b> tanpa gangguan oklusi: dibiarkan, biasanya kembali sendiri.</li><li><b>Perubahan warna</b> tanpa gejala lain: bukan alasan langsung perawatan saluran akar; pantau tanda infeksi.</li><li>Gigi yang sangat goyang dan berisiko tertelan/teraspirasi: dicabut.</li></ul>"},
  {k:"g",q:"Anak 3 tahun, gigi 51 lepas utuh dari soketnya 20 menit lalu. Tindakan?",o:["Tidak direplantasi; periksa jaringan dan pantau benih","Replantasi segera lalu splint","Simpan dalam susu dan replantasi besok","Replantasi tanpa splint"],y:"Gigi sulung yang avulsi tidak direplantasi karena prosedurnya bisa melukai benih gigi permanen di bawahnya."},
  {k:"c",m:"keep",t:"Instruksi untuk orang tua",b:"<ul><li>Makanan lunak beberapa hari, batasi dot/empeng.</li><li>Sikat lembut, bersihkan daerah trauma dengan kapas berklorheksidin 0,1% dua kali sehari selama sekitar satu minggu.</li><li>Kembali bila ada bengkak, fistula, gigi makin goyang, atau demam.</li><li>Jelaskan bahwa efek pada gigi permanen baru bisa terlihat bertahun-tahun kemudian.</li></ul>"},
  {k:"g",q:"Gigi 61 berubah abu-abu 2 bulan setelah terbentur. Tidak ada nyeri, bengkak, fistula, atau kelainan radiografis. Tindakan?",o:["Pantau berkala; perubahan warna saja bukan indikasi PSA","Langsung pulpektomi","Cabut","Bleaching"],y:"Perubahan warna tanpa tanda infeksi bisa membaik atau tetap tanpa masalah. Perawatan dilakukan bila muncul tanda infeksi."}]},
 {id:"ik16",t:"Avulsi gigi permanen anak: menit pertama menentukan",min:6,inti:true,sub:"replantasi, media simpan, splint",cards:[
  {k:"ch",m:"how",t:"Kenapa waktu sangat penting",s:["Keberhasilan replantasi bergantung pada sel ligamen periodontal yang menempel di akar.","Sel itu mati bila akar kering.","Makin cepat gigi kembali ke soket (atau masuk media yang tepat), makin banyak sel yang hidup.","Waktu kering di luar mulut lebih dari ±60 menit membuat prognosis jauh lebih buruk (risiko resorpsi pengganti/ankilosis)."]},
  {k:"c",m:"keep",t:"Instruksi lewat telepon",b:"<ul><li>Pegang di <b>mahkota</b>, jangan sentuh akar.</li><li>Kalau kotor, bilas sebentar dengan air dingin, jangan disikat.</li><li><b>Masukkan kembali ke soketnya</b> lalu gigit kain/kasa, dan segera ke dokter gigi.</li><li>Kalau tidak bisa, simpan di <b>susu</b>, larutan saline, atau HBSS. Jangan disimpan kering atau di air keran.</li></ul>"},
  {k:"g",q:"Orang tua menelepon: gigi 11 anak 10 tahun lepas, jatuh di lapangan. Instruksi pertama?",o:["Pegang mahkota, bilas sebentar bila kotor, masukkan kembali ke soket atau simpan dalam susu, segera datang","Bungkus tisu kering lalu bawa ke klinik","Gosok akarnya dengan sikat gigi sampai bersih","Rendam dalam air keran semalam"],y:"Prioritasnya menjaga sel ligamen periodontal tetap hidup: jangan kering, jangan digosok, secepatnya kembali ke soket atau ke media yang cocok."},
  {k:"c",m:"keep",t:"Di klinik (pedoman IADT 2020)",b:"<ul><li>Replantasi (bila belum), cek posisi dengan radiograf.</li><li><b>Splint fleksibel sekitar 2 minggu</b>.</li><li>Antibiotik sistemik dan cek status tetanus.</li><li><b>Apeks tertutup</b>: mulai perawatan saluran akar dalam 7–10 hari.</li><li><b>Apeks terbuka</b>: harapan revaskularisasi pulpa; pantau ketat, tangani bila ada tanda nekrosis.</li></ul>"},
  {k:"g",q:"Splint untuk gigi permanen avulsi yang direplantasi dipasang berapa lama?",o:["Sekitar 2 minggu, splint fleksibel","6 minggu, splint kaku","Tidak perlu splint","1 hari saja"],y:"Splint fleksibel jangka pendek memberi stabilitas tanpa memicu ankilosis; kekakuan dan durasi panjang meningkatkan risiko ankilosis."}]}

  body:()=>`
  <section class="ms"><span class="move keep">pegang ini</span><h3>Skala Frankl</h3>${tbl(["Skor","Arti","Contoh"],[["1 (− −)","Sangat negatif","Menolak, menangis keras, melawan"],["2 (−)","Negatif","Enggan, menarik diri"],["3 (+)","Positif","Menerima, kadang hati-hati"],["4 (+ +)","Sangat positif","Akrab, tertarik"]])}</section>
  <section class="ms"><span class="move how">cara kerja</span><h3>Teknik dasar</h3>${tbl(["Teknik","Cara","Kenapa bekerja"],[["Tell-show-do","Jelaskan, tunjukkan, kerjakan persis","Mengurangi ketidakpastian"],["Penguatan positif","Puji perilaku spesifik","Perilaku yang dipuji cenderung diulang"],["Distraksi","Cerita, hitung, video","Perhatian terbatas, rasa takut ikut turun"],["Voice control","Ubah volume/nada dengan sengaja","Merebut perhatian; jelaskan ke orang tua dulu"],["Nonverbal","Kontak mata, ekspresi, sentuhan","Menguatkan pesan verbal"],["Kehadiran orang tua","Disesuaikan respons anak","Bisa menenangkan atau mengganggu"]])}
  ${fact("ok","Sesuai pedoman behavior guidance AAPD.",["aapdRM"])}
  ${tamago("Janji \"nggak sakit sama sekali\" itu utang. Kalau ternyata sakit, kepercayaan langsung bangkrut.")}</section>
  <section class="ms"><span class="move break">di mana patah</span><h3>Teknik lanjut</h3><ul><li><b>Stabilisasi protektif</b>, <b>sedasi</b> (misalnya N₂O), <b>anestesi umum</b>: hanya dengan indikasi jelas, informed consent tertulis, dokumentasi. Sedasi dan anestesi umum biasanya dirujuk.</li><li><b>HOME (hand-over-mouth)</b> sudah dihapus dari pedoman AAPD.</li></ul></section>
  <section class="ms"><span class="move keep">pegang ini</span><h3>Anak berkebutuhan khusus (tingkat 2)</h3><ul><li>Autisme: rutinitas sama, kurangi rangsang sensorik, kunjungan pengenalan.</li><li>Sindrom Down: periodontal lebih berat, cek kelainan jantung bawaan.</li><li>Cerebral palsy: topang kepala, waspada tersedak.</li><li>Selalu: riwayat medis, konsultasi, kunjungan pendek, pencegahan agresif.</li></ul></section>
  ${exam("\"Anak 4 tahun, Frankl 2. Rencana: kunjungan pengenalan dengan tell-show-do dan penguatan positif, tindakan sederhana dulu (fluor), restorasi setelah kooperasi membaik.\"")}`},
 {id:"ik-pencegahan",t:"Karies anak: risiko, fluor, SDF",cat:"kucing-gelas",min:7,
  tldr:["<b>ECC</b>: karies gigi sulung pada anak di bawah 6 tahun. Polanya khas: insisif atas dulu, insisif bawah terlindung.","<b>CRA</b> menentukan intervensi dan interval kontrol.","Pasta berfluor: <b>butir beras</b> di bawah 3 tahun, <b>kacang polong</b> 3–6 tahun. Varnish NaF 5% tiap 3–6 bulan untuk risiko tinggi.","<b>SDF 38%</b> menghentikan karies kavitas, tapi lesinya <b>menghitam permanen</b>; buktinya masih mutu rendah."],
  say:"E C C adalah karies gigi sulung pada anak di bawah enam tahun. Pasta gigi berfluor sebesar butir beras di bawah tiga tahun, sebesar kacang polong untuk tiga sampai enam tahun. Varnish fluor tiap tiga sampai enam bulan untuk risiko tinggi. S D F menghentikan karies tapi menghitamkan lesi.",
  body:()=>`
  <section class="ms"><span class="move keep">pegang ini</span><h3>Definisi ECC dan S-ECC</h3><p><b>ECC</b>: ≥1 permukaan gigi sulung karies (kavitas atau belum), hilang karena karies, atau ditambal, pada anak &lt;71 bulan.</p><p><b>S-ECC</b>: &lt;3 tahun dengan karies permukaan halus apa pun; 3–5 tahun dengan karies permukaan halus insisif atas atau dmfs ≥4/5/6 (usia 3/4/5).</p>${fact("ok","Definisi AAPD.",["aapdRM"])}</section>
  <section class="ms"><span class="move how">cara kerja</span><h3>Fluor bekerja di permukaan</h3>${steps(["Fluor di ludah dan plak ikut dalam remineralisasi.","Terbentuk fluorapatit yang lebih tahan asam.","Demineralisasi melambat, metabolisme bakteri terhambat.","Efek topikal lebih penting daripada efek sistemik."])}</section>
  <section class="ms"><span class="move keep">pegang ini</span><h3>Takaran dan bahan</h3>${tbl(["Bahan","Takaran/konsentrasi","Catatan"],[["Pasta gigi &lt;3 th","Butir beras","Disikatkan orang tua 2×/hari"],["Pasta gigi 3–6 th","Kacang polong","Diawasi, ludahkan, jangan kumur berlebihan"],["Varnish NaF 5%","22.600 ppm F","Tiap 3–6 bulan sesuai risiko"],["SDF 38%","±44.800 ppm F","Menghentikan karies kavitas; noda hitam"]])}
  ${fact("ok","Varnish mencegah ±37% permukaan karies gigi sulung dan ±43% gigi permanen (bukti mutu sedang). Profilaksis sebelum varnish tidak memengaruhi hasil.",["marinho13"])}
  ${fact("warn","SDF: rekomendasi AAPD 2017 bersifat kondisional dengan bukti mutu rendah; Cochrane 2024 menilai buktinya belum pasti. Pakai sebagai bagian program pencegahan, bukan satu-satunya.",["sdf17","sdf24"])}
  ${tamago("SDF itu rem darurat: lubangnya berhenti, tapi meninggalkan bekas hitam. Orang tua harus tahu sebelum setuju.")}</section>
  <section class="ms"><span class="move break">di mana patah</span><h3>Kesalahan yang sering</h3><ul><li>Menunggu kavitas sebelum bertindak, padahal white spot sudah lesi aktif.</li><li>Memakai pasta tanpa fluor untuk balita.</li><li>Varnish sekali saja, tanpa jadwal ulang.</li><li>Lupa kontrol diet: fluor tidak menang melawan gula yang terus-menerus.</li></ul></section>`},
 {id:"ik-pulpa",t:"Terapi pulpa gigi sulung",cat:"kucing-ngecek",min:7,
  tldr:["Diagnosis dari <b>riwayat nyeri, tanda klinis, radiograf, dan perdarahan</b>; tes vitalitas kurang andal pada anak.","Lesi dalam tanpa gejala → <b>IPT</b>. Pulpa terbuka, perdarahan berhenti → <b>pulpotomi</b>. Ireversibel/nekrosis, akar cukup → <b>pulpektomi</b>. Selain itu → <b>cabut</b>.","Pulpotomi: <b>MTA</b> dan formokresol paling berhasil; kalsium hidroksida lebih rendah.","Pulpektomi: bahan harus <b>teresorpsi</b> (ZOE, Endoflas). Restorasi akhir <b>SSC</b>."],
  say:"Diagnosis pulpa sulung dari riwayat nyeri, tanda klinis, radiograf, dan perdarahan. Lesi dalam tanpa gejala dirawat I P T. Pulpa terbuka dengan perdarahan yang berhenti dirawat pulpotomi. Pulpitis ireversibel atau nekrosis dengan akar cukup dirawat pulpektomi. Restorasi akhirnya mahkota stainless steel.",
  body:()=>`
  <section class="ms"><span class="move how">cara kerja</span><h3>Pohon keputusan</h3>${tbl(["Kondisi","Perawatan"],[["Lesi dalam, tanpa gejala pulpa","Indirect pulp treatment (IPT)"],["Pulpa terbuka karena karies, vital, perdarahan berhenti","Pulpotomi"],["Pulpitis ireversibel/nekrosis, akar cukup, bisa direstorasi","Pulpektomi"],["Resorpsi luas, tidak bisa direstorasi, infeksi mengenai benih","Cabut + pertimbangkan space maintainer"]])}</section>
  <section class="ms"><span class="move keep">pegang ini</span><h3>Bukti untuk terapi pulpa vital</h3>${tbl(["Perawatan/bahan","Keberhasilan (meta-analisis)"],[["IPT (24 bln)","±94%"],["Direct pulp capping (24 bln)","±89% (bukti mutu rendah)"],["Semua pulpotomi","±83%"],["Pulpotomi MTA","±90%"],["Pulpotomi formokresol","±85%"]])}
  ${fact("ok","MTA dan formokresol tertinggi dan tidak berbeda bermakna (bukti mutu tinggi); keduanya lebih baik daripada kalsium hidroksida.",["coll17"])}
  ${fact("info","Formokresol makin ditinggalkan karena kekhawatiran toksisitas, sehingga MTA atau bahan kalsium silikat lain sering dipilih.")}</section>
  <section class="ms"><span class="move keep">pegang ini</span><h3>Pulpektomi</h3><p>Instrumentasi pendek dari apeks radiografis, tidak agresif. Bahan pengisi harus teresorpsi.</p>${fact("ok","Meta-analisis 2020: ZOE dan Endoflas ±90% berhasil di 18 bulan; pasta iodoform saja ≤71%.",["coll20"])}</section>
  <section class="ms"><span class="move break">di mana patah</span><h3>Penyebab gagal</h3><ul><li>Salah diagnosis: pulpitis ireversibel dirawat pulpotomi.</li><li>Atap pulpa tidak dibuka penuh.</li><li>Perdarahan tidak terkontrol tapi tetap ditutup.</li><li>Restorasi bocor; tidak ditutup SSC.</li></ul>${tamago("Perdarahan itu juri. Kalau nggak mau berhenti, pulpotomi kalah sebelum mulai.")}</section>
  ${exam("\"Gigi 74 pulpa terbuka karena karies, pulpitis reversibel, perdarahan terkontrol. Rencana: pulpotomi MTA, basis, mahkota stainless steel, kontrol klinis dan radiografis.\"")}`},
 {id:"ik-anestesi",t:"Anestesi lokal dan pencabutan anak",cat:"kucing-cair",min:6,
  tldr:["Dosis maksimal dihitung <b>per kg</b>: lidokain 4,4 mg/kg (maks 300 mg), artikain 7 mg/kg (maks 500 mg).","Satu karpul 1,8 mL lidokain 2% = <b>36 mg</b>.","Foramen mandibula anak <b>lebih rendah</b>; infiltrasi sering cukup untuk molar sulung.","Akar molar sulung memeluk benih: cabut hati-hati, fragmen kecil sering dibiarkan. Setelahnya, pertimbangkan <b>space maintainer</b>."],
  say:"Dosis anestesi lokal anak dihitung per kilogram. Lidokain empat koma empat miligram per kilogram, maksimal tiga ratus miligram. Satu karpul lidokain dua persen berisi tiga puluh enam miligram. Foramen mandibula anak lebih rendah. Setelah mencabut molar sulung, pertimbangkan space maintainer.",
  body:()=>`
  <section class="ms"><span class="move keep">pegang ini</span><h3>Dosis maksimal</h3>${tbl(["Obat","mg/kg","Maksimal"],[["Lidokain","4,4","300 mg"],["Mepivakain","4,4","300 mg"],["Artikain","7","500 mg"],["Prilokain","8","600 mg"]])}${fact("ok","Pedoman AAPD untuk anestesi lokal pada pasien anak.",["aapdRM"])}
  <div class="exam"><span class="eb2">contoh hitung</span>Anak 20 kg: 20 × 4,4 = 88 mg lidokain. 88 ÷ 36 ≈ 2,4 karpul. Itu batas atas, bukan target.</div></section>
  <section class="ms"><span class="move how">cara kerja</span><h3>Teknik</h3><ul><li>Topikal dulu, injeksi pelan, tell-show-do (\"air dingin\", \"semut kecil\").</li><li>Blok mandibula diarahkan lebih rendah karena foramen anak sekitar setinggi bidang oklusal.</li><li>Infiltrasi bukal sering cukup untuk molar sulung (tulang tipis dan porous).</li></ul></section>
  <section class="ms"><span class="move break">di mana patah</span><h3>Komplikasi yang sering</h3><ul><li><b>Trauma gigitan bibir/pipi</b> setelah blok: paling sering, sering disangka infeksi. Edukasi orang tua.</li><li>Overdosis: gelisah, kejang, depresi napas. Pencegahannya hitung dosis.</li></ul></section>
  <section class="ms"><span class="move keep">pegang ini</span><h3>Pencabutan gigi sulung</h3><ul><li>Indikasi: tidak bisa direstorasi, infeksi yang mengancam benih, persistensi, alasan ortodonti.</li><li>Akar melebar memeluk benih: tang jangan terlalu dalam, gerakan terkontrol.</li><li>Fragmen akar kecil dekat benih: sering dibiarkan dan dipantau.</li><li>Setelahnya: pertimbangkan space maintainer.</li></ul>${tamago("Benih premolar itu penghuni rumah di bawah. Jangan sampai ikut kecabut cuma gara-gara terburu-buru.")}</section>`},
 {id:"ik-restorasi",t:"Restorasi gigi sulung, SSC, dan teknik Hall",cat:"kucing-kardus",min:7,
  tldr:["Pilih restorasi menurut <b>risiko karies, luas lesi, kooperasi, sisa umur gigi</b>.","Lesi multipermukaan atau pascaterapi pulpa: <b>SSC</b>. Cochrane 2015: kegagalan besar dan nyeri jangka panjang lebih rendah dibanding tambalan.","<b>Teknik Hall</b>: SSC tanpa anestesi, tanpa buang karies, tanpa preparasi; menutup lesi supaya berhenti.","Hall tidak untuk gigi dengan tanda pulpa ireversibel/nonvital."],
  say:"Restorasi gigi sulung dipilih menurut risiko karies, luas lesi, kooperasi, dan sisa umur gigi. Lesi banyak permukaan dan gigi setelah terapi pulpa ditutup mahkota stainless steel. Teknik Hall memasang mahkota tanpa anestesi, tanpa buang karies, tanpa preparasi.",
  body:()=>`
  <section class="ms"><span class="move keep">pegang ini</span><h3>Peta pilihan</h3>${tbl(["Situasi","Pilihan"],[["Lesi kecil 1 permukaan, isolasi baik","Komposit/kompomer/RMGIC"],["Lesi kecil, isolasi sulit atau risiko tinggi","GIC/RMGIC"],["Lesi multipermukaan molar","SSC"],["Pascapulpotomi/pulpektomi","SSC"],["Anterior rusak luas","Strip crown komposit/mahkota estetik"],["Anak belum kooperatif, banyak lesi","SDF, ART, teknik Hall sebagai jembatan"]])}
  ${fact("ok","Cochrane 2015: mahkota menurunkan risiko kegagalan besar (RR 0,18) dan nyeri (RR 0,15) jangka panjang dibanding tambalan; Hall mengurangi rasa tidak nyaman saat pemasangan (bukti mutu sedang).",["innes15"])}</section>
  <section class="ms"><span class="move how">cara kerja</span><h3>Kenapa Hall bisa tanpa membuang karies</h3>${steps(["Mahkota disemen rapat menutupi seluruh gigi.","Bakteri di lesi kehilangan pasokan gula dari luar.","Aktivitas lesi berhenti, mirip prinsip sealant.","Syaratnya pulpa masih vital tanpa gejala ireversibel."])}
  ${fact("info","Belum ada RCT yang membandingkan langsung Hall dengan SSC konvensional. Tinjauan 2020: pendekatan dengan pembuangan karies selektif atau tanpa pembuangan tampak lebih menguntungkan daripada pembuangan total pada gigi vital tanpa gejala.",["innes15","caries20"])}</section>
  <section class="ms"><span class="move break">di mana patah</span><h3>Kontraindikasi Hall</h3><ul><li>Nyeri spontan, abses, fistula, radiolusensi furkasi/periapikal.</li><li>Tidak ada dentin sehat yang jelas antara lesi dan pulpa.</li><li>Gigi terlalu rusak untuk menahan mahkota.</li></ul>${tamago("Hall itu menutup panci, bukan memadamkan kompor. Kalau di dalamnya sudah ada abses, tutupnya nggak menolong.")}</section>`},
 {id:"ik-space",t:"Space maintainer",cat:"kucing-karton",min:5,
  tldr:["Gigi sulung hilang terlalu cepat → gigi di belakang bergeser ke mesial → ruang pengganti menyempit.","Kehilangan ruang <b>terbesar di bulan-bulan pertama</b>, lebih besar di rahang bawah dan setelah kehilangan <b>molar kedua sulung</b>.","Alat: <b>band and loop</b> (1 gigi), <b>lingual arch/Nance</b> (2 sisi), <b>distal shoe</b> (E hilang sebelum M1 erupsi), lepasan.","Tidak perlu bila gigi pengganti hampir erupsi atau ada kelebihan ruang."],
  say:"Kalau gigi sulung hilang terlalu cepat, gigi di belakangnya bergeser ke depan dan ruang untuk gigi pengganti menyempit. Kehilangan ruang paling besar di bulan-bulan pertama. Band and loop untuk satu gigi, lingual arch untuk dua sisi, distal shoe bila molar kedua sulung hilang sebelum molar pertama permanen erupsi.",
  body:()=>`
  <section class="ms"><span class="move how">cara kerja</span><h3>Mekanisme</h3>${steps(["Kontak terputus setelah gigi sulung hilang.","Molar permanen bergerak ke mesial; kaninus sulung bisa ke distal.","Ruang pengganti menyempit.","Gigi pengganti impaksi, erupsi di luar lengkung, atau berjejal."])}
  ${fact("ok","Kehilangan ruang terbesar dalam bulan-bulan awal setelah pencabutan, lebih besar di rahang bawah dan setelah kehilangan molar kedua sulung.",["space22"])}
  ${fact("ok","Setelah kehilangan molar pertama sulung: ±0,65 mm (atas) sampai ±1,2–1,5 mm (bawah) dalam 6–24 bulan; lebar dan panjang lengkung tidak berubah bermakna.",["space23"])}</section>
  <section class="ms"><span class="move keep">pegang ini</span><h3>Memilih alat</h3>${tbl(["Situasi","Alat"],[["1 gigi posterior, 1 sisi","Band and loop"],["Posterior 2 sisi rahang bawah","Lingual holding arch"],["Posterior 2 sisi rahang atas","Nance / transpalatal arch"],["Molar kedua sulung hilang sebelum M1 erupsi","Distal shoe"],["Banyak gigi hilang / anterior estetik","Lepasan"]])}</section>
  <section class="ms"><span class="move break">di mana patah</span><h3>Kapan tidak perlu</h3><ul><li>Gigi pengganti hampir erupsi.</li><li>Ada kelebihan ruang.</li><li>Gigi anterior sulung setelah kaninus sulung erupsi.</li><li>Kebersihan buruk tanpa pengawasan: alat cekat menambah risiko karies.</li></ul>${tamago("Space maintainer itu penjaga parkir. Kalau mobilnya (gigi pengganti) sudah di depan gerbang, penjaganya nggak perlu dipasang.")}</section>`},
 {id:"ik-trauma",t:"Trauma gigi anak",cat:"telur-ditinggal",min:7,
  tldr:["Gigi sulung: keputusan diambil untuk <b>melindungi benih</b>. <b>Avulsi gigi sulung tidak direplantasi.</b>","Intrusi sulung umumnya dibiarkan erupsi ulang spontan dan dipantau.","Gigi permanen avulsi: <b>replantasi secepatnya</b> atau simpan dalam <b>susu/saline</b>; jangan kering, jangan digosok.","Splint fleksibel <b>±2 minggu</b>; apeks tertutup → PSA 7–10 hari; apeks terbuka → pantau revaskularisasi."],
  say:"Pada trauma gigi sulung, keputusan diambil untuk melindungi benih. Gigi sulung yang avulsi tidak direplantasi. Gigi permanen yang avulsi direplantasi secepatnya, atau disimpan dalam susu. Splint fleksibel sekitar dua minggu.",
  body:()=>`
  <section class="ms"><span class="move why">kenapa ada</span><h3>Dua prinsip berbeda</h3><p><b>Gigi sulung</b>: apeks dekat benih, jadi tindakan agresif bisa melukai gigi permanen. <b>Gigi permanen</b>: gigi harus diselamatkan, dan sel ligamen periodontal adalah kuncinya.</p></section>
  <section class="ms"><span class="move keep">pegang ini</span><h3>Gigi sulung</h3>${tbl(["Cedera","Penanganan"],[["Avulsi","Tidak direplantasi"],["Intrusi","Umumnya dibiarkan erupsi ulang spontan, pantau"],["Luksasi lateral tanpa gangguan oklusi","Dibiarkan, biasanya kembali sendiri"],["Sangat goyang, risiko aspirasi","Cabut"],["Perubahan warna tanpa gejala","Pantau; bukan indikasi langsung PSA"]])}
  ${fact("ok","Pedoman IADT 2020 untuk gigi sulung.",["iadt20p"])}
  ${fact("warn","Untuk intrusi, pedoman lama (2007) menganjurkan cabut bila apeks terdorong ke arah benih; versi 2020 lebih condong membiarkan erupsi ulang spontan. Cek tabel IADT 2020 sebelum dijadikan jawaban ujian.",["iadt20p"])}</section>
  <section class="ms"><span class="move how">cara kerja</span><h3>Gigi permanen avulsi</h3>${steps(["Di lokasi: pegang mahkota, bilas sebentar bila kotor, replantasi atau simpan dalam susu/saline/HBSS.","Di klinik: replantasi (bila belum), cek radiograf.","Splint fleksibel ±2 minggu.","Antibiotik sistemik, cek tetanus, klorheksidin.","Apeks tertutup: PSA mulai 7–10 hari. Apeks terbuka: pantau revaskularisasi.","Kontrol berkala untuk resorpsi dan ankilosis."])}
  ${fact("ok","Sesuai pedoman IADT 2020 untuk avulsi gigi permanen.",["iadt20a"])}
  ${tamago("Akar gigi avulsi itu ikan yang baru ditangkap: jangan dijemur, jangan digosok, cepat masukkan ke air yang cocok.")}</section>
  <section class="ms"><span class="move keep">pegang ini</span><h3>Instruksi orang tua (trauma sulung)</h3><ul><li>Diet lunak, batasi dot/empeng.</li><li>Sikat lembut, kapas berklorheksidin 0,1% 2× sehari ±1 minggu.</li><li>Kembali bila bengkak, fistula, makin goyang, demam.</li><li>Efek ke gigi permanen bisa baru terlihat bertahun-tahun kemudian.</li></ul></section>`}
);

const BM_MODS=[
 {id:"bm1",t:"Anestesi lokal: obat dan dosis",min:6,inti:true,sub:"amida, vasokonstriktor, batas aman",cards:[
  {k:"c",m:"why",t:"Kenapa perlu paham obatnya",b:"<p>Hampir semua tindakan bedah mulut dimulai dengan anestesi lokal. Kegagalan anestesi bikin pasien kesakitan, overdosis bisa mengancam nyawa, dan vasokonstriktor bisa bermasalah pada pasien jantung. Jadi yang dihafal bukan cuma tekniknya, tapi juga <b>mekanisme dan batasnya</b>.</p>"},
  {k:"ch",m:"how",t:"Cara anestesi lokal bekerja",s:["Obat menembus membran saraf dalam bentuk basa (tidak bermuatan).","Di dalam sel, obat memblok kanal natrium, sehingga impuls nyeri tidak menjalar.","Jaringan yang meradang bersifat asam, sehingga lebih banyak obat bermuatan dan sulit menembus membran.","Itu sebabnya anestesi sering kurang efektif di daerah infeksi, dan teknik blok jauh dari daerah radang lebih andal."]},
  {k:"g",q:"Kenapa anestesi lokal sering gagal pada gigi dengan abses?",o:["Jaringan meradang bersifat asam, obat lebih banyak dalam bentuk bermuatan yang sulit menembus saraf","Abses menyerap vasokonstriktor","Saraf di daerah abses sudah mati","Jarum tidak bisa menembus jaringan bengkak"],y:"pH rendah di jaringan radang menggeser obat ke bentuk bermuatan yang sulit masuk ke saraf. Solusinya teknik blok di daerah yang tidak meradang."},
  {k:"c",m:"keep",t:"Vasokonstriktor dan dosis",b:"<p><b>Epinefrin</b> memperlambat penyerapan obat: anestesi lebih lama, perdarahan berkurang, toksisitas sistemik turun.</p><ul><li>Satu karpul 1,8 mL lidokain 2% = <b>36 mg</b> lidokain; dengan epinefrin 1:100.000 = <b>0,018 mg</b> epinefrin.</li><li>Pasien dengan penyakit jantung: batasi epinefrin sekitar <b>0,04 mg</b> (±2 karpul 1:100.000) per kunjungan.</li><li>Dosis maksimal lidokain dihitung per kg berat badan (lihat badge di materi: sumber berbeda memberi angka berbeda).</li></ul>"},
  {k:"g",q:"Pasien dengan riwayat penyakit jantung. Batas epinefrin yang umum dipakai per kunjungan?",o:["± 0,04 mg (sekitar 2 karpul 1:100.000)","± 0,2 mg","Tidak ada batas","Epinefrin dilarang sama sekali"],y:"0,04 mg adalah \"dosis jantung\" yang sering dipakai. Satu karpul 1:100.000 berisi 0,018 mg."}]},
 {id:"bm2",t:"Teknik anestesi dan komplikasinya",min:6,sub:"blok alveolaris inferior, infiltrasi",cards:[
  {k:"ch",m:"how",t:"Blok alveolaris inferior (IANB)",s:["Patokan: coronoid notch, raphe pterigomandibular, bidang oklusal.","Jarum masuk dari premolar sisi berlawanan, sejajar bidang oklusal, di lateral raphe.","Masuk ±20–25 mm sampai menyentuh tulang, tarik sedikit, <b>aspirasi</b>.","Suntikkan pelan. Hasil: baal setengah rahang bawah, bibir bawah, dan lidah (bila saraf lingual ikut)."]},
  {k:"g",q:"Setelah IANB, sudut mulut dan kelopak mata pasien di sisi yang sama tidak bisa digerakkan. Penyebabnya?",o:["Jarum terlalu ke posterior, obat masuk kelenjar parotis dan mengenai saraf fasialis","Jarum terlalu ke anterior","Obat masuk pembuluh darah","Alergi obat"],y:"Bila jarum tidak menyentuh tulang dan terlalu ke belakang, obat bisa masuk parotis. Paralisis fasial ini sementara, tapi mata harus dilindungi sampai efeknya hilang."},
  {k:"c",m:"keep",t:"Kenapa selalu aspirasi",b:"<p>Aspirasi positif berarti ujung jarum ada di pembuluh darah. Suntikan intravaskular bisa memicu reaksi toksik atau efek epinefrin mendadak (berdebar). Aspirasi positif → reposisi jarum, aspirasi ulang, baru suntik pelan.</p>"},
  {k:"c",m:"break",t:"Komplikasi yang sering ditanya",b:"<ul><li><b>Hematoma</b>: jarum melukai pembuluh (sering pada blok alveolaris superior posterior). Tekan, kompres dingin.</li><li><b>Trismus</b>: trauma otot pterigoid medial. Kompres hangat, latihan buka mulut, analgesik.</li><li><b>Paralisis fasial sementara</b>: obat masuk parotis. Lindungi mata.</li><li><b>Parestesia</b>: jarang, biasanya sembuh sendiri.</li><li><b>Trauma gigitan</b> bibir/lidah yang masih baal, terutama pada anak.</li><li><b>Sinkop</b>: komplikasi sistemik paling sering, lebih karena cemas daripada obat.</li></ul>"},
  {k:"g",q:"Komplikasi sistemik paling sering saat pasien disuntik anestesi lokal?",o:["Sinkop vasovagal","Anafilaksis","Henti jantung","Kejang akibat overdosis"],y:"Rasa cemas dan nyeri suntikan memicu respons vasovagal. Posisi baring dan persiapan mental mencegahnya."}]},
 {id:"bm3",t:"Pencabutan gigi permanen",min:6,inti:true,sub:"indikasi, prinsip gaya, alat",cards:[
  {k:"c",m:"keep",t:"Indikasi dan kontraindikasi",b:"<p><b>Indikasi</b>: karies yang tidak bisa direstorasi, penyakit periodontal lanjut, gigi penyebab infeksi yang tidak bisa dirawat, impaksi bermasalah, alasan ortodonti atau prostetik, gigi di garis fraktur yang mengganggu, sebelum radioterapi bila prognosis buruk.</p><p><b>Kontraindikasi relatif</b> (bukan larangan mutlak; butuh persiapan atau konsultasi): gangguan perdarahan tidak terkontrol, penyakit jantung tidak stabil, diabetes tidak terkontrol, riwayat radioterapi rahang, terapi antiresorptif dosis onkologi, kehamilan trimester pertama untuk tindakan elektif.</p>"},
  {k:"ch",m:"how",t:"Prinsip mekanik pencabutan",s:["Ligamen periodontal diputus dan tulang alveolar dilebarkan sedikit demi sedikit.","Tang dipasang sejauh mungkin ke apikal, sejajar sumbu gigi.","Gaya utama tekanan ke apikal, lalu goyangan bukal-lingual yang terkontrol; rotasi hanya untuk akar tunggal yang membulat (misalnya insisif sentral atas, premolar bawah).","Elevator dipakai sebagai pengungkit atau baji, dengan tumpuan tulang, <b>bukan gigi sebelah</b>.","Tenaga berlebihan tanpa melebarkan soket → akar patah."]},
  {k:"g",q:"Gerakan rotasi paling cocok untuk mencabut gigi…",o:["Insisif sentral atas (akar tunggal membulat)","Molar pertama atas (tiga akar)","Premolar pertama atas (sering dua akar)","Molar bawah (dua akar)"],y:"Rotasi hanya aman untuk akar tunggal yang penampangnya membulat. Gigi berakar banyak atau pipih akan patah bila diputar."},
  {k:"c",m:"keep",t:"Posisi dan alat",b:"<ul><li>Rahang atas: kursi lebih rendah, pasien sedikit menengadah, mulut pasien setinggi bahu operator.</li><li>Rahang bawah: kursi lebih rendah lagi, bidang oklusal hampir sejajar lantai.</li><li>Tangan yang tidak memegang tang <b>menyangga rahang dan melindungi jaringan lunak</b>, sekaligus merasakan ekspansi tulang.</li><li>Tang disesuaikan bentuk mahkota dan akar tiap gigi; elevator lurus untuk luksasi awal.</li></ul>"},
  {k:"g",q:"Saat memakai elevator lurus di mesial gigi 36, tumpuannya sebaiknya…",o:["Tulang alveolar interdental, bukan gigi 35","Gigi 35 sebagai tumpuan","Mahkota gigi 36","Gingiva bukal"],y:"Bertumpu pada gigi sebelah bisa melonggarkan atau mematahkan gigi yang sehat."}]},
 {id:"bm4",t:"Komplikasi setelah mencabut",min:6,sub:"perdarahan, dry socket, sinus terbuka",cards:[
  {k:"c",m:"keep",t:"Instruksi pascaekstraksi",b:"<ul><li>Gigit tampon ±30 menit.</li><li>Hari pertama: jangan kumur keras, jangan meludah berulang, jangan menghisap (sedotan), jangan merokok.</li><li>Makanan lunak, tidak terlalu panas.</li><li>Analgesik sesuai anjuran; kompres dingin hari pertama bila bengkak.</li></ul>"},
  {k:"ch",m:"how",t:"Dry socket (alveolitis)",s:["Bekuan darah di soket larut atau lepas terlalu cepat (fibrinolisis).","Tulang soket terbuka tanpa pelindung.","Nyeri hebat berdenyut, biasanya mulai <b>hari ke-2 sampai ke-4</b>, soket kosong, bau mulut.","Penanganan: irigasi soket, dressing obtundan, analgesik. Bukan infeksi, jadi antibiotik bukan terapi utamanya.","Lebih sering setelah pencabutan molar ketiga bawah secara bedah dan pada perokok."]},
  {k:"g",q:"Hari ketiga setelah odontektomi, pasien nyeri berdenyut hebat, soket tampak kosong, bau tidak sedap, tidak demam. Diagnosis?",o:["Dry socket (alveolitis)","Abses submandibula","Fraktur mandibula","Reaksi alergi obat"],y:"Onset hari 2–4, soket kosong, nyeri hebat, tanpa tanda sistemik khas dry socket."},
  {k:"c",m:"keep",t:"Mencegah dry socket: apa kata bukti",b:"<p>Cochrane 2022: kumur klorheksidin (0,12% atau 0,2%) sebelum dan sesudah pencabutan menurunkan risiko dry socket (OR 0,38), dan gel klorheksidin di soket juga menurunkannya (OR 0,44); bukti mutu sedang.</p><p>Angka kejadian: sekitar 1–5% pada pencabutan rutin, bisa sampai ±30% pada molar ketiga yang dicabut secara bedah.</p>"},
  {k:"c",m:"break",t:"Komunikasi oroantral",b:"<p>Akar molar atau premolar atas dekat dasar sinus maksilaris. Tanda: udara atau cairan keluar lewat hidung saat menelan, tes <b>tiup hidung dengan hidung ditutup</b> (gelembung di soket).</p><ul><li>Kecil (±2 mm): bekuan dipertahankan, jahit, instruksi \"jaga sinus\": jangan meniup hidung, bersin dengan mulut terbuka, dekongestan.</li><li>Besar atau menetap: perlu penutupan bedah (flap), rujuk.</li></ul>"},
  {k:"g",q:"Setelah mencabut 26, pasien diminta meniup dengan hidung ditutup dan muncul gelembung di soket. Instruksi yang benar?",o:["Jangan meniup hidung dan bersin dengan mulut terbuka, jaga bekuan; nilai ukuran lubang","Kumur keras supaya soket bersih","Masukkan kapas jauh ke dalam soket","Tidak ada yang perlu dilakukan"],y:"Gelembung menandakan komunikasi oroantral. Tekanan udara dari hidung bisa membuat bekuan lepas dan lubang menetap."}]},
 {id:"bm5",t:"Gigi impaksi: menilai sebelum membedah",min:6,inti:true,sub:"klasifikasi, indikasi, risiko saraf",cards:[
  {k:"c",m:"keep",t:"Klasifikasi molar ketiga bawah",b:"<p><b>Winter (angulasi)</b>: mesioangular (paling sering), vertikal, horizontal, distoangular.</p><p><b>Pell &amp; Gregory</b>:</p><ul><li><b>Kelas I/II/III</b>: ruang antara distal molar kedua dan ramus dibanding lebar mahkota molar ketiga (cukup / sebagian / seluruhnya dalam ramus).</li><li><b>Posisi A/B/C</b>: kedalaman terhadap bidang oklusal molar kedua (sejajar / di antara oklusal dan servikal / di bawah servikal).</li></ul><p>Makin ke kelas III dan posisi C, makin sulit.</p>"},
  {k:"g",q:"Molar ketiga bawah di bawah garis servikal molar kedua, mahkotanya seluruhnya di dalam ramus. Klasifikasi Pell & Gregory?",o:["Kelas III posisi C","Kelas I posisi A","Kelas II posisi B","Kelas I posisi C"],y:"Seluruh mahkota di ramus = kelas III. Di bawah garis servikal molar kedua = posisi C. Ini kasus paling sulit."},
  {k:"c",m:"keep",t:"Kapan dicabut",b:"<p><b>Ada patologi</b>: perikoronitis berulang, karies yang tidak bisa dirawat pada molar ketiga, karies atau resorpsi distal molar kedua akibat molar ketiga, kista, penyakit periodontal di distal molar kedua.</p><p><b>Tanpa gejala dan tanpa patologi</b>: tidak ada bukti kuat untuk mencabut secara rutin \"untuk jaga-jaga\".</p>"},
  {k:"c",m:"keep",t:"Bukti untuk pencabutan profilaksis",b:"<p>Cochrane 2020: bukti tentang mencabut atau mempertahankan molar ketiga impaksi yang tanpa gejala dan tanpa penyakit masih bermutu rendah sampai sangat rendah. Keputusan harus mempertimbangkan risiko tindakan, usia, dan pilihan pasien, dan gigi yang dipertahankan sebaiknya dipantau.</p>"},
  {k:"ch",m:"how",t:"Membaca risiko saraf di radiograf",s:["Kanal mandibula sering berdekatan dengan akar molar ketiga.","Tanda yang paling berkaitan dengan cedera saraf: <b>akar tampak menggelap</b> di tempat kanal melintas, <b>garis putih kanal terputus</b>, dan <b>kanal berbelok</b> mengikuti akar.","Bila tanda ini ada: informed consent soal risiko baal bibir, pertimbangkan CBCT, teknik yang lebih hati-hati, atau rujuk.","Gejala: baal bibir bawah dan dagu di sisi operasi."]},
  {k:"g",q:"Tanda radiografis yang paling berkaitan dengan risiko cedera saraf alveolaris inferior?",o:["Akar menggelap di tempat kanal melintas","Mahkota sejajar bidang oklusal","Ruang folikel normal","Akar lurus jauh dari kanal"],y:"Penggelapan akar, garis putih kanal terputus, dan kanal yang berbelok adalah tanda yang secara bermakna berkaitan dengan cedera saraf."}]},
 {id:"bm6",t:"Odontektomi: langkah dan alasannya",min:6,sub:"flap, tulang, pemotongan gigi, penutupan",cards:[
  {k:"ch",m:"how",t:"Logika urutan odontektomi",s:["Anestesi blok dan infiltrasi bukal.","Flap mukoperiosteal (envelope atau triangular) agar tulang terlihat dan suplai darah flap terjaga.","Buang tulang secukupnya di bukal dan distal dengan bur di bawah irigasi salin (tulang tidak boleh panas).","<b>Potong gigi</b> (memisahkan mahkota dari akar atau membelah akar) supaya bisa keluar tanpa membuang banyak tulang.","Keluarkan bagian per bagian dengan elevator.","Bersihkan folikel dan debris, irigasi, haluskan tepi tulang.","Tutup flap dengan jahitan, instruksi pascaoperasi."]},
  {k:"g",q:"Kenapa gigi impaksi sering dipotong menjadi beberapa bagian?",o:["Supaya bisa dikeluarkan tanpa membuang terlalu banyak tulang","Supaya lebih cepat sembuh karena giginya kecil","Supaya tidak perlu anestesi","Supaya flap tidak perlu dijahit"],y:"Memotong gigi mengurangi jumlah tulang yang harus dibuang dan mengurangi tekanan ke struktur di sekitarnya, termasuk saraf."},
  {k:"c",m:"break",t:"Komplikasi yang harus disampaikan saat informed consent",b:"<ul><li>Nyeri, bengkak, trismus beberapa hari.</li><li>Dry socket.</li><li>Baal bibir bawah (saraf alveolaris inferior) atau lidah (saraf lingual), umumnya sementara, jarang permanen.</li><li>Perdarahan, infeksi.</li><li>Fraktur mandibula (jarang, pada kasus sangat dalam).</li></ul>"},
  {k:"g",q:"Saat membuang tulang dengan bur, kenapa wajib irigasi salin?",o:["Mencegah tulang terlalu panas dan nekrosis","Supaya bur lebih tajam","Supaya darah lebih banyak keluar","Mengganti anestesi"],y:"Panas berlebih membuat tulang mati dan penyembuhan terganggu."}]}
];

 bm1:[["Vasokonstriktor tidak diserap oleh abses; masalahnya pH jaringan.","Saraf tetap hidup dan justru peka; nyeri itu buktinya.","Jarum bisa menembus jaringan bengkak; masalahnya obat tidak bekerja."],
      ["0,2 mg adalah batas umum untuk pasien sehat, bukan pasien jantung.","Batas tetap diperlukan, terutama pada pasien jantung.","Epinefrin dosis kecil umumnya aman dan membantu anestesi bekerja; yang dibatasi jumlahnya."]],
 bm2:[["Jarum terlalu ke anterior biasanya menyentuh tulang terlalu cepat dan anestesinya gagal, bukan paralisis fasial.","Intravaskular memberi efek sistemik (berdebar, toksik), bukan paralisis otot wajah satu sisi.","Alergi anestesi amida sangat jarang dan gejalanya tidak berupa paralisis satu sisi."],
      ["Anafilaksis terhadap anestesi lokal amida sangat jarang.","Henti jantung jarang dan biasanya didahului kondisi lain.","Kejang akibat overdosis jarang bila dosis dihitung."]],
 bm3:[["Molar atas tiga akar akan patah bila diputar.","Premolar atas sering punya dua akar yang tipis.","Molar bawah punya dua akar; rotasi berisiko mematahkan."],
      ["Gigi tetangga bisa ikut longgar atau patah.","Tumpuan di mahkota gigi yang dicabut tidak memberi pengungkit yang aman.","Gingiva bukan tumpuan; bisa robek."]],
 bm4:[["Abses submandibula biasanya disertai bengkak dan demam.","Fraktur mandibula memberi gangguan oklusi dan mobilitas segmen.","Alergi obat tidak memberi soket kosong dengan nyeri lokal."],
      ["Kumur keras bisa melepas bekuan dan memperbesar komunikasi.","Kapas di dalam soket menghalangi penyembuhan dan bisa terdorong ke sinus.","Komunikasi oroantral harus dinilai dan ditangani."]],
 bm5:[["Kelas I posisi A adalah kasus paling mudah.","Kelas II hanya sebagian mahkota di ramus.","Kelas I berarti ruang cukup, tidak sesuai dengan mahkota di dalam ramus."],
      ["Posisi sejajar bidang oklusal berkaitan dengan kesulitan, bukan risiko saraf.","Ruang folikel normal tidak menandakan risiko saraf.","Akar jauh dari kanal berarti risiko rendah."]],
 bm6:[["Kecepatan penyembuhan tidak ditentukan ukuran potongan gigi.","Anestesi tetap diperlukan.","Flap tetap dijahit."],
      ["Ketajaman bur tidak dipengaruhi irigasi.","Irigasi tidak dimaksudkan menambah perdarahan.","Irigasi bukan pengganti anestesi."]]
